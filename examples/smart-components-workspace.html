ght.</tspan></text></g></svg></div><div class="tab-panel" data-tab-id="tab-mvcqynpp-9" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1408" height="872" viewBox="0 0 1408 872"><rect x="0" y="0" width="1408" height="872" fill="#ffffff"/><g transform="translate(0 0)"><rect x="18" y="18" width="1304" height="810" fill="#f8fafc" stroke="none"/><rect x="18" y="18" width="7" height="810" fill="#3b82f6" stroke="none"/><text fill="#2563eb" text-anchor="start" style="font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="50" y="49.378936767578125">SMART COMPONENTS  /  09 OF 15</tspan></text><text fill="#0f172a" text-anchor="start" style="font:600 30px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="50" y="96.18607330322266">Count down, reset, repeat</tspan></text><text fill="#475569" text-anchor="start" style="font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="50" y="141.34686660766602">The counter reaches zero, emits completion, and resets itself in settling rounds before the next screen redraw.</tspan></text><rect x="40" y="700" width="1260" height="108" fill="#eaf1fb" stroke="none"/><text fill="#2563eb" text-anchor="start" style="font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="60" y="721.4774932861328">TRY THIS · Editor: double-click controls. HTML: use them directly. Inputs… shows the actual wiring.</tspan></text><text fill="#334155" text-anchor="start" style="font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="60" y="756.1672843933105">1. Turn Run on. Count cycles 3 → 2 → 1 → 3; zero exists briefly inside the settling sequence.</tspan><tspan x="60" y="771.7672843933105">2. The Completed cycles counter still sees eve ,Arial,sans-serif"><tspan x="60" y="721.4774932861328">TRY THIS · Editor: double-click controls. HTML: use them directly. Inputs… shows the actual wiring.</tspan></text><text fill="#334155" text-anchor="start" style="font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="60" y="756.1672843933105">1. Turn Data on. First Clock: A becomes true and B stays false. Second Clock: B becomes true.</tspan><tspan x="60" y="771.7672843933105">2. Change Numeric data, then Clock. The numeric register samples only on the clock’s rising edge.</tspan><tspan x="60" y="787.3672843933106">3. Reset has priority over a simultaneous clock. Held-high clock levels never capture repeatedly.</tspan></text><g data-smart-index="8"><g transform="translate(50 190)"><text fill="#334155" text-anchor="start" style="font:600 13.052631578947368px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="15.200000000000001" y="18.667472076416015">Clock</tspan></text><path d="M161,75.95 L225.4,75.95" fill="none" stroke="#64748b" stroke-width="1.2236842105263157" stroke-linecap="round" stroke-linejoin="round"/><text fill="#334155" text-anchor="middle" style="font:600 8.157894736842104px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan x="198.95000000000002" y="58.55016370750428">Output:</tspan><tspan x="198.95000000000002" y="68.33964370750428">false</tspan></text><rect x="13.799999999999999" y="38.75" width="147.20000000000002" height="74.39999999999999" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/><path d="M46,68.2 L69,68.2 L69,51.150000000000006 L103.5,51.150000000000006 L103.5,68.2 L126.50000000000001,68.2" fill="none" stroke="#64748b" stroke-width="1.631578947368421" stroke-linecap="round" stroke-linejoin="round"/><text fill="#334155" text-anchor="middle" style="font:600 14.68421052631579px -apple-system,BlinkMacSystemFont,&quo

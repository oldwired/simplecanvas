name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  test:
    uses: ./.github/workflows/browser-tests.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp examples/demo-shapes-library.json "$RUNNER_TEMP/shapes-library.json"
          gh release create "$GITHUB_REF_NAME" README.md index.html examples/settings.example.json "$RUNNER_TEMP/shapes-library.json" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - examples/**
      - settings.json
      - reallysimple/settings.json
      - .github/workflows/pages.yml
      - .github/workflows/browser-tests.yml
      - package.json
      - package-lock.json
      - tests/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/browser-tests.yml
    permissions:
      contents: read

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp examples/demo-shapes-library.json _site/shapes-library.json
          if [ -f settings.json ]; then
            cp settings.json _site/settings.json
          fi
          mkdir _site/reallysimple
          cp index.html _site/reallysimple/index.html
          cp reallysimple/settings.json _site/reallysimple/settings.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload public files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

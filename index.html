    if(!items.length){ toast('Nothing to export yet'); return; }
    const m = 24, scale = 2;                              // margin (px) and export supersampling
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const it of items){
      const b = worldBBox(it);   // rotation-aware, so rotated items aren't clipped
      minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+b.w); maxY=Math.max(maxY,b.y+b.h);
    }
    const w = (maxX-minX) + m*2, h = (maxY-minY) + m*2;
    const off = document.createElement('canvas');
    off.width  = Math.max(1, Math.round(w*scale));
    off.height = Math.max(1, Math.round(h*scale));
    const octx = off.getContext('2d');
    octx.setTransform(scale,0,0,scale,0,0);
    octx.translate(-minX + m, -minY + m);                // shift content into the margin box
    octx.fillStyle = BG;
    octx.fillRect(minX - m, minY - m, w, h);

    const real = ctx;
    ctx = octx;
    try { for(const it of items) drawItem(it); }
    finally { ctx = real; }

    const a = document.createElement('a');
    a.href = off.toDataURL('image/png');
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.png';
    a.click();
    toast('Saved PNG');
  }

  // Mirrors drawItem(), but emits SVG markup instead of issuing canvas calls.
  function escXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function smoothPathD(p){
    let d = 'M' + p[0].x + ',' + p[0].y;
    for(let i=1;i<p.length-1;i++){
      const mx=(p[i].x+p[i+1].x)/2, my=(p[i].y+p[i+1].y)/2;
      d += ' Q' + p[i].x + ',' + p[i].y + ' ' + mx + ',' + my;
    }
    d += ' L' + p[p.length-1].x + ',' + p[p.length-1].y;
    return d;
  }
  function itemToSVG(it){
    let inner = '';
    switch(it.type){
      case 'image': {
        const src = assets[it.id];
        if(src) inner = `<image href="${escXml(src)}" x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" preserveAspectRatio="none"/>`;
        break;
      }
      case 'path': {
        const w = strokeWidthOf(it);
        const opacity = it.mode==='marker' ? 0.4 : 1;
        const cap = it.mode==='marker' ? 'square' : 'round';
        if(it.points.length===1){
          const p = it.points[0];
          inner = `<circle cx="${p.x}" cy="${p.y}" r="${Math.max(0.5,w/2)}" fill="${it.color}" opacity="${opacity}"/>`;
        } else {
          inner = `<path d="${smoothPathD(it.points)}" fill="none" stroke="${it.color}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round" opacity="${opacity}"/>`;
        }
        break;
      }
      case 'line': case 'arrow': {
        inner = `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${it.color}" stroke-width="${it.size}" stroke-linecap="round"/>`;
        const head = (fx,fy,tx,ty)=>{   // head at (tx,ty), pointing away from (fx,fy)
          const ang = Math.atan2(ty-fy, tx-fx);
          const len = Math.max(10, it.size*2.6), a = Math.PI/7;
          const hx1 = tx-len*Math.cos(ang-a), hy1 = ty-len*Math.sin(ang-a);
          const hx2 = tx-len*Math.cos(ang+a), hy2 = ty-len*Math.sin(ang+a);
          return `<path d="M${hx1},${hy1} L${tx},${ty} L${hx2},${hy2}" fill="none" stroke="${it.color}" stroke-width="${it.size}" stroke-linecap="round" stroke-linejoin="round"/>`;
        };
        const h = headsOf(it);
        if(h.e) inner += head(it.x1,it.y1,it.x2,it.y2);
        if(h.s) inner += head(it.x2,it.y2,it.x1,it.y1);
        break;
      }
      case 'rect': {
        const fill = it.fill ? (it.fillColor||it.color) : 'none';
        inner = `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="${fill}" stroke="${it.color}" stroke-width="${it.size}" stroke-linejoin="round"/>`;
        break;
      }
      case 'ellipse': {
        const fill = it.fill ? (it.fillColor||it.color) : 'none';
        const cx=it.x+it.w/2, cy=it.y+it.h/2;
        inner = `<ellipse cx="${cx}" cy="${cy}" rx="${Math.abs(it.w/2)}" ry="${Math.abs(it.h/2)}" fill="${fill}" stroke="${it.color}" stroke-width="${it.size}"/>`;
        break;
      }
      case 'polygon': {
        const fill = it.fill ? (it.fillColor||it.color) : 'none';
        const pts = it.points.map(p=>p.x+','+p.y).join(' ');
        inner = `<polygon points="${pts}" fill="${fill}" stroke="${it.color}" stroke-width="${it.size}" stroke-linejoin="round"/>`;
        break;
      }
      case 'text':
        inner = `<text x="${it.x}" y="${it.y}" fill="${it.color}" style="font:${escXml(it.font)}" dominant-baseline="text-before-edge">${escXml(it.text)}</text>`;
        break;
      case 'table': {
        const fill = it.fill ? (it.fillColor||it.color) : 'none';
        let lines = '';
        for(let i=1;i<it.rows;i++){ const yy = it.y+it.h*i/it.rows; lines += `<line x1="${it.x}" y1="${yy}" x2="${it.x+it.w}" y2="${yy}" stroke="${it.color}" stroke-width="${it.size}"/>`; }
        for(let j=1;j<it.cols;j++){ const xx = it.x+it.w*j/it.cols; lines += `<line x1="${xx}" y1="${it.y}" x2="${xx}" y2="${it.y+it.h}" stroke="${it.color}" stroke-width="${it.size}"/>`; }
        inner = `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="${fill}" stroke="${it.color}" stroke-width="${it.size}" stroke-linejoin="round"/>` + lines;
        break;
      }
    }
    // rotation wrapper, matching drawItem's transform order (group rotation outer, own rotation inner)
    let transform = '';
    if(it.group!=null && it.groupRotation){
      const piv = groupPivot(it.group);
      transform += `rotate(${it.groupRotation*180/Math.PI} ${piv.cx} ${piv.cy}) `;
    }
    if(it.rotation){
      const b = bbox(it);
      transform += `rotate(${it.rotation*180/Math.PI} ${b.x+b.w/2} ${b.y+b.h/2})`;
    }
    transform = transform.trim();
    return transform ? `<g transform="${transform}">${inner}</g>` : inner;
  }
  function saveSvg(){
    if(!items.length){ toast('Nothing to export yet'); return; }
    const m = 24;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const it of items){
      const b = worldBBox(it);
      minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+b.w); maxY=Math.max(maxY,b.y+b.h);
    }
    const w = (maxX-minX) + m*2, h = (maxY-minY) + m*2;
    const ox = -minX + m, oy = -minY + m;
    let body = '';
    for(const it of items) body += itemToSVG(it);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(h)}" viewBox="0 0 ${w} ${h}">`
      + `<rect x="0" y="0" width="${w}" height="${h}" fill="${BG}"/>`
      + `<g transform="translate(${ox} ${oy})">${body}</g>`
      + `</svg>`;
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.svg';
    a.click();
    URL.revokeObjectURL(url);
    toast('Saved SVG');
  }

  // ---------- save / open the sketch as a file (our own JSON format) ----------
  function exportProject(){
    const data = {
      app: 'SimpleCanvas',
      version: FORMAT_VERSION,
      savedAt: new Date().toISOString(),
      items,
      assets: referencedAssets()
    };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Sketch saved to file');
  }
  function importProject(file){
    const r = new FileReader();
    r.onload = ()=>{
      let data;
      try { data = JSON.parse(r.result); }
      catch(e){ toast('Not a valid sketch file'); return; }
      if(!data || data.app !== 'SimpleCanvas' || !Array.isArray(data.items)){
        toast('That is not a SimpleCanvas file'); return;
      }
      if(typeof data.version === 'number' && data.version > FORMAT_VERSION &&
         !confirm('This file was saved by a newer version ('+data.version+'). Open it anyway?')) return;
      if(items.length && !confirm('Replace the current sketch with the opened file?')) return;
      beginHistory();
      items = data.items.filter(it => it && it.mode !== 'eraser');
      if(data.assets) Object.assign(assets, data.assets);
      selection = [];
      commitHistory();
      render();
      toast('Sketch loaded');
    };
    r.onerror = ()=>toast('Could not read that file');
    r.readAsText(file);
  }

  // ---------- toolbar wiring ----------
  function setTool(t){
    if(ui.tool==='polygon' && polyDraft && t!=='polygon') cancelPolygon();
    ui.tool = t;
    document.querySelectorAll('[data-tool].btn').forEach(b=>{
      const on = b.dataset.tool===t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    canvas.className = 'tool-'+t;
    if(t!=='select'){ selection=[]; marquee=null; }
    if(t!=='eraser') cursorPt=null;
    if(t!=='table') setTablePicker(false);
    const isText = (t==='text');
    const isSelect = (t==='select');
    const canFill = (t==='rect' || t==='ellipse' || t==='polygon' || t==='table');   // fill only makes sense for these
    const usesColor = !isSelect && t!=='eraser';     // hide the palette where it has no effect
    const usesSize = !isText && !isSelect;
    colorGroup.style.display = usesColor ? '' : 'none';
    colorSep.style.display = usesColor ? '' : 'none';
    optsSep.style.display = (usesSize || isText) ? '' : 'none';
    textOpts.style.display = isText ? '' : 'none';
    sizeGroup.style.display = usesSize ? '' : 'none';
    targetBtn.style.display = canFill ? '' : 'none';
    fillGroup.style.display = canFill ? '' : 'none';
    if(!canFill) ui.colorTarget = 'stroke';          // no fill → palette edits the stroke
    refreshColorUI();
    render();
  }
  document.querySelectorAll('[data-tool].btn').forEach(b=>{
    if(b.dataset.tool==='table') return;   // opens the size picker instead — wired separately below
    b.addEventListener('click', ()=>setTool(b.dataset.tool));
  });

  // ---------- table size picker: drag/click across a grid to pick rows & columns, Word/Excel-style ----------
  const tableBtn = document.getElementById('tableBtn');
  const tablePicker = document.getElementById('tablePicker');
  const tableGrid = document.getElementById('tableGrid');
  const tablePickerLabel = document.getElementById('tablePickerLabel');
  const TABLE_MAX_ROWS = 8, TABLE_MAX_COLS = 10;
  const tableCells = [];
  for(let r=1;r<=TABLE_MAX_ROWS;r++){
    for(let c=1;c<=TABLE_MAX_COLS;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('mouseenter', ()=>highlightTablePicker(r,c));
      cell.addEventListener('click', e=>{
        e.stopPropagation();
        ui.tableRows = r; ui.tableCols = c;
        setTablePicker(false);
        toast('Click the canvas to place a ' + c + '×' + r + ' table');
      });
      tableGrid.appendChild(cell);
      tableCells.push(cell);
    }
  }
  function highlightTablePicker(r,c){
    for(const cell of tableCells){
      const cr = +cell.dataset.r, cc = +cell.dataset.c;
      cell.classList.toggle('hi', cr<=r && cc<=c);
    }
    tablePickerLabel.textContent = c + ' × ' + r;
  }
  tableGrid.addEventListener('mouseleave', ()=>highlightTablePicker(ui.tableRows, ui.tableCols));
  function setTablePicker(open){
    tablePicker.hidden = !open;
    tableBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) highlightTablePicker(ui.tableRows, ui.tableCols);
  }
  function activateTableTool(){ setTool('table'); setTablePicker(true); }
  tableBtn.addEventListener('click', e=>{ e.stopPropagation(); activateTableTool(); });
  document.addEventListener('click', e=>{
    if(!tablePicker.hidden && !tablePicker.contains(e.target) && e.target!==tableBtn) setTablePicker(false);
  });

  // a single palette, retargeted between stroke and fill by the toggle button
  const swatchBox = document.getElementById('swatches');
  const targetBtn = document.getElementById('colorTarget');
  const targetDot = document.getElementById('targetDot');
  const targetLbl = document.getElementById('targetLbl');

  PRESETS.forEach(c=>{
    const s = document.createElement('button');
    s.type = 'button';
    s.className = 'swatch';
    if(c==='#ffffff') s.classList.add('light');
    s.dataset.c = c;
    s.style.background = c;
    s.title = c;
    s.setAttribute('aria-label', 'Color ' + c);
    s.addEventListener('click', ()=>applyColor(c));
    swatchBox.appendChild(s);
  });

  function refreshColorUI(){
    const onFill = ui.colorTarget === 'fill';
    const c = onFill ? ui.fillColor : ui.color;
    colorPick.value = c;
    targetLbl.textContent = onFill ? 'Fill' : 'Stroke';
    targetDot.style.background = c;
    swatchBox.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s.dataset.c===c));
  }
  function applyColor(c){
    if(ui.colorTarget === 'fill'){
      ui.fillColor = c;
      if(!fillInput.checked){ fillInput.checked = true; ui.fill = true; }  // choosing a fill color turns Fill on
    } else {
      ui.color = c;
    }
    refreshColorUI();
  }
  colorPick.addEventListener('input', e=>applyColor(e.target.value));
  targetBtn.addEventListener('click', ()=>{
    ui.colorTarget = ui.colorTarget === 'fill' ? 'stroke' : 'fill';
    refreshColorUI();
  });

  sizeInput.addEventListener('input', e=>{
    ui.size = +e.target.value;
    sizeVal.innerHTML = ui.size + '&nbsp;px';
  });
  fillInput.addEventListener('change', e=>{ ui.fill = e.target.checked; });
  fontFamilySel.addEventListener('change', e=>{ ui.fontFamily = e.target.value; });
  fontSizeSel.addEventListener('change', e=>{ ui.fontSize = +e.target.value; });

  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  toDupBtn.addEventListener('click', duplicateSelection);
  groupBtn.addEventListener('click', groupSelection);
  ungroupBtn.addEventListener('click', ungroupSelection);
  toFrontBtn.addEventListener('click', bringToFront);
  toBackBtn.addEventListener('click', sendToBack);
  delSelBtn.addEventListener('click', deleteSelected);
  // hamburger menu (file & canvas actions)
  const projectInput = document.getElementById('projectInput');
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  const MENU_ACTIONS = {
    save: exportProject,
    open: ()=>projectInput.click(),
    png: savePng,
    svg: saveSvg,
    print: ()=>window.print(),
    clear: clearAll,
  };
  function menuItems(){ return [...menu.querySelectorAll('button[data-act]')]; }
  function setMenu(open){
    menu.hidden = !open;
    menuBtn.classList.toggle('active', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) menuItems()[0].focus();
  }
  menuBtn.addEventListener('click', e=>{ e.stopPropagation(); setMenu(menu.hidden); });
  menuBtn.addEventListener('keydown', e=>{
    if((e.key==='ArrowDown' || e.key==='ArrowUp') && menu.hidden){ e.preventDefault(); setMenu(true); }
  });
  menu.addEventListener('keydown', e=>{
    const els = menuItems();
    const i = els.indexOf(document.activeElement);
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      els[(i + (e.key==='ArrowDown' ? 1 : -1) + els.length) % els.length].focus();
    } else if(e.key==='Home'){ e.preventDefault(); els[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); els[els.length-1].focus(); }
    else if(e.key==='Escape'){ setMenu(false); menuBtn.focus(); }
    else if(e.key==='Tab'){ setMenu(false); }
    e.stopPropagation();          // don't trigger canvas shortcuts while the menu is open
  });
  menu.addEventListener('click', e=>{
    const b = e.target.closest('button[data-act]'); if(!b) return;
    setMenu(false);
    menuBtn.focus();
    const fn = MENU_ACTIONS[b.dataset.act]; if(fn) fn();
  });
  document.addEventListener('click', e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==menuBtn) setMenu(false); });
  projectInput.addEventListener('change', e=>{ if(e.target.files[0]) importProject(e.target.files[0]); e.target.value=''; });

  // image insert / paste / drop
  const fileInput = document.getElementById('fileInput');
  document.getElementById('insertImg').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=''; });

  window.addEventListener('paste', e=>{
    if(textInput.style.display==='block') return;     // let the text editor handle pastes
    const list = e.clipboardData && e.clipboardData.items;
    if(list){
      for(const it of list){
        if(it.type && it.type.indexOf('image')===0){
          const f = it.getAsFile();
          if(f){ e.preventDefault(); readFile(f); return; }   // a real image on the clipboard wins
        }
      }
    }
    if(clipboard.length){ e.preventDefault(); pasteClipboard(); }  // otherwise paste copied canvas items
  });

  ['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev, e=>{
    e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
  }));
  wrap.addEventListener('drop', e=>{
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    const r = canvas.getBoundingClientRect();
    const place = { x:e.clientX-r.left, y:e.clientY-r.top };
    for(const f of files){ if(f.type.indexOf('image')===0){ readFile(f, place); break; } }
  });

  // ---------- keyboard ----------
  const TOOL_KEYS = {v:'select',p:'pen',m:'marker',b:'brush',e:'eraser',l:'line',a:'arrow',r:'rect',o:'ellipse',g:'polygon',t:'text',y:'table'};
  window.addEventListener('keydown', e=>{
    if(textInput.style.display==='block') return;
    if(e.key==='Escape'){
      if(ui.tool==='polygon' && polyDraft){ cancelPolygon(); return; }
      if(current){ current=null; snapPt=null; historyBefore=null; render(); return; }   // cancel an in-progress draw, before the button is even lifted
      if(!menu.hidden){ setMenu(false); return; }
      if(!tablePicker.hidden){ setTablePicker(false); return; }
      if(selection.length){ selection=[]; render(); }      // Esc also deselects
      return;
    }
    if(e.key==='Enter' && ui.tool==='polygon' && polyDraft){ e.preventDefault(); finishPolygon(); return; }
    const mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(mod && e.key.toLowerCase()==='c'){ copySelection(); return; }            // paste is handled by the paste event
    if(mod && e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSelection(); return; }
    if(mod && e.key.toLowerCase()==='g'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); return; }
    if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); exportProject(); return; }
    if(mod && e.key.toLowerCase()==='o'){ e.preventDefault(); projectInput.click(); return; }
    if(mod) return;
    if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelected(); return; }
    if(e.key===']'){ bringToFront(); return; }
    if(e.key==='['){ sendToBack(); return; }
    // nudge the selection with the arrow keys — 1px, or 10px with Shift. A held-down key auto-repeats
    // (e.repeat) into many keydowns; those all fold into the one undo step opened by the first press.
    if((e.key==='ArrowLeft' || e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='ArrowDown') && ui.tool==='select' && selection.length){
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key==='ArrowLeft' ? -step : e.key==='ArrowRight' ? step : 0;
      const dy = e.key==='ArrowUp' ? -step : e.key==='ArrowDown' ? step : 0;
      if(!e.repeat) beginHistory();
      for(const i of selection) translateItem(items[i], dx, dy);
      render();
      return;
    }
    // rotate the selected item — or whole group — by 15° with , / .
    if((e.key===',' || e.key==='.') && ui.tool==='select' && selection.length){
      const piv = rotationPivotFor(selection);
      if(piv){
        e.preventDefault();
        beginHistory();
        const delta = (Math.PI/12) * (e.key==='.' ? 1 : -1);
        const field = piv.isGroup ? 'groupRotation' : 'rotation';
        for(const idx of piv.members) items[idx][field] = (items[idx][field]||0) + delta;
        commitHistory();
        return;
      }
    }
    const t = TOOL_KEYS[e.key.toLowerCase()];
    if(t==='table'){ activateTableTool(); }
    else if(t){ setTool(t); }
  });
  window.addEventListener('keyup', e=>{
    if(e.key==='ArrowLeft' || e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='ArrowDown') commitHistory();
  });

  canvas.addEventListener('dblclick', e=>{
    if(ui.tool==='polygon' && polyDraft){
      // the two clicks that make up this dblclick each already added a vertex via onDown — the
      // second one is essentially an accidental duplicate, so drop it before closing the shape
      if(polyDraft.points.length>3) polyDraft.points.pop();
      finishPolygon();
      return;
    }
    if(ui.tool!=='select') return;
    const {x,y} = pos(e);
    const hit = hitTest(x,y);
    if(hit>=0 && items[hit].type==='text'){
      openText(items[hit].x, items[hit].y, hit);
      return;
    }
    if(selection.length){
      const piv = rotationPivotFor(selection);
      if(piv && piv.rotation){
        const lp = rotatePoint(x,y,piv.cx,piv.cy,-piv.rotation);
        if(Math.hypot(lp.x-piv.handleX, lp.y-piv.handleY) <= 9){
          beginHistory();
          const field = piv.isGroup ? 'groupRotation' : 'rotation';
          for(const idx of piv.members) items[idx][field] = 0;
          commitHistory(); render();
        }
      }
    }
  });

  // ---------- pointer listeners ----------
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', ()=>{ if(cursorPt){ cursorPt=null; render(); } });
  canvas.addEventListener('contextmenu', e=>{
    if(ui.tool!=='select') e.preventDefault();
    if(ui.tool==='polygon' && polyDraft) finishPolygon();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('beforeunload', save);

  // When the toolbar wraps, a separator can end up first or last on a row, divorcing nothing from
  // nothing. Hide those. Walk in DOM order twice: hiding one can pull the next item up a row.
  const toolbarEl = document.querySelector('.toolbar');
  function tidySeps(){
    const seps = toolbarEl.querySelectorAll('.sep');
    const shown = el => el && el.offsetParent !== null;
    const rowOf = el => { const r = el.getBoundingClientRect(); return Math.round((r.top + r.bottom)/2); };
    for(let pass=0; pass<2; pass++){
      seps.forEach(s=>{
        s.classList.remove('row-edge');
        if(s.style.display==='none') return;
        let p = s.previousElementSibling; while(p && !shown(p)) p = p.previousElementSibling;
        let n = s.nextElementSibling;     while(n && !shown(n)) n = n.nextElementSibling;
        if(!p || !n || Math.abs(rowOf(p)-rowOf(n)) > 10) s.classList.add('row-edge');
      });
    }
  }
  window.addEventListener('resize', tidySeps);
  new MutationObserver(tidySeps).observe(toolbarEl, {attributes:true, subtree:true, attributeFilter:['style']});
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });

  // ---------- boot ----------
  // show the platform's own modifier in shortcut hints (⌘ on Mac, Ctrl elsewhere)
  const isMac = /Mac|iPhone|iPad/i.test(navigator.platform || '');
  const modKey = isMac ? '⌘' : 'Ctrl';
  document.querySelectorAll('[title]').forEach(el=>{
    if(el.title.indexOf('⌘/Ctrl')>=0) el.title = el.title.split('⌘/Ctrl').join(modKey);
  });
  document.querySelectorAll('.menu .sc').forEach(el=>{
    el.textContent = el.textContent.replace('⌘', isMac ? '⌘' : 'Ctrl+');
  });
  const hintKbd = hint.querySelector('kbd');
  if(hintKbd) hintKbd.textContent = modKey;
  // icons are decorative; the buttons' titles carry the meaning
  document.querySelectorAll('.toolbar svg').forEach(s=>s.setAttribute('aria-hidden','true'));

  load();
  setTool('pen');
  refreshColorUI();
  sizeVal.innerHTML = ui.size + '&nbsp;px';
  resize();
  updateButtons();
  tidySeps();
})();
</script>
</body>
</html>

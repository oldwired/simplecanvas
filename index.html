    if(it.rotation) next.rotation = it.rotation;
    if(it.group!=null){ next.group = it.group; next.groupRotation = it.groupRotation||0; }
    if(hs) next.hs = true;
    if(he) next.he = true;
    items[idx] = next;
  }
  // Bakes a curve's own rotation into its absolute point/handle coordinates, right before a point or
  // handle drag begins — same idea as endDrag's endpoint-drag bake ("bake any rotation into the stored
  // coordinates so the endpoint can be moved in world space"). Without this, toLocal/toWorld derive the
  // rotation pivot from bbox(it), which itself shifts as the very point being dragged moves — so every
  // OTHER point visibly drifts too, chasing a moving pivot, for exactly as long as rotation is nonzero.
  function bakeItemRotation(it){
    if(!it.rotation) return;
    const b = bbox(it);
    const cx = b.x+b.w/2, cy = b.y+b.h/2, rot = it.rotation;
    for(const p of it.points){
      const rp = rotatePoint(p.x, p.y, cx, cy, rot); p.x = norm(rp.x); p.y = norm(rp.y);
      if(p.c1){ const rc = rotatePoint(p.c1.x, p.c1.y, cx, cy, rot); p.c1 = {x:norm(rc.x), y:norm(rc.y)}; }
      if(p.c2){ const rc = rotatePoint(p.c2.x, p.c2.y, cx, cy, rot); p.c2 = {x:norm(rc.x), y:norm(rc.y)}; }
    }
    delete it.rotation;
  }

  // ---------- eraser: rubs out freehand strokes, deletes shapes/text/images it touches ----------
  function eraserR(){ return Math.max(6, ui.size); }
  // Cut a freehand stroke wherever it passes under the eraser ring; returns the
  // surviving sub-strokes (0 or more), or null if the ring didn't touch this stroke.
  // Where the segment p->q crosses the circle (c, r): parametric t values in (0,1), each tagged with
  // whether the segment is entering the circle there or leaving it.
  const NO_CUTS = [];   // shared miss result — this runs for every segment of every stroke per eraser step
  function segCircleCuts(p, q, cx, cy, r){
    const dx=q.x-p.x, dy=q.y-p.y, fx=p.x-cx, fy=p.y-cy;
    const a = dx*dx+dy*dy; if(!a) return NO_CUTS;
    const b = 2*(fx*dx+fy*dy), c = fx*fx+fy*fy-r*r;
    let disc = b*b-4*a*c; if(disc<=0) return NO_CUTS;
    disc = Math.sqrt(disc);
    return [{t:(-b-disc)/(2*a), enter:true}, {t:(-b+disc)/(2*a), enter:false}].filter(o=>o.t>0 && o.t<1);
  }
  function splitPath(it, x, y, r){
    const t = r + strokeWidthOf(it)/2;   // hit the painted ink, not just the centerline
    const lp = toLocal(it, x, y);        // rotated strokes are stored in local coords
    const pts = it.points;
    const inside = p => Math.hypot(p.x-lp.x, p.y-lp.y) <= t;
    const runs=[]; let cur=[]; let changed=false;
    const cut = ()=>{ if(cur.length) runs.push(cur); cur=[]; changed=true; };
    for(let i=0;i<pts.length;i++){
      const p = pts[i];
      if(inside(p)) cut(); else cur.push(p);   // the original stroke is replaced by its fragments, so its points can be reused as they are
      if(i===pts.length-1) break;
      // the painted segment to the next vertex can dip through the ring even when neither vertex does
      const q = pts[i+1];
      for(const c of segCircleCuts(p, q, lp.x, lp.y, t)){
        const ip = { x:norm(p.x+(q.x-p.x)*c.t), y:norm(p.y+(q.y-p.y)*c.t) };
        if(c.enter){ cur.push(ip); cut(); }
        else { if(cur.length) runs.push(cur); cur=[ip]; }
      }
    }
    if(cur.length) runs.push(cur);
    if(!changed) return null;
    const b = bbox(it), cx=b.x+b.w/2, cy=b.y+b.h/2;
    return runs.filter(run=>run.length>1 || pts.length===1).map(run=>{
      const frag = Object.assign({}, it, {points:run, uid:newUid()});
      if(it.rotation){
        // own rotation pivots on the bbox center, and the fragment's center is elsewhere: shift it so
        // the rotated (world) ink lands exactly where the original ink was
        const fb = bbox(frag), fx=fb.x+fb.w/2, fy=fb.y+fb.h/2;
        const rc = rotatePoint(fx, fy, cx, cy, it.rotation);
        translateItem(frag, rc.x-fx, rc.y-fy);
      }
      return frag;
    });
  }
  function eraseAt(x,y){
    const r = eraserR();
    let removed = false;
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      if(it.type !== 'path') continue;            // eraser only affects freehand strokes
      const wb = worldBBox(it);                   // cheap reject before walking every vertex (the box already includes the stroke)
      if(x < wb.x-r || x > wb.x+wb.w+r || y < wb.y-r || y > wb.y+wb.h+r) continue;
      let res = splitPath(it, x, y, r);
      if(res && it.group!=null && it.groupRotation){
        // splitting changes the group's bounding box and so its rotation pivot, which would swing every
        // member: fold the group rotation into the members first, then split in the new local frame
        bakeGroupRotation(it.group);
        res = splitPath(it, x, y, r);
      }
      if(res){ items.splice(i, 1, ...res); removed = true; }
    }
    return removed;
  }

  // Point-edit mode is only valid while it's exactly the sole selected item, still a polygon —
  // every state-changing handler already ends in render(), so checking this once here self-heals
  // the mode instead of requiring every place selection/items can change to be patched individually.
  function syncPointEdit(){
    if(pointEditIdx!=null && !(selection.length===1 && selection[0]===pointEditIdx &&
       items[pointEditIdx] && items[pointEditIdx].type==='polygon')){
      pointEditIdx = null; activeAnchor = null;
    }
    if(activeAnchor!=null && (pointEditIdx==null || activeAnchor>=items[pointEditIdx].points.length)) activeAnchor = null;
  }

  // ---------- render ----------
  function render(){
    syncPointEdit();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,cssW,cssH);

    items.forEach((it,i)=>{
      if(i===editingTextIdx && !editingCell) return;   // whole item hidden while editing a plain text box
      drawItem(it, i===editingTextIdx ? editingCell : null);
    });
    if(current){
      if(current.type==='polygon') drawPolygonDraft(current);
      else {
        drawItem(current);
        if(current.type==='text' && !current.fill && !strokeOn(current)) drawTextDraftOutline(current);
      }
    }

    // selection outlines, rotation/resize handles, and the rubber-band box — suppressed while
    // editing text, since the input's own box never quite matches the item's drawn outline
    if(ui.tool==='select' && editingTextIdx==null){
      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#6366f1';
      // dashed outline for each ungrouped selected item — rotated along with the item itself
      ctx.setLineDash([5,4]);
      for(const i of selection){
        const it = items[i]; if(!it || it.group!=null) continue;
        if(i===pointEditIdx) continue;   // point-edit overlay replaces the plain dashed outline
        const b = bbox(it);
        const cx=b.x+b.w/2, cy=b.y+b.h/2;
        ctx.save();
        if(it.rotation){ ctx.translate(cx,cy); ctx.rotate(it.rotation); ctx.translate(-cx,-cy); }
        ctx.strokeRect(b.x-3, b.y-3, b.w+6, b.h+6);
        ctx.restore();
      }
      // solid box around each selected group — rotates as one rigid piece with its members
      ctx.setLineDash([]);
      const seenGroups = new Set();
      for(const i of selection){
        const it = items[i]; if(!it || it.group==null || seenGroups.has(it.group)) continue;
        seenGroups.add(it.group);
        const piv = groupPivot(it.group);
        const u = piv.box;
        const grot = it.groupRotation||0;
        ctx.save();
        if(grot){ ctx.translate(piv.cx,piv.cy); ctx.rotate(grot); ctx.translate(-piv.cx,-piv.cy); }
        ctx.strokeRect(u.x-4, u.y-4, u.w+8, u.h+8);
        ctx.restore();
      }
      // resize handles — 4 corners of the lone item's box, or of the whole group's box
      if(selection.length){
        const rp = resizePivotFor(selection);
        if(rp){
          const b = rp.box;
          ctx.save();
          if(rp.rotation){ ctx.translate(rp.cx,rp.cy); ctx.rotate(rp.rotation); ctx.translate(-rp.cx,-rp.cy); }
          ctx.setLineDash([]);
          ctx.fillStyle = '#fff'; ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
          for(const [hx,hy] of [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]]){
            ctx.beginPath(); ctx.rect(hx-5, hy-5, 10, 10); ctx.fill(); ctx.stroke();
          }
          ctx.restore();
        }
      }
      // point-edit overlay: solid indigo squares mark every anchor (always visible in this mode);
      // the active anchor gets a hollow highlight plus its two hollow-square handles on thin stems
      // — same 10x10 square as the corner-resize handles, just filled/hollow to tell them apart
      if(pointEditIdx!=null){
        const pit = items[pointEditIdx];
        if(pit && pit.type==='polygon'){
          ctx.save();
          ctx.setLineDash([]);
          for(const p of pit.points){
            const w = toWorld(pit, p.x, p.y);
            ctx.fillStyle = '#6366f1';
            ctx.beginPath(); ctx.rect(w.x-5, w.y-5, 10, 10); ctx.fill();
          }
          if(activeAnchor!=null && pit.points[activeAnchor]){
            const p = pit.points[activeAnchor], aw = toWorld(pit, p.x, p.y);
            ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1;
            for(const hk of ['c1','c2']){
              const target = p[hk] || defaultHandleOffset(pit, activeAnchor, hk);
              if(!target) continue;
              const hw = toWorld(pit, target.x, target.y);
              ctx.beginPath(); ctx.moveTo(aw.x, aw.y); ctx.lineTo(hw.x, hw.y); ctx.stroke();
              ctx.beginPath(); ctx.rect(hw.x-5, hw.y-5, 10, 10);
              ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
            }
            ctx.beginPath(); ctx.rect(aw.x-5, aw.y-5, 10, 10);
            ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();   // active anchor reads as "selected"
          }
          ctx.restore();
        }
      }
      // endpoint handles — round knobs on both ends of a lone line/arrow
      const li = loneLineIdx(selection);
      if(li!=null){
        ctx.setLineDash([]);
        // filled knob = arrowhead at that end; a plain click on a knob toggles it
        ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
        const h = headsOf(items[li]);
        lineEnds(items[li]).forEach((p,k)=>{
          ctx.fillStyle = (k===0 ? h.s : h.e) ? '#6366f1' : '#fff';
          ctx.beginPath(); ctx.arc(p.x, p.y, 5.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        });
      }
      // rotation handle — a small knob above the item (or above the whole group's box)
      if(selection.length){
        const piv = rotationPivotFor(selection);
        if(piv){
          ctx.save();
          if(piv.rotation){ ctx.translate(piv.cx,piv.cy); ctx.rotate(piv.rotation); ctx.translate(-piv.cx,-piv.cy); }
          ctx.setLineDash([]);
          ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(piv.handleX, piv.stemTop); ctx.lineTo(piv.handleX, piv.handleY); ctx.stroke();
          ctx.beginPath(); ctx.arc(piv.handleX, piv.handleY, 8, 0, Math.PI*2);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#6366f1'; ctx.stroke();
          ctx.restore();
        }
      }
      if(marquee){
        const r = marqueeRect();
        ctx.setLineDash([3,3]); ctx.strokeStyle = '#818cf8';
        for(let i=0;i<items.length;i++){
          if(rectsIntersect(worldBBox(items[i]), r)){ const b = worldBBox(items[i]); ctx.strokeRect(b.x-3, b.y-3, b.w+6, b.h+6); }
        }
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#6366f1'; ctx.fillStyle = 'rgba(99,102,241,.10)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      }
      ctx.restore();
    }

    // snap targets — small dots at the magnet points of whichever single object the cursor is
    // currently over, shown only while a line/arrow endpoint is actually being placed or dragged
    const snappingNow = endDrag || (current && (current.type==='line' || current.type==='arrow'));
    if(snappingNow && snapCursorPt){
      const excludeIdx = endDrag ? endDrag.idx : null;
      const hoverIdx = hitTest(snapCursorPt.x, snapCursorPt.y, excludeIdx);
      if(hoverIdx>=0){
        ctx.save();
        ctx.setLineDash([]);
        ctx.lineWidth = 1.5;
        ctx.fillStyle = '#9ca3af';
        ctx.strokeStyle = '#fff';
        for(const p of snapAnchorsOf(items[hoverIdx])){
          ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }
    }

    // snap indicator — ring around the anchor a line/arrow endpoint is magnetized to
    if(snapPt){
      ctx.save();
      ctx.setLineDash([]);
      ctx.lineWidth = 2; ctx.strokeStyle = '#6366f1';
      ctx.beginPath(); ctx.arc(snapPt.x, snapPt.y, 7, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // eraser size ring
    if(ui.tool==='eraser' && cursorPt){
      ctx.save();
      ctx.setLineDash([3,3]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#9ca3af';
      ctx.beginPath();
      ctx.arc(cursorPt.x, cursorPt.y, eraserR(), 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    hint.style.display = (items.length===0 && !current) ? 'block' : 'none';
    updateOrderButtons();
    updatePolyButtons();
  }

  // ---------- pointer interaction ----------
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x:norm(e.clientX-r.left), y:norm(e.clientY-r.top) };
  }

  function onDown(e){
    if(e.button!==undefined && e.button!==0) return;
    if(textInput.style.display==='block'){ commitText(); }
    const {x,y} = pos(e);
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}   // a pointer that is already gone (or synthetic) has no capture

    if(ui.tool==='select'){
      // rotation handle — of the lone selected item, or of the whole group if a group is selected
      if(selection.length){
        const piv = rotationPivotFor(selection);
        if(piv){
          let lp = {x,y};
          if(piv.rotation) lp = rotatePoint(x,y,piv.cx,piv.cy,-piv.rotation);
          if(Math.hypot(lp.x-piv.handleX, lp.y-piv.handleY) <= 11){
            beginHistory();
            rotating = { cx:piv.cx, cy:piv.cy, startAngle:Math.atan2(y-piv.cy, x-piv.cx),
                         startRotation:piv.rotation, field: piv.isGroup?'groupRotation':'rotation',
                         members:piv.members, moved:false };
            return;
          }
        }
      }
      // point-edit mode: the active anchor's own handles first (smaller target, drawn on top), then
      // any anchor square (clicking one makes it active AND starts dragging it)
      if(pointEditIdx!=null && selection.length===1 && selection[0]===pointEditIdx){
        const pit = items[pointEditIdx];
        if(activeAnchor!=null && pit.points[activeAnchor]){
          const p = pit.points[activeAnchor];
          for(const hk of ['c1','c2']){
            const target = p[hk] || defaultHandleOffset(pit, activeAnchor, hk);
            if(!target) continue;
            const w = toWorld(pit, target.x, target.y);
            if(Math.hypot(x-w.x, y-w.y) <= HANDLE_SUB){
              beginHistory();
              bakeItemRotation(pit);   // so dragging this handle can't chase a rotation pivot that moves with it
              editingAnchor = { idx:pointEditIdx, pointIndex:activeAnchor, handle:hk, sx:x, sy:y, moved:false };
              return;
            }
          }
        }
        for(let pi=0; pi<pit.points.length; pi++){
          const w = toWorld(pit, pit.points[pi].x, pit.points[pi].y);
          if(Math.hypot(x-w.x, y-w.y) <= HANDLE){
            activeAnchor = pi;
            beginHistory();
            bakeItemRotation(pit);   // so dragging this anchor can't chase a rotation pivot that moves with it
            editingAnchor = { idx:pointEditIdx, pointIndex:pi, handle:'anchor', sx:x, sy:y, moved:false };
            render();
            return;
          }
        }
      }
      // endpoint handles of a lone line/arrow — drag one end, the other stays put
      const li = loneLineIdx(selection);
      if(li!=null){
        const it = items[li], ends = lineEnds(it);
        for(let k=0;k<2;k++){
          if(Math.hypot(x-ends[k].x, y-ends[k].y) <= HANDLE){
            beginHistory();
            // bake any rotation into the stored coordinates so the endpoint can be moved in world space
            it.x1=norm(ends[0].x); it.y1=norm(ends[0].y); it.x2=norm(ends[1].x); it.y2=norm(ends[1].y); delete it.rotation;
            endDrag = { idx:li, end:k+1, sx:x, sy:y, moved:false };   // a click without a drag toggles the head instead
            return;
          }
        }
      }
      // resize handles — 4 corners of the lone item's box, or of the whole group's box
      if(selection.length){
        const rp = resizePivotFor(selection);
        if(rp){
          const lp = rp.rotation ? rotatePoint(x,y,rp.cx,rp.cy,-rp.rotation) : {x,y};
          const b = rp.box;
          const corners = {
            nw:{x:b.x,       y:b.y,       ax:b.x+b.w, ay:b.y+b.h},
            ne:{x:b.x+b.w,   y:b.y,       ax:b.x,     ay:b.y+b.h},
            sw:{x:b.x,       y:b.y+b.h,   ax:b.x+b.w, ay:b.y},
            se:{x:b.x+b.w,   y:b.y+b.h,   ax:b.x,     ay:b.y},
          };
          let hitHandle = null, bestD = HANDLE;
          for(const key in corners){
            const c = corners[key];
            const d = Math.hypot(lp.x-c.x, lp.y-c.y);
            if(d<=bestD){ bestD=d; hitHandle=key; }
          }
          if(hitHandle){
            const c = corners[hitHandle];
            // The scale anchor must be the item's own (unpadded) opposite corner, not the padded bbox
            // corner `c.ax,ay` above — the padding (half the stroke width) doesn't scale along with
            // everything else, so anchoring at the padded corner leaves it sitting at a fixed offset
            // from a corner that itself just moved, and the visible opposite handle visibly drifts by
            // pad*(scale-1) — worse at heavier stroke widths. Anchoring at the true corner instead scales
            // it to itself (a fixed point of the transform), so the constant padding still lines up
            // exactly with it afterward. (Ctrl/center-anchored resize is unaffected: pad only ever
            // shifts a corner, never the box's center, so `centerX,centerY` below was already exact.)
            const ob = rp.ownBox;
            const ownCorners = {
              nw:{x:ob.x,      y:ob.y,      ax:ob.x+ob.w, ay:ob.y+ob.h},
              ne:{x:ob.x+ob.w, y:ob.y,      ax:ob.x,      ay:ob.y+ob.h},
              sw:{x:ob.x,      y:ob.y+ob.h, ax:ob.x+ob.w, ay:ob.y},
              se:{x:ob.x+ob.w, y:ob.y+ob.h, ax:ob.x,      ay:ob.y},
            };
            const oc = ownCorners[hitHandle];
            beginHistory();
            const Aw = rp.rotation ? rotatePoint(oc.ax, oc.ay, rp.cx, rp.cy, rp.rotation) : {x:oc.ax, y:oc.ay};
            resizing = {
              rotation:rp.rotation,
              anchorX:oc.ax, anchorY:oc.ay,
              anchorWorldX:Aw.x, anchorWorldY:Aw.y,
              cornerX:c.x, cornerY:c.y,          // PADDED dragged corner — feeds the Ctrl/center anchor's own origSignedW/H
              centerX:rp.cx, centerY:rp.cy,      // center anchor — valid as local AND world AND rotation pivot
              origW: b.w, origH: b.h,
              origSignedW: oc.x-oc.ax, origSignedH: oc.y-oc.ay,
              snapshots: rp.members.map(idx=>({idx, snap:snapshotOf(items[idx])})),
              moved:false
            };
            return;
          }
        }
      }
      const hit = hitTest(x,y);
      if(hit>=0){
        const hitItem = items[hit];
        const g = hitItem.group;
        const grp = (g!=null) ? itemsInGroup(g) : [hit];         // grouped item → grab the whole group
        const wasAlreadySelected = selection.indexOf(hit) >= 0;
        if(e.shiftKey){
          if(selection.indexOf(hit)>=0){ selection = selection.filter(i=>grp.indexOf(i)<0); render(); return; }
          for(const i of grp) if(selection.indexOf(i)<0) selection.push(i);
        } else if(selection.indexOf(hit)<0){
          selection = grp.slice();
        }
        beginHistory();
        drag = {sx:x, sy:y, moved:false, hitIdx:hit, wasAlreadySelected};
        if(hitItem.type==='text' || hitItem.type==='table'){
          const textIdx = hit;
          const cellAtDown = hitItem.type==='table' ? tableCellAt(hitItem, toLocal(hitItem,x,y).x, toLocal(hitItem,x,y).y) : null;
          longPressTimer = setTimeout(()=>{
            longPressTimer = null;
            if(drag && !drag.moved){
              historyBefore = null; drag = null;
              if(hitItem.type==='table'){ if(cellAtDown) openText(textIdx, null, null, cellAtDown); }
              else openText(textIdx);
            }
          }, 500);
        }
        render();
      } else {
        marquee = { x0:x, y0:y, x, y, add:e.shiftKey };           // empty space → rubber-band box
        if(!e.shiftKey) selection = [];
        render();
      }
      return;
    }
    if(ui.tool==='table'){ placeTable(x,y); return; }
    if(ui.tool==='shape'){ if(ui.pendingShape) placeShapeAt(ui.pendingShape, x, y); return; }

    if(ui.tool==='polygon'){ polygonPress(x, y, e.pointerType!=='mouse'); return; }

    if(ui.tool==='eraser'){
      beginHistory();
      erasing = { removed:false, last:{x,y} };
      if(eraseAt(x,y)) erasing.removed = true;
      render();
      return;
    }

    beginHistory();
    if(ui.tool==='pen' || ui.tool==='marker' || ui.tool==='brush'){
      current = { type:'path', mode:ui.tool, color:ui.color, size:ui.size, points:[{x,y}] };
    } else if(ui.tool==='line' || ui.tool==='arrow'){
      snapPt = e.altKey ? null : nearestSnap(x,y);          // the start point snaps too
      const sx = snapPt ? snapPt.x : x, sy = snapPt ? snapPt.y : y;
      current = { type:ui.tool, color:ui.color, size:ui.size, dash:ui.dash, x1:sx,y1:sy,x2:sx,y2:sy };
    } else if(ui.tool==='rect' || ui.tool==='ellipse' || ui.tool==='text'){
      const st = drawStyle();
      current = { type:ui.tool, color:st.color, size:st.size, strokeOn:st.strokeOn, fill:st.fill, fillColor:st.fillColor, dash:st.dash, _x0:x,_y0:y, x:x,y:y,w:0,h:0 };
      if(ui.tool==='text'){ current.text = ''; current.font = fontStr(ui.fontFamily, ui.fontSize); current.textColor = ui.textColor; }   // border/fill come from the toolbar, like a rect
    }
    render();
  }

  function onMove(e){
    const p = pos(e);
    if(ui.tool==='eraser' && !erasing){ cursorPt = p; render(); }   // track ring while idle
    if(!current && !drag && !resizing && !erasing && !marquee && !rotating && !endDrag && !editingAnchor) return;
    const {x,y} = p;

    if(editingAnchor){
      if(!editingAnchor.moved && Math.hypot(x-editingAnchor.sx, y-editingAnchor.sy) < 3) return;
      const it = items[editingAnchor.idx];
      const pt = it.points[editingAnchor.pointIndex];
      if(editingAnchor.handle==='anchor'){
        // plain translation of just this point (anchor + its own handles ride along together) — the
        // curve's local shape at this point is unchanged, only its position, so this uses the same
        // incremental-delta convention as the whole-item `drag`, not `resizing`'s fixed-anchor recompute
        const lp0 = toLocal(it, editingAnchor.sx, editingAnchor.sy), lp1 = toLocal(it, x, y);
        const dx = lp1.x-lp0.x, dy = lp1.y-lp0.y;
        pt.x = norm(pt.x+dx); pt.y = norm(pt.y+dy);
        if(pt.c1){ pt.c1.x=norm(pt.c1.x+dx); pt.c1.y=norm(pt.c1.y+dy); }
        if(pt.c2){ pt.c2.x=norm(pt.c2.x+dx); pt.c2.y=norm(pt.c2.y+dy); }
      } else {
        const lp = toLocal(it, x, y);
        pt[editingAnchor.handle] = { x:norm(lp.x), y:norm(lp.y) };
      }
      editingAnchor.sx=x; editingAnchor.sy=y;
      editingAnchor.moved = true;
      render();
      return;
    }

    if(endDrag){
      if(!endDrag.moved && Math.hypot(x-endDrag.sx, y-endDrag.sy) < 3) return;   // still a click, not a drag
      const it = items[endDrag.idx];
      const fx = endDrag.end===1 ? it.x2 : it.x1, fy = endDrag.end===1 ? it.y2 : it.y1;   // the fixed end
      let nx=x, ny=y;
      snapCursorPt = {x,y};
      if(e.shiftKey){ ({x:nx,y:ny} = constrainAngle(fx,fy,x,y)); snapPt = null; }
      else { snapPt = e.altKey ? null : nearestSnap(x,y,endDrag.idx); if(snapPt){ nx=snapPt.x; ny=snapPt.y; } }
      if(endDrag.end===1){ it.x1=norm(nx); it.y1=norm(ny); } else { it.x2=norm(nx); it.y2=norm(ny); }
      endDrag.moved = true;
      render();
      return;
    }

    if(erasing){
      cursorPt = p;
      const r = eraserR();
      const last = erasing.last || p;
      const steps = Math.max(1, Math.ceil(Math.hypot(p.x-last.x, p.y-last.y)/(r/2)));
      for(let s=1;s<=steps;s++){
        const ex = last.x + (p.x-last.x)*s/steps;
        const ey = last.y + (p.y-last.y)*s/steps;
        if(eraseAt(ex,ey)) erasing.removed = true;
      }
      erasing.last = p;
      render();
      return;
    }

    if(rotating){
      const ang = Math.atan2(y-rotating.cy, x-rotating.cx);
      const delta = ang - rotating.startAngle;
      let newRot = rotating.startRotation + delta;
      if(e.shiftKey){ const step = Math.PI/12; newRot = Math.round(newRot/step)*step; }  // snap to 15° steps from absolute zero
      for(const idx of rotating.members) items[idx][rotating.field] = newRot;
      rotating.moved = true;
      render();
      return;
    }

    if(resizing){
      const rot = resizing.rotation;
      // Ctrl/Cmd anchors the resize at the box's center instead of the opposite corner (read live,
      // like Shift, so it can be toggled mid-drag) — symmetric grow/shrink on both sides at once.
      const ctrlMode = e.ctrlKey || e.metaKey;
      const ax  = ctrlMode ? resizing.centerX : resizing.anchorX;
      const ay  = ctrlMode ? resizing.centerY : resizing.anchorY;
      const awx = ctrlMode ? resizing.centerX : resizing.anchorWorldX;
      const awy = ctrlMode ? resizing.centerY : resizing.anchorWorldY;
      const origSignedW = ctrlMode ? resizing.cornerX-resizing.centerX : resizing.origSignedW;
      const origSignedH = ctrlMode ? resizing.cornerY-resizing.centerY : resizing.origSignedH;
      const rotd = rot ? rotatePoint(x, y, awx, awy, -rot) : {x,y};
      let dx = rotd.x - awx, dy = rotd.y - awy;
      if(e.shiftKey){
        // proportional: project onto the original diagonal (anchor -> original corner)
        const dW = origSignedW, dH = origSignedH;
        const len2 = dW*dW + dH*dH;
        const t = len2 ? (dx*dW + dy*dH) / len2 : 1;
        dx = t*dW; dy = t*dH;
      }
      let sx = origSignedW ? dx/origSignedW : 1;
      let sy = origSignedH ? dy/origSignedH : 1;
      const MIN=0.02;
      if(Math.abs(sx)<MIN){ sx = sx<0?-MIN:MIN; dx = sx*origSignedW; }
      if(Math.abs(sy)<MIN){ sy = sy<0?-MIN:MIN; dy = sy*origSignedH; }
      for(const {idx,snap} of resizing.snapshots) applyScaleFromSnapshot(items[idx], snap, ax, ay, sx, sy);
      if(rot && !ctrlMode){
        // resizing moves the box's center, and everything rotates around that center — compensate
        // with a plain shift so the anchor corner's WORLD position lands exactly back where it was.
        // Not needed in ctrlMode: scaling anchored at the center is a fixed point of the center itself.
        const halfW = dx/2, halfH = dy/2;
        const c = Math.cos(rot), s = Math.sin(rot);
        const Rx = halfW*c - halfH*s, Ry = halfW*s + halfH*c;
        const targetAnchorX = awx - (halfW - Rx);
        const targetAnchorY = awy - (halfH - Ry);
        const shiftX = targetAnchorX - ax, shiftY = targetAnchorY - ay;
        for(const {idx} of resizing.snapshots) translateItem(items[idx], shiftX, shiftY);
      }
      resizing.moved = true;
      render();
      return;
    }

    if(drag && selection.length){
      const dx=x-drag.sx, dy=y-drag.sy;
      if(dx||dy){
        drag.moved = true;
        if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
      }
      for(const i of selection) translateItem(items[i], dx, dy);
      drag.sx=x; drag.sy=y;
      render();
      return;
    }

    if(marquee){
      marquee.x = x; marquee.y = y;
      render();
      return;
    }
    if(!current) return;

    if(current.type==='path'){
      const last = current.points[current.points.length-1];
      if(current.points.length < MAX_POINTS && Math.hypot(x-last.x, y-last.y) >= 1.5) current.points.push({x,y});
    } else if(current.type==='line' || current.type==='arrow'){
      snapCursorPt = {x,y};
      if(e.shiftKey){
        // constrain to 45° steps, keeping the cursor's distance from the start point (no snapping)
        const c = constrainAngle(current.x1, current.y1, x, y);
        current.x2 = c.x; current.y2 = c.y; snapPt = null;
      } else {
        snapPt = e.altKey ? null : nearestSnap(x,y);        // Alt = draw free, no magnet
        current.x2 = snapPt ? snapPt.x : x; current.y2 = snapPt ? snapPt.y : y;
      }
    } else if(current.type==='rect' || current.type==='ellipse' || current.type==='text'){
      let w = x-current._x0, h = y-current._y0;
      if(e.shiftKey){
        // square / circle — follow whichever axis the cursor has moved further along
        const s = Math.max(Math.abs(w), Math.abs(h));
        w = (w<0 ? -1 : 1) * s;
        h = (h<0 ? -1 : 1) * s;
      }
      current.x = Math.min(current._x0, current._x0+w);
      current.y = Math.min(current._y0, current._y0+h);
      current.w = Math.abs(w);
      current.h = Math.abs(h);
    } else if(current.type==='polygon'){
      current._hover = {x,y};   // rubber-band edge to the pointer
    }
    render();
  }

  function onUp(e){
    if(erasing){
      if(erasing.removed) commitHistory(); else historyBefore=null;
      erasing=null;
      return;
    }
    if(rotating){
      if(rotating.moved) commitHistory(); else historyBefore=null;
      rotating=null;
      return;
    }
    if(resizing){
      if(resizing.moved) commitHistory(); else historyBefore=null;
      resizing=null;
      return;
    }
    if(endDrag){
      if(!endDrag.moved){
        // plain click on an endpoint knob: toggle the arrowhead at that end
        const it = items[endDrag.idx], h = headsOf(it);
        if(endDrag.end===1) setHeads(it, !h.s, h.e); else setHeads(it, h.s, !h.e);
      }
      commitHistory();
      endDrag=null; snapPt=null; snapCursorPt=null;
      render();
      return;
    }
    if(editingAnchor){
      if(editingAnchor.moved) commitHistory(); else historyBefore=null;
      editingAnchor=null;
      render();
      return;
    }
    if(drag){
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
      if(drag.moved){
        commitHistory();
      } else {
        historyBefore=null;
        if(drag.wasAlreadySelected && drag.hitIdx!=null){
          const it = items[drag.hitIdx];
          if(it && (it.type==='text' || it.type==='table')){
            const {x,y} = pos(e);
            // delayed: a dblclick is two of these clicks in a row — if one follows shortly, it should
            // only open the editor, not also change the alignment first
            if(alignClickTimer) clearTimeout(alignClickTimer);
            alignClickTimer = setTimeout(()=>{
              alignClickTimer = null;
              const lp = toLocal(it, x, y);
              if(it.type==='table'){
                const cell = tableCellAt(it, lp.x, lp.y);
                if(cell){
                  const cw = it.w/it.cols;
                  const relX = (lp.x - (it.x + cw*cell.c)) / cw;
                  const align = relX<1/3 ? 'left' : relX>2/3 ? 'right' : 'center';
                  beginHistory();
                  if(!it.aligns) it.aligns = [];
                  if(!it.aligns[cell.r]) it.aligns[cell.r] = [];
                  it.aligns[cell.r][cell.c] = align;
                  commitHistory(); render();
                }
              } else {
                const relX = (lp.x - it.x) / it.w;
                const align = relX<1/3 ? 'left' : relX>2/3 ? 'right' : 'center';
                beginHistory();
                it.align = align;
                commitHistory(); render();
              }
            }, 300);
          }
        }
      }
      drag=null;
      return;
    }
    if(marquee){
      const r = marqueeRect();
      const sel = marquee.add ? selection.slice() : [];
      for(let i=0;i<items.length;i++){
        if(rectsIntersect(worldBBox(items[i]), r) && sel.indexOf(i)<0) sel.push(i);
      }
      selection = expandSelection(sel);
      marquee = null;
      render();
      return;
    }
    if(ui.tool==='polygon'){
      // a mouse vertex landed on the press; a finger's lands here, where it lifts. The polygon itself
      // finishes via click-to-close / Enter / the Finish button, never on a pointerup.
      if(polyDraft && polyDraft._touch){ polyDraft._touch = false; const q = pos(e); polygonVertex(q.x, q.y); }
      return;
    }
    if(!current){ return; }

    let keep = true;
    let textDraftBox = null;
    let clickWithoutDrag = false;   // a drag-required shape got no real drag — fall back to select instead of discarding silently
    if(current.type==='path'){
      keep = current.points.length>0;
    } else if(current.type==='line' || current.type==='arrow'){
      keep = Math.hypot(current.x2-current.x1, current.y2-current.y1) > 2;
      if(!keep) clickWithoutDrag = true;
    } else if(current.type==='rect' || current.type==='ellipse'){
      keep = current.w>2 && current.h>2;
      delete current._x0; delete current._y0;
      if(!keep) clickWithoutDrag = true;
    } else if(current.type==='text'){
      keep = false;   // text is never pushed directly — a big-enough drag opens the edit box instead
      if(current.w>2 && current.h>2) textDraftBox = current;
      else clickWithoutDrag = true;
    }

    snapPt = null; snapCursorPt = null;
    if(textDraftBox){
      const box = {x:textDraftBox.x, y:textDraftBox.y, w:textDraftBox.w, h:textDraftBox.h};
      const draftStyle = {color:textDraftBox.color, fill:textDraftBox.fill, fillColor:textDraftBox.fillColor, strokeOn:textDraftBox.strokeOn, size:textDraftBox.size, textColor:textDraftBox.textColor};
      current = null; historyBefore = null;
      openText(null, box, draftStyle);
      return;
    }
    if(keep){ items.push(current); current=null; commitHistory(); }
    else {
      current=null; historyBefore=null;
      if(clickWithoutDrag){
        const {x,y} = pos(e);
        const hit = hitTest(x,y);
        if(hit>=0){
          const g = items[hit].group;
          selection = (g!=null) ? itemsInGroup(g) : [hit];
        }
        setTool('select');
      } else render();
    }
  }

  // ---------- text tool ----------
  let textBox = null;       // {x,y,w,h} of the box currently being created or edited
  let textDraft = null;     // {color,fill,fillColor,strokeOn,size} for a NEW text; null while editing an existing item
  let editingTextIdx = null;   // set while editing an existing text item or table cell (vs. creating a new text)
  let editingCell = null;      // {r,c} when editing one cell of a table, else null
  function tableCellAt(it, lx, ly){
    if(lx<it.x || lx>it.x+it.w || ly<it.y || ly>it.y+it.h) return null;
    const c = Math.max(0, Math.min(it.cols-1, Math.floor((lx-it.x)/(it.w/it.cols))));
    const r = Math.max(0, Math.min(it.rows-1, Math.floor((ly-it.y)/(it.h/it.rows))));
    return {r,c};
  }
  function openText(editIdx, box, draftStyle, cell){
    editingTextIdx = editIdx;
    editingCell = cell || null;
    const existing = editIdx!=null ? items[editIdx] : null;
    let value, color, family, fontSize, align;
    if(existing && editingCell){
      const {r,c} = editingCell;
      const cw = existing.w/existing.cols, ch = existing.h/existing.rows;
      textBox = { x: existing.x+cw*c, y: existing.y+ch*r, w: cw, h: ch };
      value = (existing.texts && existing.texts[r] && existing.texts[r][c]) || '';
      color = existing.textColor || existing.color;
      family = existing.fontFamily || 'sans'; fontSize = existing.fontSize || 16;
      align = (existing.aligns && existing.aligns[r] && existing.aligns[r][c]) || 'center';
    } else if(existing){
      textBox = {x:existing.x, y:existing.y, w:existing.w, h:existing.h};
      value = existing.text; color = existing.textColor || existing.color;
      family = familyOf(existing); fontSize = fontPxOf(existing);
      align = existing.align || 'center';
    } else {
      textBox = box; textDraft = draftStyle;
      value = ''; color = (draftStyle && draftStyle.textColor) || ui.textColor;
      family = ui.fontFamily; fontSize = ui.fontSize;
      align = 'center';
    }
    textInput.style.display='block';
    textInput.style.left = textBox.x+'px';
    textInput.style.top  = (textBox.y-1)+'px';   // -1 = the input's own border width
    textInput.style.width = textBox.w+'px';
    textInput.style.height = textBox.h+'px';
    textInput.style.textAlign = align;
    textInput.style.paddingTop = '0px';
    textInput.style.font = fontStr(family, fontSize);
    // vertically center the single line of text: line-height set to the box's own content height
    // (box height minus the 1px top+bottom border) is a reliable way to center it, independent of
    // how a given browser otherwise lays out a native <input>'s text vertically.
    // Must be set AFTER `font` above — the font shorthand resets line-height to 'normal' if it isn't
    // set right afterward.
    textInput.style.lineHeight = Math.max(1, textBox.h-2)+'px';
    textInput.style.color = color;
    textInput.value = value;
    render();   // hide the original item (or its edited cell's text) behind the input while editing
    textInput.focus(); textInput.select();   // synchronously: iOS shows the keyboard only for a focus made inside the tap itself
  }
  const FONTS = {
    sans:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
    serif:'Georgia,"Times New Roman",serif',
    mono:'ui-monospace,Menlo,Consolas,"Courier New",monospace',
    cursive:'"Comic Sans MS","Segoe Print","Bradley Hand",cursive'
  };
  function fontStr(family, size){ return '600 ' + size + 'px ' + (FONTS[family] || FONTS.sans); }
  // read a text item's family/size back out of its font string (older files store only the string,
  // and a corner-resize rewrites the px inside it)
  function familyOf(it){ return it.fontFamily || Object.keys(FONTS).find(k=>it.font && it.font.indexOf(FONTS[k])>=0) || 'sans'; }
  function fontPxOf(it){ const m = /(\d+)px/.exec(it.font||''); return m ? +m[1] : (it.fontSize || 24); }

  // ---------- table tool: click to place, sized so a cell comfortably fits sample text at the current font size ----------
  function placeTable(x,y){
    ctx.save();
    ctx.font = fontStr(ui.fontFamily, ui.fontSize);
    const tw = ctx.measureText('hello world').width;
    ctx.restore();
    const colW = Math.max(60, Math.round(tw + 24));       // "hello world" plus side padding
    const rowH = Math.max(28, Math.round(ui.fontSize*1.5)); // current text size plus line padding
    const rows = ui.tableRows, cols = ui.tableCols;
    const w = colW*cols, h = rowH*rows;
    beginHistory();
    items.push({ type:'table', x:norm(x-w/2), y:norm(y-h/2), w:norm(w), h:norm(h), rows, cols,
                 color:ui.color, size:ui.size, strokeOn:ui.strokeOn, fill:ui.fill, fillColor:ui.fillColor, dash:ui.dash,
                 fontFamily:ui.fontFamily, fontSize:ui.fontSize, font:fontStr(ui.fontFamily, ui.fontSize),
                 textColor:ui.textColor, texts:[], aligns:[] });
    selection = [items.length-1];
    commitHistory();
    setTool('select');
    render();
    toast('Table added — drag a corner to resize');
  }
  // Places one instance of a cached shape-library template, centered on (x,y). Re-clones from the
  // pristine tpl.items (validated once, at fetch time) and remaps uids/group ids fresh each time —
  // same pattern as addClones — so the same shape can be placed repeatedly without cross-contamination.
  function placeShapeAt(tpl, x, y){
    if(!tpl || !Array.isArray(tpl.items) || !tpl.items.length){ toast('That shape could not be placed'); return; }
    const box = unionBoxOf(tpl.items, false);   // stroke-free center — matches how it was centered at save time
    const cx = box.x + box.w/2, cy = box.y + box.h/2;
    const dx = x - cx, dy = y - cy;
    beginHistory();
    const gmap = {};
    const newSel = [];
    for(const raw of tpl.items){
      const copy = clone(raw);
      copy.uid = newUid();
      translateItem(copy, dx, dy);
      if(copy.group != null){
        if(!gmap[copy.group]) gmap[copy.group] = 'g-' + Date.now() + '-' + (groupSeq++);
        copy.group = gmap[copy.group];
      }
      items.push(copy);
      newSel.push(items.length - 1);
    }
    selection = newSel;
    commitHistory();
    setTool('select');
    render();
    toast('"' + tpl.name + '" added');
  }
  function commitText(){
    const val = textInput.value.trim();
    textInput.style.display='none';
    if(editingTextIdx!=null && editingCell){
      const idx = editingTextIdx, {r,c} = editingCell;
      const it = items[idx];
      beginHistory();
      if(!it.texts) it.texts = [];
      if(!it.texts[r]) it.texts[r] = [];
      it.texts[r][c] = val;   // an empty cell is fine — it just clears that cell, unlike a plain text item
      commitHistory();
    } else if(editingTextIdx!=null){
      const idx = editingTextIdx;
      beginHistory();
      if(val){ items[idx].text = val; }
      else { items.splice(idx,1); selection = selection.filter(i=>i!==idx).map(i=>i>idx?i-1:i); }
      commitHistory();
    } else if(val && textBox && textDraft){
      beginHistory();
      items.push({ type:'text', text:val, x:textBox.x, y:textBox.y, w:textBox.w, h:textBox.h,
                   color:textDraft.color, fill:textDraft.fill, fillColor:textDraft.fillColor, strokeOn:textDraft.strokeOn, size:textDraft.size,
                   textColor:textDraft.textColor || ui.textColor,
                   fontFamily:ui.fontFamily, fontSize:ui.fontSize, font:fontStr(ui.fontFamily, ui.fontSize) });
      commitHistory();
    }
    textBox=null; textDraft=null; editingTextIdx=null; editingCell=null; render();
  }
  textInput.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commitText(); }
    else if(e.key==='Escape'){ textInput.style.display='none'; textBox=null; textDraft=null; editingTextIdx=null; editingCell=null; render(); }
    e.stopPropagation();
  });
  textInput.addEventListener('blur', commitText);

  // ---------- polygon tool: click to add vertices, close on the start point / Enter / the Finish button ----------
  // With a mouse a vertex lands on the press, and the rubber-band edge follows the hover. A finger has
  // no hover: the press only starts the rubber band, a drag previews the edge, and the vertex lands
  // where the finger lifts — so nothing stale is left dangling between taps.
  function polygonPress(x, y, touch){
    if(!polyDraft){
      beginHistory();
      polyDraft = { type:'polygon', color:ui.color, size:ui.size, strokeOn:ui.strokeOn, fill:ui.fill, fillColor:ui.fillColor, dash:ui.dash, points:[] };
      current = polyDraft;
    }
    if(touch){ polyDraft._hover = {x,y}; polyDraft._touch = true; }
    else polygonVertex(x, y);
    render();
  }
  function polygonVertex(x, y){
    const pts = polyDraft.points;
    if(pts.length>=3 && Math.hypot(x-pts[0].x, y-pts[0].y)<=10){ finishPolygon(); return; }
    pts.push({x,y});
    polyDraft._hover = null;
    render();
  }
  function finishPolygon(closed){
    if(closed===undefined) closed = true;
    if(!polyDraft) return;
    const minPts = closed ? 3 : 2;
    if(polyDraft.points.length<minPts){ toast(closed ? 'Add at least 3 points first' : 'Add at least 2 points first'); return; }
    items.push({ type:'polygon', color:polyDraft.color, size:polyDraft.size, strokeOn:polyDraft.strokeOn, fill:polyDraft.fill,
                 fillColor:polyDraft.fillColor, dash:polyDraft.dash, closed, points:polyDraft.points.map(p=>({x:p.x,y:p.y})) });
    selection = [items.length-1];
    polyDraft = null; current = null;
    commitHistory();
    setTool('select');   // same as placeTable — land in select, ready to move/adjust what was just drawn
    render();
  }
  function cancelPolygon(){
    polyDraft = null; current = null;
    historyBefore = null;
    render();
  }
  function updatePolyButtons(){
    const active = ui.tool==='polygon' && !!polyDraft;
    const disp = active ? '' : 'none';
    if(polyGroup.style.display !== disp){ polyGroup.style.display = disp; polySep.style.display = disp; }
    if(active){
      polyFinishBtn.disabled = polyDraft.points.length < 3;
      polyFinishOpenBtn.disabled = polyDraft.points.length < 2;
    }
  }
  polyFinishBtn.addEventListener('click', ()=>finishPolygon(true));
  polyFinishOpenBtn.addEventListener('click', ()=>finishPolygon(false));
  polyCancelBtn.addEventListener('click', cancelPolygon);

  // ---------- images (insert / paste / drop) ----------
  function importImage(srcURL, place){
    const probe = new Image();
    probe.onload = ()=>{
      const maxDim = 1800;                       // cap stored resolution to keep storage sane
      let nw = probe.naturalWidth, nh = probe.naturalHeight, src = srcURL;
      if(Math.max(nw,nh) > maxDim){
        const s = maxDim/Math.max(nw,nh);
        const oc = document.createElement('canvas');
        oc.width = Math.round(nw*s); oc.height = Math.round(nh*s);
        oc.getContext('2d').drawImage(probe, 0, 0, oc.width, oc.height);
        src = oc.toDataURL('image/png');
        nw = oc.width; nh = oc.height;
      }
      const fit = Math.min(1, (cssW*0.7)/nw, (cssH*0.7)/nh);   // fit nicely on the canvas
      const w = nw*fit, h = nh*fit;
      const x = place ? place.x - w/2 : (cssW - w)/2;
      const y = place ? place.y - h/2 : (cssH - h)/2;
      const id = 'img-' + Date.now() + '-' + (assetSeq++);
      assets[id] = src;
      beginHistory();
      items.push({ type:'image', id, x:norm(x), y:norm(y), w:norm(w), h:norm(h) });
      selection = [items.length-1];
      commitHistory();
      setTool('select');
      render();
      toast('Image added — drag to move, corner to resize');
    };
    probe.onerror = ()=>toast('Could not load that image');
    probe.src = srcURL;
  }
  function readFile(file, place){
    if(!file || file.type.indexOf('image')!==0){ toast('That file is not an image'); return; }
    const r = new FileReader();
    r.onload = ()=>importImage(r.result, place);
    r.onerror = ()=>toast('Could not read that file');
    r.readAsDataURL(file);
  }

  // ---------- undo / redo / clear ----------
  // Drop whatever interaction is mid-flight (a stroke being drawn, a polygon being clicked out, a
  // drag/resize/rotate...) together with its pending history transaction, so that swapping the
  // document out from under it can never commit a stale snapshot.
  function cancelGesture(){
    current=null; polyDraft=null; drag=null; marquee=null; resizing=null; rotating=null; erasing=null;
    endDrag=null; snapPt=null; snapCursorPt=null; nudging=false;
    editingAnchor=null; pointEditIdx=null; activeAnchor=null;
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    historyBefore=null;
  }
  // undo/redo keep the selection (so a recolor can be undone and redone while the item stays
  // selected) — by object identity, so a reorder that shuffles array slots still selects the same things
  function selectedUids(){ return selection.map(i=>items[i] && items[i].uid).filter(Boolean); }
  function selectByUids(uids){
    const want = new Set(uids), sel = [];
    items.forEach((it,i)=>{ if(want.has(it.uid)) sel.push(i); });
    selection = expandSelection(sel);
  }
  function undo(){
    if(!undoStack.length) return;
    cancelGesture();
    const keep = selectedUids();
    redoStack.push(snap());
    items = JSON.parse(undoStack.pop());
    selectByUids(keep);
    save(); render(); updateButtons();
  }
  function redo(){
    if(!redoStack.length) return;
    cancelGesture();
    const keep = selectedUids();
    undoStack.push(snap());
    items = JSON.parse(redoStack.pop());
    selectByUids(keep);
    save(); render(); updateButtons();
  }
  function clearAll(){
    if(!items.length) return;
    if(!confirm('Erase everything on the canvas?')) return;
    cancelGesture();
    beginHistory();
    items = []; selection=[]; current=null;
    commitHistory(); render();
    toast('Canvas cleared');
  }
  function deleteSelected(){
    if(ui.tool!=='select' || !selection.length) return;
    beginHistory();
    for(const i of selection.slice().sort((a,b)=>b-a)) items.splice(i,1);  // high→low so indices stay valid
    selection = [];
    commitHistory(); render();
  }
  // Pull the selected items out (keeping their relative order) and re-insert them
  // at the top (end of array) or bottom (start). `toEnd` true = bring to front.
  function reorderSelection(toEnd){
    if(ui.tool!=='select' || !selection.length) return;
    beginHistory();
    const asc = selection.slice().sort((a,b)=>a-b);
    const moved = asc.map(i=>items[i]);
    for(const i of asc.slice().reverse()) items.splice(i,1);   // remove high→low
    if(toEnd){ items.push(...moved); selection = moved.map((_,k)=>items.length-moved.length+k); }
    else     { items.unshift(...moved); selection = moved.map((_,k)=>k); }
    commitHistory(); render();
  }
  const bringToFront = ()=>reorderSelection(true);
  const sendToBack   = ()=>reorderSelection(false);

  // duplicate / copy / paste (images keep their asset id, so the bitmap is shared)
  function addClones(list, off){
    beginHistory();
    const gmap = {};                       // remap each source group to a fresh one
    const newSel = [];
    for(const it of list){
      const copy = clone(it);
      copy.uid = newUid();
      translateItem(copy, off, off);
      if(copy.group!=null){
        if(!gmap[copy.group]) gmap[copy.group] = 'g-' + Date.now() + '-' + (groupSeq++);
        copy.group = gmap[copy.group];
      }
      items.push(copy);
      newSel.push(items.length-1);
    }
    if(ui.tool!=='select') setTool('select');
    selection = newSel;
    commitHistory(); render();
  }
  // Fold a group's shared groupRotation into each member's own geometry (a shift plus own rotation),
  // leaving every member looking exactly as before with groupRotation back at 0. Needed before
  // anything that changes the group's pivot or membership: ungrouping, regrouping, erasing a member.
  function bakeGroupRotation(g){
    const idxs = itemsInGroup(g);
    if(!idxs.some(i=>items[i].groupRotation)) return;
    const piv = groupPivot(g);   // snapshot BEFORE touching any member — baking one would shift the pivot for the rest
    for(const i of idxs){
      const it = items[i];
      const rot = it.groupRotation || 0;
      if(rot){
        const b = worldBBoxOwn(it);
        const ownCx = b.x+b.w/2, ownCy = b.y+b.h/2;
        const target = rotatePoint(ownCx, ownCy, piv.cx, piv.cy, rot);
        translateItem(it, target.x-ownCx, target.y-ownCy);
        it.rotation = (it.rotation||0) + rot;
      }
      it.groupRotation = 0;
    }
  }
  // Same math as bakeGroupRotation, but against a standalone list of cloned items (not live `items`
  // indices) — used by saveSelectionAsShape so exporting a shape never touches the live scene.
  function bakeGroupRotationLocal(members){
    if(!members.some(it=>it.groupRotation)) return;
    const b = unionBoxOf(members, false);
    const cx = b.x+b.w/2, cy = b.y+b.h/2;
    for(const it of members){
      const rot = it.groupRotation || 0;
      if(rot){
        const bb = worldBBoxOwn(it);
        const ownCx = bb.x+bb.w/2, ownCy = bb.y+bb.h/2;
        const target = rotatePoint(ownCx, ownCy, cx, cy, rot);
        translateItem(it, target.x-ownCx, target.y-ownCy);
        it.rotation = (it.rotation||0) + rot;
      }
      it.groupRotation = 0;
    }
  }
  function groupsIn(sel){
    const gs = new Set();
    for(const i of sel){ if(items[i].group!=null) gs.add(items[i].group); }
    return gs;
  }
  function groupSelection(){
    if(ui.tool!=='select' || selection.length<2) return;
    beginHistory();
    const sel = expandSelection(selection);
    for(const og of groupsIn(sel)) bakeGroupRotation(og);   // a rotated group being merged keeps its look
    const g = 'g-' + Date.now() + '-' + (groupSeq++);
    for(const i of sel){ items[i].group = g; items[i].groupRotation = 0; }
    selection = sel;
    commitHistory(); render();
    toast('Grouped');
  }
  function ungroupSelection(){
    if(ui.tool!=='select' || !selection.length) return;
    const sel = expandSelection(selection);
    if(!sel.some(i=>items[i].group!=null)) return;
    beginHistory();
    for(const g of groupsIn(sel)) bakeGroupRotation(g);
    for(const i of sel){ delete items[i].group; delete items[i].groupRotation; }
    selection = sel;
    commitHistory(); render();
    toast('Ungrouped');
  }
  function duplicateSelection(){
    if(ui.tool!=='select' || !selection.length) return;
    addClones(selection.slice().sort((a,b)=>a-b).map(i=>items[i]), 16);
  }
  function copySelection(){
    if(ui.tool!=='select' || !selection.length) return;
    clipboard = selection.slice().sort((a,b)=>a-b).map(i=>clone(items[i]));
    toast(clipboard.length + (clipboard.length===1?' item copied':' items copied'));
  }
  function pasteClipboard(){
    if(!clipboard.length) return false;
    addClones(clipboard, 16);
    return true;
  }

  // ---------- shape library: save ----------
  function saveSelectionAsShape(){
    if(ui.tool!=='select' || !selection.length){ toast('Select something first to save it as a shape'); return; }
    const sel = expandSelection(selection);

    // Decision: block entirely rather than save-minus-image. A shape that silently drops part of what
    // the user just saw selected is a worse surprise (discovered only when re-placing it later) than a
    // clear upfront refusal telling them to remove the image first.
    if(sel.some(i=>items[i].type==='image')){
      toast("Shapes can't include images — remove the image from the selection first");
      return;
    }

    const list = sel.map(i=>clone(items[i]));

    // bake rotation per original group, against the clone (never the live items)
    const groups = new Map();
    for(const it of list){ if(it.group!=null){ if(!groups.has(it.group)) groups.set(it.group, []); groups.get(it.group).push(it); } }
    for(const members of groups.values()) bakeGroupRotationLocal(members);

    // canonicalize group ids to shape-local placeholders; strip live uids entirely
    const gmap = {}; let gseq = 0;
    for(const it of list){
      delete it.uid;
      if(it.group!=null){
        if(!gmap[it.group]) gmap[it.group] = 's' + (++gseq);
        it.group = gmap[it.group];
      }
    }

    // center the saved geometry on (0,0) — stroke-free box, matching groupPivot's own convention
    const box = unionBoxOf(list, false);
    const cx = box.x+box.w/2, cy = box.y+box.h/2;
    for(const it of list) translateItem(it, -cx, -cy);

    // Opened straight from disk (file://), fetch() of a sibling file is blocked by the browser, so a
    // fetch-based merge is unreliable there. If nothing has been fetched OR manually imported this
    // session, warn before proceeding — otherwise this save would silently start a brand-new library
    // and the download would overwrite any existing shapes-library.json the user hasn't loaded yet.
    if(location.protocol==='file:' && !shapeLibraryCache){
      const proceed = confirm(
        'No existing shape library is loaded (this page was opened from disk, so it can\'t fetch '+SHAPE_LIBRARY_FILE+' automatically).\n\n' +
        'If you already have a '+SHAPE_LIBRARY_FILE+' with other shapes in it, click Cancel and use "Load Shape Library…" in the menu first — otherwise this save will start a brand-new library and overwrite it.\n\n' +
        'Click OK to start a new library with just this shape.'
      );
      if(!proceed) return;
    }

    let name = prompt('Name this shape:');
    if(name==null) return;
    name = name.trim();
    if(!name){ toast('Shape needs a name'); return; }

    saveShapeToLibrary(name, list);
  }

  // The whole library lives in ONE file (shapes-library.json, next to index.html) — one download,
  // one file to FTP/copy around, no browser "allow multiple downloads?" prompt for two files at once.
  const SHAPE_LIBRARY_FILE = 'shapes-library.json';
  // The last library successfully fetched or manually imported this session — lets a file:// session
  // (where fetch() of a sibling file is blocked) still merge saves and re-render the picker without
  // re-importing every time.
  let shapeLibraryCache = null;
  async function fetchShapeLibrary(){
    const res = await fetch(SHAPE_LIBRARY_FILE, {cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    if(!data || !Array.isArray(data.shapes)) throw new Error('bad library file');
    return data;
  }

  async function saveShapeToLibrary(name, list){
    let lib = { app:'SimpleCanvasShapeLibrary', version:1, shapes:[] };
    try{ lib = await fetchShapeLibrary(); }
    catch(e){ if(shapeLibraryCache) lib = shapeLibraryCache; /* else: first-ever shape, or nothing imported yet under file:// — start fresh (the caller already warned about this case) */ }

    const existing = lib.shapes.find(s=>s && s.name===name);
    if(existing && !confirm('A shape named "'+name+'" already exists. Replace it?')) return;
    lib.shapes = lib.shapes.filter(s=>!(s && s.name===name));
    lib.shapes.push({ name, savedAt:new Date().toISOString(), items:list });

    shapeLibraryCache = lib;   // so this session's picker/next save sees it without re-importing
    revealShapeTool();         // saving the first-ever shape means the tool has something to offer now
    downloadJSON(SHAPE_LIBRARY_FILE, lib);
    toast(location.protocol==='file:'
      ? 'Saved "'+name+'" — replace '+SHAPE_LIBRARY_FILE+' next to index.html, then use Import to load it here'
      : 'Saved "'+name+'" — upload '+SHAPE_LIBRARY_FILE+' via FTP');
  }

  // shared Blob/<a download> pattern (also usable by exportProject's own inline version)
  function downloadJSON(filename, data){
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function updateButtons(){
    document.getElementById('undo').disabled = undoStack.length===0;
    document.getElementById('redo').disabled = redoStack.length===0;
  }
  // shapes that can carry a fill (and so a second, fill color)
  const FILLABLE = t => t==='rect' || t==='ellipse' || t==='polygon' || t==='table' || t==='text';
  const STROKABLE = t => t !== 'image';   // everything but an image takes a stroke color; only FILLABLE shapes can switch the outline off
  function strokeOn(it){ return it.strokeOn !== false; }   // default true, for old saved files without the field
  // selected items whose color can be edited (images have none); empty outside the select tool
  function colorableSelection(){
    return ui.tool==='select' ? selection.map(i=>items[i]).filter(it=>it && it.type!=='image') : [];
  }
  function updateOrderButtons(){
    const active = ui.tool==='select' && selection.length>0;
    const disp = active ? '' : 'none';
    if(arrangeGroup.style.display !== disp){ arrangeGroup.style.display = disp; arrangeSep.style.display = disp; }
    if(ui.tool==='select'){
      // the icon buttons double as the recolor/resize tool for whatever is selected
      const sel = colorableSelection();
      const fillable = sel.filter(it=>FILLABLE(it.type));
      const setDisp = (el,on)=>{ const d = on ? '' : 'none'; if(el.style.display !== d) el.style.display = d; };
      setDisp(colorGroup, sel.length>0); setDisp(colorSep, sel.length>0);
      setDisp(fillGroup, fillable.length>0);
      setDisp(strokeNoneSwatch, fillable.length>0);
      const sized = sel;   // every shape (including text, for its border) has a stroke width
      const dashable = sel.filter(it=>DASHABLE(it.type));
      const texts = sel.filter(it=>it.type==='text' || it.type==='table');
      setDisp(sizeGroup, sized.length>0); setDisp(sizeSep, sized.length>0 && texts.length>0);
      setDisp(dashPicker, dashable.length>0);
      setDisp(textOpts, texts.length>0);
      setDisp(textColorGroup, texts.length>0);
      if(sel.length){
        if(sized.length) setSizeVal(sized[0].size);   // so does the size control
        if(dashable.length) setDashVal(dashable[0].dash);   // and the line-style control
        if(texts.length){ fontFamilySel.value = familyOf(texts[0]); setFontSizeSel(fontPxOf(texts[0])); }   // and the font controls
        refreshColorUI();
      }
    }
    if(!active) return;
    toDupBtn.disabled = toFrontBtn.disabled = toBackBtn.disabled = delSelBtn.disabled = false;
    groupBtn.disabled = selection.length<2;
    ungroupBtn.disabled = !selection.some(i=>items[i] && items[i].group!=null);
  }

  // ---------- export ----------
  function savePng(){
    if(!items.length){ toast('Nothing to export yet'); return; }
    const m = 24, scale = 2;                              // margin (px) and export supersampling
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const it of items){
      const b = worldBBox(it);   // rotation-aware, so rotated items aren't clipped
      minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+b.w); maxY=Math.max(maxY,b.y+b.h);
    }
    const w = (maxX-minX) + m*2, h = (maxY-minY) + m*2;
    const off = document.createElement('canvas');
    off.width  = Math.max(1, Math.round(w*scale));
    off.height = Math.max(1, Math.round(h*scale));
    const octx = off.getContext('2d');
    octx.setTransform(scale,0,0,scale,0,0);
    octx.translate(-minX + m, -minY + m);                // shift content into the margin box
    octx.fillStyle = BG;
    octx.fillRect(minX - m, minY - m, w, h);

    const real = ctx;
    ctx = octx;
    try { for(const it of items) drawItem(it); }
    finally { ctx = real; }

    const a = document.createElement('a');
    a.href = off.toDataURL('image/png');
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.png';
    a.click();
    toast('Saved PNG');
  }

  // ---------- SVG exporter: the same shape description, as markup ----------
  function escXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const pathD = d => d.map(s => s[0]==='Z' ? 'Z' : s[0] + s.slice(1).join(',')).join(' ');
  function styleAttrs(st){
    let a = ` fill="${escXml(st.fill)}" stroke="${escXml(st.stroke)}"`;
    if(st.stroke !== 'none'){
      a += ` stroke-width="${st.width}"`;
      // a dash pattern always forces flat (butt) ends — round caps would extend each dash into the
      // gap by half the stroke width and merge adjacent dashes together (see paintCurrentPath)
      if(st.dash) a += ` stroke-linecap="butt" stroke-dasharray="${st.dash.join(',')}"`;
      else if(st.cap) a += ` stroke-linecap="${st.cap}"`;
      if(st.join) a += ` stroke-linejoin="${st.join}"`;
    }
    if(st.opacity != null && st.opacity !== 1) a += ` opacity="${st.opacity}"`;
    return a;
  }
  function opToSVG(op){
    switch(op.kind){
      case 'image': {
        const src = assets[op.id];
        return src ? `<image href="${escXml(src)}" x="${op.x}" y="${op.y}" width="${op.w}" height="${op.h}" preserveAspectRatio="none"/>` : '';
      }
      case 'dot': return `<circle cx="${op.cx}" cy="${op.cy}" r="${op.r}" fill="${escXml(op.color)}"${op.opacity !== 1 ? ` opacity="${op.opacity}"` : ''}/>`;
      case 'path': return `<path d="${pathD(op.d)}"${styleAttrs(op.style)}/>`;
      case 'rect': return `<rect x="${op.x}" y="${op.y}" width="${op.w}" height="${op.h}"${styleAttrs(op.style)}/>`;
      case 'ellipse': return `<ellipse cx="${op.cx}" cy="${op.cy}" rx="${op.rx}" ry="${op.ry}"${styleAttrs(op.style)}/>`;
      case 'text': {
        const anchor = op.align==='left' ? 'start' : op.align==='right' ? 'end' : 'middle';
        return `<text x="${textAnchorX(op.x, op.w, op.align)}" y="${op.y+op.h/2}" fill="${escXml(op.color)}" text-anchor="${anchor}" dominant-baseline="middle" style="font:${escXml(op.font)}">${escXml(op.text)}</text>`;
      }
    }
    return '';
  }
  function itemToSVG(it){
    const inner = shapeOps(it).map(opToSVG).join('');
    // rotation wrapper, matching drawItem's transform order (group rotation outer, own rotation inner)
    let transform = '';
    if(it.group!=null && it.groupRotation){
      const piv = groupPivot(it.group);
      transform += `rotate(${it.groupRotation*180/Math.PI} ${piv.cx} ${piv.cy}) `;
    }
    if(it.rotation){
      const b = bbox(it);
      transform += `rotate(${it.rotation*180/Math.PI} ${b.x+b.w/2} ${b.y+b.h/2})`;
    }
    transform = transform.trim();
    return transform ? `<g transform="${transform}">${inner}</g>` : inner;
  }
  function saveSvg(){
    if(!items.length){ toast('Nothing to export yet'); return; }
    const m = 24;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const it of items){
      const b = worldBBox(it);
      minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+b.w); maxY=Math.max(maxY,b.y+b.h);
    }
    const w = (maxX-minX) + m*2, h = (maxY-minY) + m*2;
    const ox = -minX + m, oy = -minY + m;
    let body = '';
    for(const it of items) body += itemToSVG(it);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(h)}" viewBox="0 0 ${w} ${h}">`
      + `<rect x="0" y="0" width="${w}" height="${h}" fill="${BG}"/>`
      + `<g transform="translate(${ox} ${oy})">${body}</g>`
      + `</svg>`;
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.svg';
    a.click();
    URL.revokeObjectURL(url);
    toast('Saved SVG');
  }

  // ---------- save / open the sketch as a file (our own JSON format) ----------
  function exportProject(){
    const data = {
      app: 'SimpleCanvas',
      version: FORMAT_VERSION,
      savedAt: new Date().toISOString(),
      items,
      assets: referencedAssets()
    };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sketch-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Sketch saved to file');
  }
  function importProject(file){
    const r = new FileReader();
    r.onload = ()=>{
      let data;
      try { data = JSON.parse(r.result); }
      catch(e){ toast('Not a valid sketch file'); return; }
      if(!data || data.app !== 'SimpleCanvas' || !Array.isArray(data.items)){
        toast('That is not a SimpleCanvas file'); return;
      }
      if(typeof data.version === 'number' && data.version > FORMAT_VERSION &&
         !confirm('This file was saved by a newer version ('+data.version+'). Open it anyway?')) return;
      const scene = normalizeScene(data.items, data.assets, data.version);   // validated before live state is touched
      if(!scene.items.length && data.items.length){ toast('No readable objects in that file'); return; }
      if(items.length && !confirm('Replace the current sketch with the opened file?')) return;
      cancelGesture();
      beginHistory();
      items = scene.items;
      Object.assign(assets, scene.assets);
      selection = [];
      commitHistory();
      render();
      const note = sceneLoadNote(scene);
      toast(note ? 'Sketch loaded (' + note + ')' : 'Sketch loaded');
    };
    r.onerror = ()=>toast('Could not read that file');
    r.readAsText(file);
  }

  // ---------- toolbar wiring ----------
  function setTool(t){
    if(ui.tool==='polygon' && polyDraft && t!=='polygon') cancelPolygon();
    ui.tool = t;
    document.querySelectorAll('[data-tool].btn').forEach(b=>{
      const on = b.dataset.tool===t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    canvas.className = 'tool-'+t;
    if(t!=='select'){ selection=[]; marquee=null; }
    if(t!=='eraser') cursorPt=null;
    if(t!=='table') setTablePicker(false);
    if(t!=='shape') setShapePicker(false);
    const isText = (t==='text' || t==='table');
    const isSelect = (t==='select');
    const canFill = FILLABLE(t);                     // fill only makes sense for these (a text box is a rect with words in it)
    const usesColor = !isSelect && t!=='eraser';     // hide the buttons where they have no effect
    const usesSize = !isSelect;
    strokeNoneSwatch.style.display = canFill ? '' : 'none';        // pen/line strokes can't be switched off
    colorGroup.style.display = usesColor ? '' : 'none';
    colorSep.style.display = usesColor ? '' : 'none';
    textOpts.style.display = isText ? '' : 'none';
    textOptsSep.style.display = isText ? '' : 'none';
    textColorGroup.style.display = isText ? '' : 'none';
    sizeGroup.style.display = usesSize ? '' : 'none';

  // validate one shape entry from the library file the same way any external JSON is validated —
  // normalizeItem, per item (an entry with zero surviving items, or malformed altogether, is dropped)
  function normalizeShapeEntry(raw){
    if(!raw || typeof raw !== 'object' || !Array.isArray(raw.items)) return null;
    const items = [];
    let dropped = 0;
    for(const r of raw.items){
      const it = normalizeItem(r, {});   // assetsIn={} — any image item is dropped here too, defense in depth
      if(it) items.push(it); else dropped++;
    }
    if(!items.length) return null;
    if(dropped) console.warn('Shape "'+(raw.name||'?')+'": '+dropped+' item(s) failed validation and were skipped');
    return { name: typeof raw.name==='string' && raw.name.trim() ? raw.name.trim() : '(unnamed)', items };
  }

  function shapeThumbSVG(items){
    const box = unionBoxOf(items, true);
    if(!isFinite(box.w) || !isFinite(box.h) || box.w<=0 || box.h<=0) return null;
    const inner = items.map(itemToSVG).join('');
    return `<svg viewBox="${box.x} ${box.y} ${box.w} ${box.h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }

  function renderShapeLibrary(lib){

  async function refreshShapeLibrary(){

      // the user has to do that by hand (or re-upload it). Until they do, this fetch would still

      // those around by merging in whatever the session cache has that this fetch doesn't.

  // ---------- custom color panel ----------
  function hsvToHex(h, s, v){
    const f = n => { const k = (n + h/60) % 6; return Math.round(255 * (v - v*s*Math.max(0, Math.min(k, 4-k, 1)))).toString(16).padStart(2, '0'); };
    return '#' + f(5) + f(3) + f(1);
  }
  function hexToHsv(c){
    let m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c || '').trim());
    if(!m) return null;
    const hex = m[1].length === 3 ? m[1].replace(/./g, ch=>ch+ch) : m[1];
    const r = parseInt(hex.slice(0,2),16)/255, g = parseInt(hex.slice(2,4),16)/255, b = parseInt(hex.slice(4,6),16)/255;
    const max = Math.max(r,g,b), d = max - Math.min(r,g,b);
    let h = 0;
    if(d){ h = 60 * (max===r ? ((g-b)/d) % 6 : max===g ? (b-r)/d + 2 : (r-g)/d + 4); if(h < 0) h += 360; }
    return { h, s: max ? d/max : 0, v: max };
  }
  // onPick(hex, live): live while a drag is in progress, false on release / a typed value
  function buildColorPanel(container, onPick){
    const el = document.createElement('div');
    el.className = 'cpanel'; el.hidden = true;
    el.innerHTML = '<div class="cpanel-sv"><div class="cpanel-dot"></div></div>'
      + '<div class="cpanel-hue"><div class="cpanel-mark"></div></div>'
      + '<input class="cpanel-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color">';
    const sv = el.querySelector('.cpanel-sv'), dot = el.querySelector('.cpanel-dot');
    const hue = el.querySelector('.cpanel-hue'), mark = el.querySelector('.cpanel-mark'), hex = el.querySelector('.cpanel-hex');
    let h = 0, s = 1, v = 0.5;
    const clamp01 = x => Math.max(0, Math.min(1, x));
    function paint(){
      sv.style.backgroundColor = 'hsl(' + h + ' 100% 50%)';
      dot.style.left = s*100 + '%'; dot.style.top = (1-v)*100 + '%';
      mark.style.left = h/360*100 + '%';
      hex.value = hsvToHex(h, s, v);
    }
    // press-and-drag on either strip; pointer capture keeps the drag alive outside the element
    function dragOn(target, read){
      target.addEventListener('pointerdown', e=>{
        e.preventDefault();
        target.setPointerCapture(e.pointerId);
        const step = ev=>{ read(ev, target.getBoundingClientRect()); paint(); onPick(hex.value, true); };
        step(e);
        target.addEventListener('pointermove', step);
        target.addEventListener('pointerup', ()=>{ target.removeEventListener('pointermove', step); onPick(hex.value, false); }, { once:true });
      });
    }
    dragOn(sv, (e, r)=>{ s = clamp01((e.clientX - r.left)/r.width); v = 1 - clamp01((e.clientY - r.top)/r.height); });
    dragOn(hue, (e, r)=>{ h = clamp01((e.clientX - r.left)/r.width) * 359.99; });
    hex.addEventListener('change', ()=>{
      const p = hexToHsv(hex.value);
      if(p){ ({h, s, v} = p); paint(); onPick(hex.value, false); } else paint();   // an unreadable entry just snaps back
    });
    hex.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); hex.blur(); } });
    paint();
    container.appendChild(el);
    return { el, set(c){ const p = hexToHsv(c); if(p){ ({h, s, v} = p); paint(); } } };
  }

  function refreshColorUI(){
    // with a selection, the buttons show the (first) selected item's colors rather than the drawing defaults
    const def = drawStyle();
    const src = colorableSelection()[0] || def;
    const strokeIsOn = 'strokeOn' in src ? strokeOn(src) : (def.strokeOn !== false);
    const strokeC = strokeIsOn ? (src.color || def.color) : 'none';

    else { fillColorBar.setAttribute('fill', 'none'); fillColorBar.setAttribute('stroke', '#9ca3af'); fillColorBar.setAttribute('stroke-width', '15'); }

    syncCustomSwatch(textColorPicker, textC);
  }
  // live: a drag in the color panel is in progress — apply, but commit only when it ends
  function applyStrokeColor(c, live){
    const on = c !== 'none';
    const sel = colorableSelection().filter(it=>STROKABLE(it.type));
    if(sel.length){
      if(historyBefore===null) beginHistory();
      for(const it of sel){ if(FILLABLE(it.type)) it.strokeOn = on; if(on) it.color = c; }
      if(!live) commitHistory();
      const st = styleFor(sel[0].type); st.strokeOn = on; if(on) st.color = c;   // the defaults follow the last edit
      render();
      return;
    }
    const st = drawStyle(); st.strokeOn = on; if(on) st.color = c;
    refreshColorUI();
  }
  function applyFillColor(v, live){
    const on = v !== 'none';
    const sel = colorableSelection().filter(it=>FILLABLE(it.type));
    if(sel.length){
      if(historyBefore===null) beginHistory();
      for(const it of sel){ it.fill = on; if(on) it.fillColor = v; }
      if(!live) commitHistory();
      const st = styleFor(sel[0].type); st.fill = on; if(on) st.fillColor = v;
      render();
      return;
    }
    const st = drawStyle(); st.fill = on; if(on) st.fillColor = v;
    refreshColorUI();
  }
  function applyTextColor(c, live){
    const sel = colorableSelection().filter(it=>it.type==='text'||it.type==='table');
    if(sel.length){
      if(historyBefore===null) beginHistory();
      for(const it of sel) it.textColor = c;

  // reflects a size even when nothing is selected yet, and after a corner-resize picks an odd value
  function setSizeVal(px){

  }
  sizeRange.addEventListener('input', e=>{

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SimpleCanvas — Quick Sketches</title>
<style>
  :root{
    --bg:#eef0f4;
    --panel:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#6366f1;
    --accent-soft:#eef2ff;
    --danger:#ef4444;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 4px;              /* horizontal gap matches .group so every separator sits 6px from its neighbours */
    padding:10px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
    z-index:10;
  }
  .brand{
    display:flex;align-items:center;gap:6px;
    font-weight:700;font-size:15px;letter-spacing:-.01em;
    padding:0 2px;
  }
  .brand svg{display:block}
  .brand .dot{color:var(--accent)}
  @media(max-width:760px){ .brand .brand-name{display:none} .brand{padding:0} }

  .group{display:flex;align-items:center;gap:4px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}   /* 4px gap + 2px margin = 6px on both sides, everywhere */
  .sep.row-edge{display:none}   /* set by tidySeps(): a separator with nothing beside it on its row */
  #fillGroup{margin-left:6px}   /* no separator before it, so give it a little air after the size slider */

  .btn{
    -webkit-appearance:none;appearance:none;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:38px;min-width:38px;padding:0 9px;
    border:1px solid transparent;border-radius:10px;
    background:transparent;color:var(--ink);
    font-size:13px;font-weight:550;cursor:pointer;
    transition:background .12s ease,border-color .12s ease,color .12s ease,transform .05s ease;
  }
  .btn svg{width:20px;height:20px;display:block}
  .btn:hover{background:#f3f4f6}
  .btn:active{transform:translateY(1px)}
  .btn.active{background:var(--accent-soft);color:var(--accent);border-color:#c7cdfb}
  .btn.ghost{color:var(--muted)}
  .btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
  .btn.danger:hover{background:#fef2f2;color:var(--danger)}

  /* keyboard focus (mouse clicks don't show a ring) */
  .btn:focus-visible,.select:focus-visible,.swatch:focus-visible,
  input[type=color]:focus-visible,input[type=range]:focus-visible,
  .check input:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }

  .push-right{margin-left:auto}

  /* color */
  .swatches{display:flex;gap:5px;align-items:center}
  .swatch{
    -webkit-appearance:none;appearance:none;padding:0;
    width:24px;height:24px;border-radius:7px;cursor:pointer;
    border:2px solid #fff;box-shadow:0 0 0 1px var(--line);
    transition:transform .08s ease,box-shadow .08s ease;
  }
  .swatch.light{box-shadow:0 0 0 1px #d1d5db}
  .swatch:hover{transform:scale(1.08)}
  .swatch.active{box-shadow:0 0 0 2px var(--accent);transform:scale(1.08)}
  .color-wrap{position:relative;width:30px;height:30px}
  input[type=color]{
    position:absolute;inset:0;width:100%;height:100%;padding:0;border:none;
    border-radius:8px;cursor:pointer;background:none;
    box-shadow:0 0 0 1px var(--line);
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}

  /* stroke/fill target toggle */
  .target-btn{gap:8px;padding:0 11px;border:1px solid var(--line)}
  .target-dot{width:16px;height:16px;border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:0 0 auto}
  .target-lbl{font-size:13px;font-weight:600;min-width:38px;text-align:left}

  /* hamburger dropdown */
  .menu-wrap{position:relative}
  .menu{
    position:absolute;top:calc(100% + 8px);left:0;z-index:30;
    min-width:210px;padding:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:1px;
  }
  .menu[hidden]{display:none}
  .menu button{
    display:flex;align-items:center;gap:11px;
    width:100%;padding:9px 11px;border:none;border-radius:8px;
    background:transparent;color:var(--ink);font:inherit;font-size:13.5px;font-weight:550;
    text-align:left;cursor:pointer;white-space:nowrap;
  }
  .menu button:hover{background:#f3f4f6}
  .menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .menu button svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted)}
  .menu button .sc{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
  .menu button.danger{color:var(--danger)}
  .menu button.danger:hover{background:#fef2f2}
  .menu button.danger svg{color:var(--danger)}
  .menu-sep{height:1px;background:var(--line);margin:5px 4px}

  /* table size picker */
  .table-picker{min-width:0;padding:10px;flex-direction:column;align-items:center}
  .table-grid{display:grid;grid-template-columns:repeat(10,16px);grid-auto-rows:16px;gap:3px}
  .table-grid .cell{width:16px;height:16px;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer}
  .table-grid .cell.hi{background:var(--accent-soft);border-color:var(--accent)}
  .table-picker-label{margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}

  /* size */
  .size-ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  input[type=range]{width:104px;accent-color:var(--accent);cursor:pointer}
  .size-val{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  .select{
    height:38px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:550;
    padding:0 8px;cursor:pointer;
  }
  .select:focus-visible{border-color:var(--accent)}

  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
  .check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

  /* ---------- Canvas ---------- */
  .stage{
    flex:1 1 auto;position:relative;min-height:0;
    padding:16px;
    display:flex;
  }
  .wrap{
    position:relative;flex:1;border-radius:14px;overflow:hidden;
    background:#fff;box-shadow:var(--shadow);
    background-image:
      linear-gradient(#f4f5f8 1px,transparent 1px),
      linear-gradient(90deg,#f4f5f8 1px,transparent 1px);
    background-size:26px 26px;
  }
  canvas{display:block;position:absolute;inset:0;cursor:crosshair}
  canvas.tool-select{cursor:default}
  canvas.tool-text{cursor:text}
  canvas.tool-eraser{cursor:none}

  /* floating text editor */
  #textInput{
    position:absolute;z-index:5;display:none;
    border:1px dashed var(--accent);outline:none;
    background:rgba(255,255,255,.65);
    font-family:inherit;padding:2px 4px;border-radius:4px;
    color:var(--ink);min-width:40px;
  }

  .hint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;color:#9ca3af;pointer-events:none;
    font-size:15px;line-height:1.7;
  }
  .hint kbd{
    font-family:ui-monospace,monospace;font-size:12px;
    background:#fff;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;color:var(--muted);
  }

  /* tiny toast */
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:#111827;color:#fff;padding:9px 16px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s ease;z-index:50;
    box-shadow:var(--shadow);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media print{
    body{background:#fff}
    .toolbar,.hint,#toast{display:none !important}
    .stage{padding:0}
    .wrap{box-shadow:none;border-radius:0;background:#fff}
  }
</style>
</head>
<body>

<header class="toolbar">
  <input type="file" id="projectInput" accept="application/json,.json" style="display:none">
  <div class="menu-wrap">
    <button class="btn" id="menuBtn" title="File &amp; canvas actions" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button data-act="save" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 3v5h6V3M7 21v-6h10v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Save sketch… <span class="sc">⌘S</span>
      </button>
      <button data-act="open" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1H3V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 10h18l-2 8a1 1 0 0 1-1 .8H6a1 1 0 0 1-1-.8L3 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Open sketch… <span class="sc">⌘O</span>
      </button>
      <div class="menu-sep" role="separator"></div>
      <button data-act="png" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export PNG
      </button>
      <button data-act="svg" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17c2-9 5-9 8 0s6 9 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4" cy="17" r="1.6" fill="currentColor"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/><circle cx="20" cy="17" r="1.6" fill="currentColor"/></svg>
        Export SVG
      </button>
      <button data-act="print" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9V3h12v6M6 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1M6 14h12v7H6v-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Print
      </button>
      <div class="menu-sep" role="separator"></div>
      <button data-act="clear" class="danger" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Clear canvas
      </button>
    </div>
  </div>

  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17.5 14.5 6a2.5 2.5 0 0 1 3.5 3.5L6.5 21H3v-3.5Z" stroke="#6366f1" stroke-width="1.8" stroke-linejoin="round"/><path d="m12.5 8 3.5 3.5" stroke="#6366f1" stroke-width="1.8"/></svg>
    <span class="brand-name">Simple<span class="dot">Canvas</span></span>
  </div>

  <div class="sep"></div>

  <!-- Actions, select & tools — separate groups so a narrow toolbar wraps between them, never inside -->
  <div class="group">
    <button class="btn ghost" id="undo" title="Undo (⌘/Ctrl+Z)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn ghost" id="redo" title="Redo (⌘/Ctrl+Shift+Z)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="select" title="Select / move — drag a box to select several (V)">
      <svg viewBox="0 -1.5 24 24" fill="none"><path d="m5 3 14 7-6 2-2 6L5 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="M4 18 15 7l3 3L7 21l-4 1 1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m14 8 2 2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="marker" title="Highlighter (M)">
      <svg viewBox="0 0 24 24" fill="none"><path d="m9 17-4 1 1-4L16 3l3 3L9 17Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="brush" title="Felt-tip (B)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M14 4 8 10c-2 2-2 4-3 6 2-1 4-1 6-3l6-6-3-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 16c-2 1-2 4-2 4s3 0 4-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="eraser" title="Eraser (E)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="m4 14 6-6 7 7-4 4H8l-4-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 21h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="line" title="Line (L)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="arrow" title="Arrow (A)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M19 5h-6M19 5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn" data-tool="rect" title="Rectangle (R)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="ellipse" title="Ellipse (O)">
      <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="8" ry="6" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="polygon" title="Polygon — click each corner, then finish by tapping the start point, double-clicking, right-clicking, pressing Enter, or tapping Finish (G)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 21 9.5 17.8 20H6.2L3 9.5 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="btn" data-tool="table" id="tableBtn" title="Table — drag across the grid to pick a size, then click to place (Y)" aria-haspopup="true" aria-expanded="false" aria-controls="tablePicker">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M3 16h18M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <div class="menu table-picker" id="tablePicker" hidden>
        <div class="table-grid" id="tableGrid"></div>
        <div class="table-picker-label" id="tablePickerLabel">Pick a size</div>
      </div>
    </div>
    <button class="btn" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M12 6v13M9 19h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <!-- Insert image -->
  <div class="group">
    <button class="btn ghost" id="insertImg" title="Insert image — you can also paste (⌘/Ctrl+V) or drop a file">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9.8" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="m4.5 17 4.2-3.8 2.8 2.4L15.5 11l4 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="sep" id="colorSep"></div>

  <!-- Color: one palette, toggled between stroke & fill -->
  <div class="group" id="colorGroup">
    <button class="btn target-btn" id="colorTarget" title="Switch what the palette edits: stroke outline or fill">
      <span class="target-dot" id="targetDot"></span>
      <span class="target-lbl" id="targetLbl">Stroke</span>
    </button>
    <div class="swatches" id="swatches"></div>
    <div class="color-wrap"><input type="color" id="colorPick" value="#1f2937" title="Custom color"></div>
  </div>

  <div class="sep" id="optsSep"></div>

  <!-- Line width (hidden for the text tool) -->
  <div class="group size-ctrl" id="sizeGroup">
    <input type="range" id="size" min="1" max="60" value="6">
    <span class="size-val" id="sizeVal">6&nbsp;px</span>
  </div>

  <!-- Text font + size (shown only for the text tool) -->
  <div class="group" id="textOpts" style="display:none">
    <select id="fontFamily" class="select" title="Font">
      <option value="sans">Sans</option>
      <option value="serif">Serif</option>
      <option value="mono">Mono</option>
      <option value="cursive">Handwriting</option>
    </select>
    <select id="fontSize" class="select" title="Font size">
      <option>12</option><option>16</option><option>20</option><option>24</option>
      <option selected>28</option><option>36</option><option>48</option><option>64</option><option>96</option>
    </select>
  </div>

  <!-- Fill on/off (rectangles, ellipses, polygons & tables) -->
  <div class="group" id="fillGroup">
    <label class="check"><input type="checkbox" id="fill"> Fill</label>
  </div>

  <div class="sep" id="arrangeSep" style="display:none"></div>

  <!-- Arrange (z-order of the selection) — shown only when something is selected -->
  <div class="group" id="arrangeGroup" style="display:none">
    <button class="btn ghost" id="toDup" title="Duplicate selection (⌘/Ctrl+D)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn ghost" id="groupBtn" title="Group selection (⌘/Ctrl+G)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
    </button>
    <button class="btn ghost" id="ungroupBtn" title="Ungroup (⌘/Ctrl+Shift+G)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn ghost" id="toFront" title="Bring to front (])">
      <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="10" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7V2m0 0L9.5 4.5M12 2l2.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn ghost" id="toBack" title="Send to back ([)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M12 17v5m0 0 2.5-2.5M12 22l-2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn ghost danger" id="delSel" title="Delete selection (⌫)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="sep" id="polySep" style="display:none"></div>

  <!-- Polygon in progress: explicit finish/cancel, so touch users aren't stuck tapping the exact start point -->
  <div class="group" id="polyGroup" style="display:none">
    <button class="btn" id="polyFinish" title="Finish polygon (Enter)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17 19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Finish
    </button>
    <button class="btn ghost danger" id="polyCancel" title="Discard polygon (Esc)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6 18 18M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

</header>

<div class="stage">
  <div class="wrap" id="wrap">
    <canvas id="canvas"></canvas>
    <svg id="polyOverlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>
    <input id="textInput" type="text" autocomplete="off" spellcheck="false">
    <div class="hint" id="hint">
      Pick a tool and start sketching.<br>
      <span style="font-size:13px">Saved automatically · paste or drop an image · <kbd>⌘/Ctrl</kbd>+<kbd>Z</kbd> to undo</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- elements ----------
  const canvas = document.getElementById('canvas');
  let ctx = canvas.getContext('2d');   // reassigned briefly during PNG export to draw offscreen
  const wrap = document.getElementById('wrap');
  const hint = document.getElementById('hint');
  const textInput = document.getElementById('textInput');
  const colorPick = document.getElementById('colorPick');
  const sizeInput = document.getElementById('size');
  const sizeVal = document.getElementById('sizeVal');
  const fillInput = document.getElementById('fill');
  const fontFamilySel = document.getElementById('fontFamily');
  const fontSizeSel = document.getElementById('fontSize');
  const sizeGroup = document.getElementById('sizeGroup');
  const textOpts = document.getElementById('textOpts');
  const fillGroup = document.getElementById('fillGroup');
  const colorGroup = document.getElementById('colorGroup');
  const colorSep = document.getElementById('colorSep');
  const optsSep = document.getElementById('optsSep');
  const arrangeGroup = document.getElementById('arrangeGroup');
  const arrangeSep = document.getElementById('arrangeSep');
  const toDupBtn = document.getElementById('toDup');
  const groupBtn = document.getElementById('groupBtn');
  const ungroupBtn = document.getElementById('ungroupBtn');
  const toFrontBtn = document.getElementById('toFront');
  const toBackBtn = document.getElementById('toBack');
  const delSelBtn = document.getElementById('delSel');
  const toastEl = document.getElementById('toast');
  const polyOverlay = document.getElementById('polyOverlay');
  const polySep = document.getElementById('polySep');
  const polyGroup = document.getElementById('polyGroup');
  const polyFinishBtn = document.getElementById('polyFinish');
  const polyCancelBtn = document.getElementById('polyCancel');

  const STORE_KEY = 'simplecanvas:v1';
  const FORMAT_VERSION = 1;     // bump when the saved-file schema changes
  const BG = '#ffffff';
  const PRESETS = ['#1f2937','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#ffffff'];

  // ---------- state ----------
  let items = [];               // committed scene objects
  let current = null;           // in-progress preview object
  let ui = { tool:'pen', color:'#1f2937', size:6, fill:false, fillColor:'#ffd166', colorTarget:'stroke', fontFamily:'sans', fontSize:28, tableRows:3, tableCols:3 };
  let dpr = 1, cssW = 0, cssH = 0;

  let undoStack = [], redoStack = [];
  let historyBefore = null;     // snapshot taken at start of an interaction
  let selection = [];           // indices of selected items (select tool)
  let drag = null;              // {sx,sy,moved} drag bookkeeping
  let marquee = null;           // {x0,y0,x,y,add} rubber-band selection in progress
  let clipboard = [];           // deep-cloned items for internal copy/paste
  let groupSeq = 0;             // counter for minting fresh group ids
  let resizing = null;          // {rotation,anchor*,snapshots,moved} while dragging a corner handle
  let rotating = null;          // {cx,cy,startAngle,startRotation,field,members,moved} while dragging the rotation handle
  let polyDraft = null;         // {color,size,fill,fillColor,points} while clicking out a polygon
  let longPressTimer = null;    // pending "open text for editing" timer while a click sits still on a text item
  let assetSeq = 0;
  const assets = {};            // id -> image data URL (kept out of history snapshots)
  const imgCache = new Map();   // id -> HTMLImageElement
  const HANDLE = 9;             // resize-handle hit radius (px)
  let erasing = null;           // {removed} while an erase gesture is active
  let cursorPt = null;          // eraser cursor position (for the ring)
  let endDrag = null;           // {idx,end:1|2,moved} while dragging one endpoint of a lone line/arrow
  let snapPt = null;            // anchor a line/arrow endpoint is currently snapped to (for the indicator ring)
  const SNAP_R = 12;            // snap magnet radius (px)

  // ---------- helpers ----------
  const snap = () => JSON.stringify(items);
  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = n => Math.round(n*100)/100;

  function beginHistory(){ historyBefore = snap(); }
  function commitHistory(){
    if(historyBefore === null) return;
    undoStack.push(historyBefore);
    if(undoStack.length > 80) undoStack.shift();
    redoStack = [];
    historyBefore = null;
    save(); updateButtons();
  }

  function referencedAssets(){
    const used = {};
    for(const it of items){ if(it.type==='image' && assets[it.id]) used[it.id] = assets[it.id]; }
    return used;
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify({items, assets:referencedAssets()})); }
    catch(e){
      console.warn('Could not save sketch:', e);
      toast('Sketch too large to auto-save (try fewer/smaller images)');
    }
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      if(Array.isArray(d)){ items = d; }                 // legacy format (items only)
      else if(d && Array.isArray(d.items)){
        items = d.items;
        if(d.assets) Object.assign(assets, d.assets);
      }
      items = items.filter(it => it && it.mode !== 'eraser');  // drop legacy white-stroke "erasers"
    }catch(e){ console.warn('Could not load sketch:', e); }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1600);
  }

  // ---------- sizing ----------
  function resize(){
    const r = wrap.getBoundingClientRect();
    cssW = Math.max(1, Math.floor(r.width));
    cssH = Math.max(1, Math.floor(r.height));
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(cssW*dpr);
    canvas.height = Math.floor(cssH*dpr);
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    polyOverlay.setAttribute('viewBox', '0 0 '+cssW+' '+cssH);
    render();
  }

  // ---------- drawing primitives ----------
  function strokeWidthOf(it){ return it.mode === 'brush' ? it.size*1.6 : it.size; }
  function strokeStyleFor(it){
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = it.color;
    ctx.lineWidth = strokeWidthOf(it);
    if(it.mode === 'marker'){ ctx.lineCap = 'square'; ctx.globalAlpha = 0.4; } // translucent highlighter
  }

  function drawSmoothPath(p){
    if(p.length === 1){
      ctx.beginPath();
      ctx.arc(p[0].x, p[0].y, Math.max(0.5, ctx.lineWidth/2), 0, Math.PI*2);
      ctx.fillStyle = ctx.strokeStyle; ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for(let i=1;i<p.length-1;i++){
      const mx=(p[i].x+p[i+1].x)/2, my=(p[i].y+p[i+1].y)/2;
      ctx.quadraticCurveTo(p[i].x, p[i].y, mx, my);
    }
    ctx.lineTo(p[p.length-1].x, p[p.length-1].y);
    ctx.stroke();
  }

  // Arrowheads live on lines and arrows alike: a 'line' has none, an 'arrow' has one at its end
  // unless told otherwise (he:false), and optionally one at its start (hs:true). Toggling heads
  // flips the type so old files and every existing `case 'arrow'` keep working.
  function headsOf(it){ return { s: it.type==='arrow' && !!it.hs, e: it.type==='arrow' && it.he!==false }; }
  function setHeads(it, s, e){
    delete it.hs; delete it.he;
    if(!s && !e){ it.type='line'; return; }
    it.type='arrow';
    if(s) it.hs = true;
    if(!e) it.he = false;
  }
  function drawArrowHead(x1,y1,x2,y2,size){
    const ang = Math.atan2(y2-y1, x2-x1);
    const len = Math.max(10, size*2.6);
    const a = Math.PI/7;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - len*Math.cos(ang-a), y2 - len*Math.sin(ang-a));
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - len*Math.cos(ang+a), y2 - len*Math.sin(ang+a));
    ctx.stroke();
  }

  function getImg(id){
    if(imgCache.has(id)) return imgCache.get(id);
    const src = assets[id];
    if(!src) return null;
    const im = new Image();
    im.onload = render;
    im.src = src;
    imgCache.set(id, im);
    return im;
  }

  function drawItem(it){
    ctx.save();
    if(it.group!=null && it.groupRotation){
      const piv = groupPivot(it.group);
      ctx.translate(piv.cx,piv.cy); ctx.rotate(it.groupRotation); ctx.translate(-piv.cx,-piv.cy);
    }
    if(it.rotation){
      const b = bbox(it);
      const cx = b.x+b.w/2, cy = b.y+b.h/2;
      ctx.translate(cx,cy); ctx.rotate(it.rotation); ctx.translate(-cx,-cy);
    }
    switch(it.type){
      case 'image':{
        const im = getImg(it.id);
        if(im && im.complete && im.naturalWidth){ ctx.drawImage(im, it.x, it.y, it.w, it.h); }
        break;
      }
      case 'path':
        strokeStyleFor(it);
        drawSmoothPath(it.points);
        break;
      case 'line':
      case 'arrow':
        ctx.strokeStyle = it.color; ctx.lineWidth = it.size; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(it.x1,it.y1); ctx.lineTo(it.x2,it.y2); ctx.stroke();
        { const h = headsOf(it);
          if(h.e) drawArrowHead(it.x1,it.y1,it.x2,it.y2,it.size);
          if(h.s) drawArrowHead(it.x2,it.y2,it.x1,it.y1,it.size); }
        break;
      case 'rect':
        ctx.lineJoin = 'round'; ctx.lineWidth = it.size;
        if(it.fill){ ctx.fillStyle = it.fillColor || it.color; ctx.fillRect(it.x,it.y,it.w,it.h); }
        ctx.strokeStyle = it.color; ctx.strokeRect(it.x,it.y,it.w,it.h);
        break;
      case 'ellipse':
        ctx.lineWidth = it.size;
        ctx.beginPath();
        ctx.ellipse(it.x+it.w/2, it.y+it.h/2, Math.abs(it.w/2), Math.abs(it.h/2), 0, 0, Math.PI*2);
        if(it.fill){ ctx.fillStyle = it.fillColor || it.color; ctx.fill(); }
        ctx.strokeStyle = it.color; ctx.stroke();
        break;
      case 'polygon':
        ctx.lineJoin = 'round'; ctx.lineWidth = it.size;
        ctx.beginPath();
        ctx.moveTo(it.points[0].x, it.points[0].y);
        for(let i=1;i<it.points.length;i++) ctx.lineTo(it.points[i].x, it.points[i].y);
        ctx.closePath();
        if(it.fill){ ctx.fillStyle = it.fillColor || it.color; ctx.fill(); }
        ctx.strokeStyle = it.color; ctx.stroke();
        break;
      case 'text':
        ctx.fillStyle = it.color;
        ctx.textBaseline = 'top';
        ctx.font = it.font;
        ctx.fillText(it.text, it.x, it.y);
        break;
      case 'table':
        ctx.lineJoin = 'round'; ctx.lineWidth = it.size;
        if(it.fill){ ctx.fillStyle = it.fillColor || it.color; ctx.fillRect(it.x, it.y, it.w, it.h); }
        ctx.strokeStyle = it.color;
        ctx.strokeRect(it.x, it.y, it.w, it.h);
        ctx.beginPath();
        for(let i=1;i<it.rows;i++){ const yy = it.y + it.h*i/it.rows; ctx.moveTo(it.x, yy); ctx.lineTo(it.x+it.w, yy); }
        for(let j=1;j<it.cols;j++){ const xx = it.x + it.w*j/it.cols; ctx.moveTo(xx, it.y); ctx.lineTo(xx, it.y+it.h); }
        ctx.stroke();
        break;
    }
    ctx.restore();
  }

  // Draw a polygon that is still being clicked out (open path + rubber-band edge to the cursor)
  function drawPolygonDraft(it){
    if(!it.points.length) return;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = it.size; ctx.strokeStyle = it.color; ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(it.points[0].x, it.points[0].y);
    for(let i=1;i<it.points.length;i++) ctx.lineTo(it.points[i].x, it.points[i].y);
    if(it._hover) ctx.lineTo(it._hover.x, it._hover.y);
    ctx.stroke();
    if(it._hover && it.points.length>=3){
      const first = it.points[0];
      if(Math.hypot(it._hover.x-first.x, it._hover.y-first.y) <= 10){
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#6366f1';
        ctx.beginPath(); ctx.moveTo(it._hover.x, it._hover.y); ctx.lineTo(first.x, first.y); ctx.stroke();
      }
    }
    ctx.setLineDash([]); ctx.fillStyle = it.color;
    for(const p of it.points){ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  // ---------- bounding boxes / hit testing ----------
  function bbox(it){
    switch(it.type){
      case 'path':{
        let xs=it.points.map(p=>p.x), ys=it.points.map(p=>p.y);
        const pad=strokeWidthOf(it)/2+2;
        return {x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
      }
      case 'line':case 'arrow':{
        const pad=(it.size||2)/2+4;
        const x=Math.min(it.x1,it.x2), y=Math.min(it.y1,it.y2);
        return {x:x-pad,y:y-pad,w:Math.abs(it.x2-it.x1)+pad*2,h:Math.abs(it.y2-it.y1)+pad*2};
      }
      case 'rect':case 'ellipse':case 'table':{
        const x=Math.min(it.x,it.x+it.w), y=Math.min(it.y,it.y+it.h);
        return {x:x-2,y:y-2,w:Math.abs(it.w)+4,h:Math.abs(it.h)+4};
      }
      case 'text':{
        ctx.save(); ctx.font=it.font; const m=ctx.measureText(it.text); ctx.restore();
        const h = it.fontSize || 24;
        return {x:it.x-2,y:it.y-2,w:m.width+4,h:h+6};
      }
      case 'image':
        return {x:it.x, y:it.y, w:it.w, h:it.h};
      case 'polygon':{
        let xs=it.points.map(p=>p.x), ys=it.points.map(p=>p.y);
        const pad=(it.size||2)/2+2;
        return {x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
      }
    }
    return {x:0,y:0,w:0,h:0};
  }
  function inBox(b,x,y){ return x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h; }

  // ---------- rotation helpers ----------
  // Two independent, nestable rotation layers, both purely rendering/hit-test transforms —
  // stored coordinates always stay in the item's unrotated ("local") frame:
  //  - it.rotation: the item's own spin, pivoted on its own bbox center.
  //  - it.groupRotation: shared identically by every member of a group, pivoted on the group's
  //    own (own-rotation-only) baseline bounding box center, applied OUTSIDE each member's own
  //    rotation — so rotating a group spins it as one rigid body without touching each member's
  //    individual spin.
  function rotatePoint(x,y,cx,cy,ang){
    const s=Math.sin(ang), c=Math.cos(ang);
    const dx=x-cx, dy=y-cy;
    return { x: cx + dx*c - dy*s, y: cy + dx*s + dy*c };
  }
  // world bbox using ONLY the item's own rotation (never groupRotation) — this is the stable
  // baseline used to find a group's pivot, so it can never recurse into the group-aware worldBBox.
  function worldBBoxOwn(it){
    const b = bbox(it);
    if(!it.rotation) return b;
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    const corners = [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]]
      .map(([x,y])=>rotatePoint(x,y,cx,cy,it.rotation));
    const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
    return {x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)};
  }
  function unionBoxOwn(idxs){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const i of idxs){ const b=worldBBoxOwn(items[i]); x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); }
    return {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }
  // a group's fixed pivot + its baseline (own-rotation-only) bounding box — the box a group's
  // outline/handle are drawn in before the outer groupRotation transform is applied
  function groupPivot(groupId){
    const box = unionBoxOwn(itemsInGroup(groupId));
    return { cx:box.x+box.w/2, cy:box.y+box.h/2, box };
  }
  // world point -> item's local (unrotated) frame — undoes groupRotation first, then own rotation
  // (the reverse order of how they're applied when drawing)
  function toLocal(it,x,y){
    let px=x, py=y;
    if(it.group!=null && it.groupRotation){
      const piv = groupPivot(it.group);
      const p = rotatePoint(px,py,piv.cx,piv.cy,-it.groupRotation);
      px=p.x; py=p.y;
    }
    if(!it.rotation) return {x:px,y:py};
    const b = bbox(it);
    return rotatePoint(px,py, b.x+b.w/2, b.y+b.h/2, -it.rotation);
  }
  // item's local frame -> world point (the inverse of toLocal: own rotation first, then groupRotation)
  function toWorld(it,x,y){
    let p = {x,y};
    if(it.rotation){ const b = bbox(it); p = rotatePoint(p.x,p.y, b.x+b.w/2, b.y+b.h/2, it.rotation); }
    if(it.group!=null && it.groupRotation){ const piv = groupPivot(it.group); p = rotatePoint(p.x,p.y,piv.cx,piv.cy,it.groupRotation); }
    return p;
  }

  // ---------- snapping (line/arrow endpoints magnetize to these anchors) ----------
  // Anchors are the spots an arrow would naturally meet a shape: corners, side midpoints and the
  // center of boxes; the four extreme points of an ellipse; per-row (left edge) and per-column (top
  // edge) midpoints of a table; polygon vertices and edge midpoints; the two ends of lines and strokes.
  function snapAnchorsOf(it){
    const pts = [];
    const norm4 = (x,y,w,h)=>({ x0:Math.min(x,x+w), y0:Math.min(y,y+h), W:Math.abs(w), H:Math.abs(h) });
    switch(it.type){
      case 'rect': case 'image': case 'text': {
        const b = it.type==='text' ? bbox(it) : null;
        const {x0,y0,W,H} = b ? norm4(b.x,b.y,b.w,b.h) : norm4(it.x,it.y,it.w,it.h);
        for(const fx of [0,.5,1]) for(const fy of [0,.5,1]) pts.push({x:x0+W*fx, y:y0+H*fy});
        break;
      }
      case 'ellipse': {
        const {x0,y0,W,H} = norm4(it.x,it.y,it.w,it.h);
        pts.push({x:x0+W/2,y:y0},{x:x0+W/2,y:y0+H},{x:x0,y:y0+H/2},{x:x0+W,y:y0+H/2},{x:x0+W/2,y:y0+H/2});
        break;
      }
      case 'table': {
        const {x0,y0,W,H} = norm4(it.x,it.y,it.w,it.h);
        // corners and the true midpoint of each edge (so the middle is always reachable, even with an
        // even row/column count), plus a per-row midpoint on the left/right edges and a per-column
        // midpoint on the top/bottom edges
        for(const fx of [0,.5,1]) for(const fy of [0,.5,1]) if(fx!==.5 || fy!==.5) pts.push({x:x0+W*fx, y:y0+H*fy});
        for(let r=0;r<it.rows;r++){ const y=y0+H*(r+.5)/it.rows; pts.push({x:x0,y},{x:x0+W,y}); }
        for(let c=0;c<it.cols;c++){ const x=x0+W*(c+.5)/it.cols; pts.push({x,y:y0},{x,y:y0+H}); }
        break;
      }
      case 'polygon': {
        const n = it.points.length;
        let cx=0, cy=0;
        for(let i=0;i<n;i++){
          const a = it.points[i], b = it.points[(i+1)%n];
          pts.push({x:a.x,y:a.y}, {x:(a.x+b.x)/2, y:(a.y+b.y)/2});
          cx+=a.x; cy+=a.y;
        }
        if(n) pts.push({x:cx/n, y:cy/n});
        break;
      }
      case 'path': {
        const n = it.points.length;
        if(n){ pts.push(it.points[0]); if(n>1) pts.push(it.points[n-1]); }
        break;
      }
      case 'line': case 'arrow':
        pts.push({x:it.x1,y:it.y1},{x:it.x2,y:it.y2});
        break;
    }
    return pts.map(p=>toWorld(it,p.x,p.y));
  }
  // nearest anchor within SNAP_R of (x,y), or null; excludeIdx = the item being edited itself
  function nearestSnap(x,y,excludeIdx){
    let best=null, bestD=SNAP_R;
    for(let i=0;i<items.length;i++){
      if(i===excludeIdx) continue;
      for(const p of snapAnchorsOf(items[i])){
        const d = Math.hypot(p.x-x, p.y-y);
        if(d<bestD){ bestD=d; best=p; }
      }
    }
    return best;
  }
  // a lone, ungrouped line/arrow gets endpoint handles instead of corner handles
  function loneLineIdx(sel){
    if(!sel || sel.length!==1) return null;
    const it = items[sel[0]];
    return it && it.group==null && (it.type==='line' || it.type==='arrow') ? sel[0] : null;
  }
  function lineEnds(it){ return [toWorld(it,it.x1,it.y1), toWorld(it,it.x2,it.y2)]; }
  // 45° constraint of (x,y) around a fixed point, keeping the cursor's distance
  function constrainAngle(fx,fy,x,y){
    const dx=x-fx, dy=y-fy, dist=Math.hypot(dx,dy);
    const ang = Math.round(Math.atan2(dy,dx)/(Math.PI/4)) * (Math.PI/4);
    return { x:norm(fx + Math.cos(ang)*dist), y:norm(fy + Math.sin(ang)*dist) };
  }

  // axis-aligned box that fully contains the item as actually rendered (own rotation AND
  // groupRotation) — used wherever we compare against world-space rectangles (marquee, PNG export)
  function worldBBox(it){
    let b = worldBBoxOwn(it);
    if(it.group!=null && it.groupRotation){
      const piv = groupPivot(it.group);
      const corners = [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]]
        .map(([x,y])=>rotatePoint(x,y,piv.cx,piv.cy,it.groupRotation));
      const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
      b = {x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)};
    }
    return b;
  }
  function hitTest(x,y){
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      const p = toLocal(it,x,y);
      if(inBox(bbox(it),p.x,p.y)) return i;
    }
    return -1;
  }
  function rectsIntersect(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }
  function marqueeRect(){
    const x = Math.min(marquee.x0, marquee.x), y = Math.min(marquee.y0, marquee.y);
    return { x, y, w:Math.abs(marquee.x-marquee.x0), h:Math.abs(marquee.y-marquee.y0) };
  }
  function itemsInGroup(g){
    const out=[]; for(let i=0;i<items.length;i++){ if(items[i].group===g) out.push(i); } return out;
  }
  // grow a set of indices so any touched group is fully included (groups select as a unit)
  function expandSelection(sel){
    const groups = new Set();
    for(const i of sel){ const g = items[i] && items[i].group; if(g!=null) groups.add(g); }
    if(!groups.size) return sel.slice();
    const set = new Set(sel);
    for(let i=0;i<items.length;i++){ if(groups.has(items[i].group)) set.add(i); }
    return [...set];
  }
  function unionBox(idxs){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const i of idxs){ const b=worldBBox(items[i]); x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); }
    return {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }

  // One rotation handle/pivot descriptor that works for both cases: a lone ungrouped item rotates
  // around its own center (handle rides along with its own rotation); a whole group rotates as a
  // rigid body around the group's fixed pivot (handle rides along with the group's rotation too).
  function rotationPivotFor(sel){
    if(!sel || !sel.length) return null;
    const first = items[sel[0]];
    if(!first) return null;
    if(sel.length===1 && first.group==null){
      const b = bbox(first);
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      return { cx, cy, stemTop:b.y-3, handleX:cx, handleY:b.y-26, rotation:first.rotation||0, members:[sel[0]], isGroup:false };
    }
    if(first.group!=null){
      const grp = itemsInGroup(first.group);
      const piv = groupPivot(first.group);
      const u = piv.box;
      return { cx:piv.cx, cy:piv.cy, stemTop:u.y-4, handleX:piv.cx, handleY:u.y-30, rotation:first.groupRotation||0, members:grp, isGroup:true };
    }
    return null;
  }

  // ---------- resize (corner handles) ----------
  // Captures just the coordinates a resize needs to touch, so each move-frame can recompute the
  // new geometry fresh from this untouched snapshot rather than compounding rounding error.
  function snapshotOf(it){
    switch(it.type){
      case 'rect': case 'ellipse': case 'image': case 'table': return {x:it.x, y:it.y, w:it.w, h:it.h};
      case 'line': case 'arrow': return {x1:it.x1, y1:it.y1, x2:it.x2, y2:it.y2};
      case 'path': case 'polygon': return {points: it.points.map(p=>({x:p.x,y:p.y}))};
      case 'text': return {x:it.x, y:it.y, font:it.font};
      default: return {};
    }
  }
  // Scale one point relative to a fixed anchor by independent per-axis factors.
  function scalePt(p, ax, ay, sx, sy){ return { x: ax+(p.x-ax)*sx, y: ay+(p.y-ay)*sy }; }
  function applyScaleFromSnapshot(it, snap, ax, ay, sx, sy){
    switch(it.type){
      case 'rect': case 'ellipse': case 'image': case 'table': {
        const p1 = scalePt({x:snap.x,y:snap.y}, ax,ay,sx,sy);
        const p2 = scalePt({x:snap.x+snap.w,y:snap.y+snap.h}, ax,ay,sx,sy);
        it.x = Math.min(p1.x,p2.x); it.y = Math.min(p1.y,p2.y);
        it.w = Math.abs(p2.x-p1.x); it.h = Math.abs(p2.y-p1.y);
        break;
      }
      case 'line': case 'arrow': {
        const p1 = scalePt({x:snap.x1,y:snap.y1}, ax,ay,sx,sy);
        const p2 = scalePt({x:snap.x2,y:snap.y2}, ax,ay,sx,sy);
        it.x1=p1.x; it.y1=p1.y; it.x2=p2.x; it.y2=p2.y;
        break;
      }
      case 'path': case 'polygon':
        it.points = snap.points.map(p=>scalePt(p, ax,ay,sx,sy));
        break;
      case 'text': {
        const p = scalePt({x:snap.x,y:snap.y}, ax,ay,sx,sy);
        it.x=p.x; it.y=p.y;
        const avg = (Math.abs(sx)+Math.abs(sy))/2;
        const m = snap.font.match(/(\d+)px/);
        if(m) it.font = snap.font.replace(/\d+px/, Math.max(8, Math.round(parseInt(m[1],10)*avg))+'px');
        break;
      }
    }
  }
  // One descriptor for both cases, exactly like rotationPivotFor: a lone ungrouped item resizes in
  // its own local (unrotated) box; a whole group resizes together in the group's baseline box.
  function resizePivotFor(sel){
    if(!sel || !sel.length) return null;
    const first = items[sel[0]];
    if(!first) return null;
    if(sel.length===1 && first.group==null){
      if(first.type==='text') return null;   // resizing text alone would just be a proxy for font size — not wanted
      if(first.type==='line' || first.type==='arrow') return null;   // these get endpoint handles instead
      const b = bbox(first);
      return { box:b, rotation:first.rotation||0, cx:b.x+b.w/2, cy:b.y+b.h/2, isGroup:false, members:[sel[0]] };
    }
    if(first.group!=null){
      const piv = groupPivot(first.group);
      return { box:piv.box, rotation:first.groupRotation||0, cx:piv.cx, cy:piv.cy, isGroup:true, members:itemsInGroup(first.group) };
    }
    return null;
  }

  function translateItem(it,dx,dy){
    switch(it.type){
      case 'path': case 'polygon': it.points.forEach(p=>{p.x=norm(p.x+dx);p.y=norm(p.y+dy);}); break;
      case 'line':case 'arrow': it.x1=norm(it.x1+dx);it.y1=norm(it.y1+dy);it.x2=norm(it.x2+dx);it.y2=norm(it.y2+dy); break;
      default: it.x=norm(it.x+dx); it.y=norm(it.y+dy);
    }
  }

  // ---------- eraser: rubs out freehand strokes, deletes shapes/text/images it touches ----------
  function eraserR(){ return Math.max(6, ui.size); }
  // Cut a freehand stroke wherever it passes under the eraser ring; returns the
  // surviving sub-strokes (0 or more), or null if the ring didn't touch this stroke.
  function splitPath(it, x, y, r){
    const t = r + strokeWidthOf(it)/2;   // hit the painted ink, not just the centerline
    const lp = toLocal(it, x, y);        // rotated strokes are stored in local coords
    const runs=[]; let cur=[]; let changed=false;
    for(const pt of it.points){
      if(Math.hypot(pt.x-lp.x, pt.y-lp.y) <= t){ changed=true; if(cur.length){ runs.push(cur); cur=[]; } }
      else cur.push(pt);
    }
    if(cur.length) runs.push(cur);
    if(!changed) return null;
    return runs.filter(pts=>pts.length>0).map(pts => Object.assign({}, it, {points:pts}));
  }
  function eraseAt(x,y){
    const r = eraserR();
    let removed = false;
    for(let i=items.length-1;i>=0;i--){
      if(items[i].type !== 'path') continue;            // eraser only affects freehand strokes
      const res = splitPath(items[i], x, y, r);
      if(res){ items.splice(i, 1, ...res); removed = true; }
    }
    return removed;
  }

  // ---------- render ----------
  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,cssW,cssH);

    items.forEach((it,i)=>{ if(i!==editingTextIdx) drawItem(it); });
    if(current){ current.type==='polygon' ? drawPolygonDraft(current) : drawItem(current); }

    // selection outlines, rotation/resize handles, and the rubber-band box — suppressed while
    // editing text, since the input's own box never quite matches the item's drawn outline
    if(ui.tool==='select' && editingTextIdx==null){
      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#6366f1';
      // dashed outline for each ungrouped selected item — rotated along with the item itself
      ctx.setLineDash([5,4]);
      for(const i of selection){
        const it = items[i]; if(!it || it.group!=null) continue;
        const b = bbox(it);
        const cx=b.x+b.w/2, cy=b.y+b.h/2;
        ctx.save();
        if(it.rotation){ ctx.translate(cx,cy); ctx.rotate(it.rotation); ctx.translate(-cx,-cy); }
        ctx.strokeRect(b.x-3, b.y-3, b.w+6, b.h+6);
        ctx.restore();
      }
      // solid box around each selected group — rotates as one rigid piece with its members
      ctx.setLineDash([]);
      const seenGroups = new Set();
      for(const i of selection){
        const it = items[i]; if(!it || it.group==null || seenGroups.has(it.group)) continue;
        seenGroups.add(it.group);
        const piv = groupPivot(it.group);
        const u = piv.box;
        const grot = it.groupRotation||0;
        ctx.save();
        if(grot){ ctx.translate(piv.cx,piv.cy); ctx.rotate(grot); ctx.translate(-piv.cx,-piv.cy); }
        ctx.strokeRect(u.x-4, u.y-4, u.w+8, u.h+8);
        ctx.restore();
      }
      // resize handles — 4 corners of the lone item's box, or of the whole group's box
      if(selection.length){
        const rp = resizePivotFor(selection);
        if(rp){
          const b = rp.box;
          ctx.save();
          if(rp.rotation){ ctx.translate(rp.cx,rp.cy); ctx.rotate(rp.rotation); ctx.translate(-rp.cx,-rp.cy); }
          ctx.setLineDash([]);
          ctx.fillStyle = '#fff'; ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
          for(const [hx,hy] of [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]]){
            ctx.beginPath(); ctx.rect(hx-5, hy-5, 10, 10); ctx.fill(); ctx.stroke();
          }
          ctx.restore();
        }
      }
      // endpoint handles — round knobs on both ends of a lone line/arrow
      const li = loneLineIdx(selection);
      if(li!=null){
        ctx.setLineDash([]);
        // filled knob = arrowhead at that end; a plain click on a knob toggles it
        ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
        const h = headsOf(items[li]);
        lineEnds(items[li]).forEach((p,k)=>{
          ctx.fillStyle = (k===0 ? h.s : h.e) ? '#6366f1' : '#fff';
          ctx.beginPath(); ctx.arc(p.x, p.y, 5.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        });
      }
      // rotation handle — a small knob above the item (or above the whole group's box)
      if(selection.length){
        const piv = rotationPivotFor(selection);
        if(piv){
          ctx.save();
          if(piv.rotation){ ctx.translate(piv.cx,piv.cy); ctx.rotate(piv.rotation); ctx.translate(-piv.cx,-piv.cy); }
          ctx.setLineDash([]);
          ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(piv.handleX, piv.stemTop); ctx.lineTo(piv.handleX, piv.handleY); ctx.stroke();
          ctx.beginPath(); ctx.arc(piv.handleX, piv.handleY, 6, 0, Math.PI*2);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#6366f1'; ctx.stroke();
          ctx.restore();
        }
      }
      if(marquee){
        const r = marqueeRect();
        ctx.setLineDash([3,3]); ctx.strokeStyle = '#818cf8';
        for(let i=0;i<items.length;i++){
          if(rectsIntersect(worldBBox(items[i]), r)){ const b = worldBBox(items[i]); ctx.strokeRect(b.x-3, b.y-3, b.w+6, b.h+6); }
        }
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#6366f1'; ctx.fillStyle = 'rgba(99,102,241,.10)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      }
      ctx.restore();
    }

    // snap indicator — ring around the anchor a line/arrow endpoint is magnetized to
    if(snapPt){
      ctx.save();
      ctx.setLineDash([]);
      ctx.lineWidth = 2; ctx.strokeStyle = '#6366f1';
      ctx.beginPath(); ctx.arc(snapPt.x, snapPt.y, 7, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // eraser size ring
    if(ui.tool==='eraser' && cursorPt){
      ctx.save();
      ctx.setLineDash([3,3]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#9ca3af';
      ctx.beginPath();
      ctx.arc(cursorPt.x, cursorPt.y, eraserR(), 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    hint.style.display = (items.length===0 && !current) ? 'block' : 'none';
    updateOrderButtons();
    updatePolyButtons();
  }

  // ---------- pointer interaction ----------
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x:norm(e.clientX-r.left), y:norm(e.clientY-r.top) };
  }

  function onDown(e){
    if(e.button!==undefined && e.button!==0) return;
    if(textInput.style.display==='block'){ commitText(); }
    const {x,y} = pos(e);
    canvas.setPointerCapture(e.pointerId);

    if(ui.tool==='select'){
      // rotation handle — of the lone selected item, or of the whole group if a group is selected
      if(selection.length){
        const piv = rotationPivotFor(selection);
        if(piv){
          let lp = {x,y};
          if(piv.rotation) lp = rotatePoint(x,y,piv.cx,piv.cy,-piv.rotation);
          if(Math.hypot(lp.x-piv.handleX, lp.y-piv.handleY) <= 9){
            beginHistory();
            rotating = { cx:piv.cx, cy:piv.cy, startAngle:Math.atan2(y-piv.cy, x-piv.cx),
                         startRotation:piv.rotation, field: piv.isGroup?'groupRotation':'rotation',
                         members:piv.members, moved:false };
            return;
          }
        }
      }
      // endpoint handles of a lone line/arrow — drag one end, the other stays put
      const li = loneLineIdx(selection);
      if(li!=null){
        const it = items[li], ends = lineEnds(it);
        for(let k=0;k<2;k++){
          if(Math.hypot(x-ends[k].x, y-ends[k].y) <= HANDLE){
            beginHistory();
            // bake any rotation into the stored coordinates so the endpoint can be moved in world space
            it.x1=norm(ends[0].x); it.y1=norm(ends[0].y); it.x2=norm(ends[1].x); it.y2=norm(ends[1].y); delete it.rotation;
            endDrag = { idx:li, end:k+1, sx:x, sy:y, moved:false };   // a click without a drag toggles the head instead
            return;
          }
        }
      }
      // resize handles — 4 corners of the lone item's box, or of the whole group's box
      if(selection.length){
        const rp = resizePivotFor(selection);
        if(rp){
          const lp = rp.rotation ? rotatePoint(x,y,rp.cx,rp.cy,-rp.rotation) : {x,y};
          const b = rp.box;
          const corners = {
            nw:{x:b.x,       y:b.y,       ax:b.x+b.w, ay:b.y+b.h},
            ne:{x:b.x+b.w,   y:b.y,       ax:b.x,     ay:b.y+b.h},
            sw:{x:b.x,       y:b.y+b.h,   ax:b.x+b.w, ay:b.y},
            se:{x:b.x+b.w,   y:b.y+b.h,   ax:b.x,     ay:b.y},
          };
          let hitHandle = null, bestD = HANDLE;
          for(const key in corners){
            const c = corners[key];
            const d = Math.hypot(lp.x-c.x, lp.y-c.y);
            if(d<=bestD){ bestD=d; hitHandle=key; }
          }
          if(hitHandle){
            const c = corners[hitHandle];
            beginHistory();
            const Aw = rp.rotation ? rotatePoint(c.ax, c.ay, rp.cx, rp.cy, rp.rotation) : {x:c.ax, y:c.ay};
            resizing = {
              rotation:rp.rotation,
              anchorX:c.ax, anchorY:c.ay,
              anchorWorldX:Aw.x, anchorWorldY:Aw.y,
              origW: b.w, origH: b.h,
              origSignedW: c.x-c.ax, origSignedH: c.y-c.ay,
              snapshots: rp.members.map(idx=>({idx, snap:snapshotOf(items[idx])})),
              moved:false
            };
            return;
          }
        }
      }
      const hit = hitTest(x,y);
      if(hit>=0){
        const g = items[hit].group;
        const grp = (g!=null) ? itemsInGroup(g) : [hit];         // grouped item → grab the whole group
        if(e.shiftKey){
          if(selection.indexOf(hit)>=0){ selection = selection.filter(i=>grp.indexOf(i)<0); render(); return; }
          for(const i of grp) if(selection.indexOf(i)<0) selection.push(i);
        } else if(selection.indexOf(hit)<0){
          selection = grp.slice();
        }
        beginHistory();
        drag = {sx:x, sy:y, moved:false};
        if(items[hit].type==='text'){
          const textIdx = hit;
          longPressTimer = setTimeout(()=>{
            longPressTimer = null;
            if(drag && !drag.moved){
              historyBefore = null; drag = null;
              openText(items[textIdx].x, items[textIdx].y, textIdx);
            }
          }, 500);
        }
        render();
      } else {
        marquee = { x0:x, y0:y, x, y, add:e.shiftKey };           // empty space → rubber-band box
        if(!e.shiftKey) selection = [];
        render();
      }
      return;
    }
    if(ui.tool==='text'){ openText(x,y); return; }

    if(ui.tool==='table'){ placeTable(x,y); return; }

    if(ui.tool==='polygon'){ handlePolygonClick(x,y); return; }

    if(ui.tool==='eraser'){
      beginHistory();
      erasing = { removed:false, last:{x,y} };
      if(eraseAt(x,y)) erasing.removed = true;
      render();
      return;
    }

    beginHistory();
    if(ui.tool==='pen' || ui.tool==='marker' || ui.tool==='brush'){
      current = { type:'path', mode:ui.tool, color:ui.color, size:ui.size, points:[{x,y}] };
    } else if(ui.tool==='line' || ui.tool==='arrow'){
      snapPt = e.altKey ? null : nearestSnap(x,y);          // the start point snaps too
      const sx = snapPt ? snapPt.x : x, sy = snapPt ? snapPt.y : y;
      current = { type:ui.tool, color:ui.color, size:ui.size, x1:sx,y1:sy,x2:sx,y2:sy };
    } else if(ui.tool==='rect' || ui.tool==='ellipse'){
      current = { type:ui.tool, color:ui.color, size:ui.size, fill:ui.fill, fillColor:ui.fillColor, _x0:x,_y0:y, x:x,y:y,w:0,h:0 };
    }
    render();
  }

  function onMove(e){
    const p = pos(e);
    if(ui.tool==='eraser' && !erasing){ cursorPt = p; render(); }   // track ring while idle
    if(!current && !drag && !resizing && !erasing && !marquee && !rotating && !endDrag) return;
    const {x,y} = p;

    if(endDrag){
      if(!endDrag.moved && Math.hypot(x-endDrag.sx, y-endDrag.sy) < 3) return;   // still a click, not a drag
      const it = items[endDrag.idx];
      const fx = endDrag.end===1 ? it.x2 : it.x1, fy = endDrag.end===1 ? it.y2 : it.y1;   // the fixed end
      let nx=x, ny=y;
      if(e.shiftKey){ ({x:nx,y:ny} = constrainAngle(fx,fy,x,y)); snapPt = null; }
      else { snapPt = e.altKey ? null : nearestSnap(x,y,endDrag.idx); if(snapPt){ nx=snapPt.x; ny=snapPt.y; } }
      if(endDrag.end===1){ it.x1=norm(nx); it.y1=norm(ny); } else { it.x2=norm(nx); it.y2=norm(ny); }
      endDrag.moved = true;
      render();
      return;
    }

    if(erasing){
      cursorPt = p;
      const r = eraserR();
      const last = erasing.last || p;
      const steps = Math.max(1, Math.ceil(Math.hypot(p.x-last.x, p.y-last.y)/(r/2)));
      for(let s=1;s<=steps;s++){
        const ex = last.x + (p.x-last.x)*s/steps;
        const ey = last.y + (p.y-last.y)*s/steps;
        if(eraseAt(ex,ey)) erasing.removed = true;
      }
      erasing.last = p;
      render();
      return;
    }

    if(rotating){
      const ang = Math.atan2(y-rotating.cy, x-rotating.cx);
      const delta = ang - rotating.startAngle;
      let newRot = rotating.startRotation + delta;
      if(e.shiftKey){ const step = Math.PI/12; newRot = Math.round(newRot/step)*step; }  // snap to 15° steps from absolute zero
      for(const idx of rotating.members) items[idx][rotating.field] = newRot;
      rotating.moved = true;
      render();
      return;
    }

    if(resizing){
      const rot = resizing.rotation;
      const rotd = rot ? rotatePoint(x, y, resizing.anchorWorldX, resizing.anchorWorldY, -rot) : {x,y};
      let dx = rotd.x - resizing.anchorWorldX, dy = rotd.y - resizing.anchorWorldY;
      if(e.shiftKey){
        // proportional: project onto the original diagonal (anchor -> original corner)
        const dW = resizing.origSignedW, dH = resizing.origSignedH;
        const len2 = dW*dW + dH*dH;
        const t = len2 ? (dx*dW + dy*dH) / len2 : 1;
        dx = t*dW; dy = t*dH;
      }
      let sx = resizing.origSignedW ? dx/resizing.origSignedW : 1;
      let sy = resizing.origSignedH ? dy/resizing.origSignedH : 1;
      const MIN=0.02;
      if(Math.abs(sx)<MIN){ sx = sx<0?-MIN:MIN; dx = sx*resizing.origSignedW; }
      if(Math.abs(sy)<MIN){ sy = sy<0?-MIN:MIN; dy = sy*resizing.origSignedH; }
      for(const {idx,snap} of resizing.snapshots) applyScaleFromSnapshot(items[idx], snap, resizing.anchorX, resizing.anchorY, sx, sy);
      if(rot){
        // resizing moves the box's center, and everything rotates around that center — compensate
        // with a plain shift so the anchor corner's WORLD position lands exactly back where it was
        const halfW = dx/2, halfH = dy/2;
        const c = Math.cos(rot), s = Math.sin(rot);
        const Rx = halfW*c - halfH*s, Ry = halfW*s + halfH*c;
        const targetAnchorX = resizing.anchorWorldX - (halfW - Rx);
        const targetAnchorY = resizing.anchorWorldY - (halfH - Ry);
        const shiftX = targetAnchorX - resizing.anchorX, shiftY = targetAnchorY - resizing.anchorY;
        for(const {idx} of resizing.snapshots) translateItem(items[idx], shiftX, shiftY);
      }
      resizing.moved = true;
      render();
      return;
    }

    if(drag && selection.length){
      const dx=x-drag.sx, dy=y-drag.sy;
      if(dx||dy){
        drag.moved = true;
        if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
      }
      for(const i of selection) translateItem(items[i], dx, dy);
      drag.sx=x; drag.sy=y;
      render();
      return;
    }

    if(marquee){
      marquee.x = x; marquee.y = y;
      render();
      return;
    }
    if(!current) return;

    if(current.type==='path'){
      const last = current.points[current.points.length-1];
      if(Math.hypot(x-last.x, y-last.y) >= 1.5) current.points.push({x,y});
    } else if(current.type==='line' || current.type==='arrow'){
      if(e.shiftKey){
        // constrain to 45° steps, keeping the cursor's distance from the start point (no snapping)
        const c = constrainAngle(current.x1, current.y1, x, y);
        current.x2 = c.x; current.y2 = c.y; snapPt = null;
      } else {
        snapPt = e.altKey ? null : nearestSnap(x,y);        // Alt = draw free, no magnet
        current.x2 = snapPt ? snapPt.x : x; current.y2 = snapPt ? snapPt.y : y;
      }
    } else if(current.type==='rect' || current.type==='ellipse'){
      let w = x-current._x0, h = y-current._y0;
      if(e.shiftKey){
        // square / circle — follow whichever axis the cursor has moved further along
        const s = Math.max(Math.abs(w), Math.abs(h));
        w = (w<0 ? -1 : 1) * s;
        h = (h<0 ? -1 : 1) * s;
      }
      current.x = Math.min(current._x0, current._x0+w);
      current.y = Math.min(current._y0, current._y0+h);
      current.w = Math.abs(w);
      current.h = Math.abs(h);
    } else if(current.type==='polygon'){
      current._hover = {x,y};
      updatePolyOverlay();
    }
    render();
  }

  function onUp(e){
    if(erasing){
      if(erasing.removed) commitHistory(); else historyBefore=null;
      erasing=null;
      return;
    }
    if(rotating){
      if(rotating.moved) commitHistory(); else historyBefore=null;
      rotating=null;
      return;
    }
    if(resizing){
      if(resizing.moved) commitHistory(); else historyBefore=null;
      resizing=null;
      return;
    }
    if(endDrag){
      if(!endDrag.moved){
        // plain click on an endpoint knob: toggle the arrowhead at that end
        const it = items[endDrag.idx], h = headsOf(it);
        if(endDrag.end===1) setHeads(it, !h.s, h.e); else setHeads(it, h.s, !h.e);
      }
      commitHistory();
      endDrag=null; snapPt=null;
      render();
      return;
    }
    if(drag){
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
      if(drag.moved) commitHistory(); else historyBefore=null;
      drag=null;
      return;
    }
    if(marquee){
      const r = marqueeRect();
      const sel = marquee.add ? selection.slice() : [];
      for(let i=0;i<items.length;i++){
        if(rectsIntersect(worldBBox(items[i]), r) && sel.indexOf(i)<0) sel.push(i);
      }
      selection = expandSelection(sel);
      marquee = null;
      render();
      return;
    }
    if(ui.tool==='polygon'){ return; }   // polygon finishes via click-to-close / Enter / the Finish button, not pointerup
    if(!current){ return; }

    let keep = true;
    if(current.type==='path'){
      keep = current.points.length>0;
    } else if(current.type==='line' || current.type==='arrow'){
      keep = Math.hypot(current.x2-current.x1, current.y2-current.y1) > 2;
    } else if(current.type==='rect' || current.type==='ellipse'){
      keep = current.w>2 && current.h>2;
      delete current._x0; delete current._y0;
    }

    snapPt = null;
    if(keep){ items.push(current); current=null; commitHistory(); }
    else { current=null; historyBefore=null; render(); }
  }

  // ---------- text tool ----------
  let textPos = null;
  let editingTextIdx = null;   // set while editing an existing text item (vs. creating a new one)
  function openText(x,y,editIdx=null){
    textPos = {x,y};
    editingTextIdx = editIdx;
    const existing = editIdx!=null ? items[editIdx] : null;
    textInput.style.display='block';
    textInput.style.left = x+'px';
    textInput.style.top  = y+'px';
    textInput.style.font = existing ? existing.font : fontStr(ui.fontFamily, ui.fontSize);
    textInput.style.color = existing ? existing.color : ui.color;
    textInput.value = existing ? existing.text : '';
    render();   // hide the original item behind the input while editing
    setTimeout(()=>{ textInput.focus(); textInput.select(); }, 0);
  }
  const FONTS = {
    sans:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
    serif:'Georgia,"Times New Roman",serif',
    mono:'ui-monospace,Menlo,Consolas,"Courier New",monospace',
    cursive:'"Comic Sans MS","Segoe Print","Bradley Hand",cursive'
  };
  function fontStr(family, size){ return '600 ' + size + 'px ' + (FONTS[family] || FONTS.sans); }

  // ---------- table tool: click to place, sized so a cell comfortably fits sample text at the current font size ----------
  function placeTable(x,y){
    ctx.save();
    ctx.font = fontStr(ui.fontFamily, ui.fontSize);
    const tw = ctx.measureText('hello world').width;
    ctx.restore();
    const colW = Math.max(60, Math.round(tw + 24));       // "hello world" plus side padding
    const rowH = Math.max(28, Math.round(ui.fontSize*1.5)); // current text size plus line padding
    const rows = ui.tableRows, cols = ui.tableCols;
    const w = colW*cols, h = rowH*rows;
    beginHistory();
    items.push({ type:'table', x:norm(x-w/2), y:norm(y-h/2), w:norm(w), h:norm(h), rows, cols, color:ui.color, size:ui.size, fill:ui.fill, fillColor:ui.fillColor });
    selection = [items.length-1];
    commitHistory();
    setTool('select');
    render();
    toast('Table added — drag a corner to resize');
  }
  function commitText(){
    const val = textInput.value.trim();
    textInput.style.display='none';
    if(editingTextIdx!=null){
      const idx = editingTextIdx;
      beginHistory();
      if(val){ items[idx].text = val; }
      else { items.splice(idx,1); selection = selection.filter(i=>i!==idx).map(i=>i>idx?i-1:i); }
      commitHistory();
    } else if(val && textPos){
      beginHistory();
      items.push({ type:'text', text:val, x:textPos.x, y:textPos.y, color:ui.color,
                   fontSize:ui.fontSize, font:fontStr(ui.fontFamily, ui.fontSize) });
      commitHistory();
    }
    textPos=null; editingTextIdx=null; render();
  }
  textInput.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commitText(); }
    else if(e.key==='Escape'){ textInput.style.display='none'; textPos=null; editingTextIdx=null; render(); }
    e.stopPropagation();
  });
  textInput.addEventListener('blur', commitText);

  // ---------- polygon tool: click to add vertices, close on the start point / Enter / the Finish button ----------
  // The in-progress preview is also drawn with real SVG elements (not just canvas): a stand-alone
  // tap-to-tap canvas draw can be slow to composite on some mobile browsers, so the SVG overlay
  // guarantees the draft always shows up immediately.
  function updatePolyOverlay(){
    if(!polyDraft || !polyDraft.points.length){ polyOverlay.innerHTML = ''; return; }
    const pts = polyDraft.points.map(p=>p.x+','+p.y);
    if(polyDraft._hover) pts.push(polyDraft._hover.x+','+polyDraft._hover.y);
    let closing = '';
    if(polyDraft._hover && polyDraft.points.length>=3){
      const first = polyDraft.points[0];
      if(Math.hypot(polyDraft._hover.x-first.x, polyDraft._hover.y-first.y)<=10){
        closing = '<line x1="'+polyDraft._hover.x+'" y1="'+polyDraft._hover.y+'" x2="'+first.x+'" y2="'+first.y+
                  '" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>';
      }
    }
    const dots = polyDraft.points.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="'+polyDraft.color+'"/>').join('');
    polyOverlay.innerHTML =
      '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+polyDraft.color+'" stroke-width="'+polyDraft.size+
      '" stroke-linejoin="round" stroke-linecap="round"/>' + closing + dots;
  }
  function handlePolygonClick(x,y){
    if(!polyDraft){
      beginHistory();
      polyDraft = { color:ui.color, size:ui.size, fill:ui.fill, fillColor:ui.fillColor, points:[{x,y}] };
      current = polyDraft;
      render(); updatePolyOverlay();
      return;
    }
    const first = polyDraft.points[0];
    if(polyDraft.points.length>=3 && Math.hypot(x-first.x,y-first.y)<=10){ finishPolygon(); return; }
    polyDraft.points.push({x,y});
    render(); updatePolyOverlay();
  }
  function finishPolygon(){
    if(!polyDraft) return;
    if(polyDraft.points.length<3){ toast('Add at least 3 points first'); return; }
    items.push({ type:'polygon', color:polyDraft.color, size:polyDraft.size, fill:polyDraft.fill,
                 fillColor:polyDraft.fillColor, points:polyDraft.points.map(p=>({x:p.x,y:p.y})) });
    polyDraft = null; current = null;
    commitHistory();
    render(); updatePolyOverlay();
  }
  function cancelPolygon(){
    polyDraft = null; current = null;
    historyBefore = null;
    render(); updatePolyOverlay();
  }
  function updatePolyButtons(){
    const active = ui.tool==='polygon' && !!polyDraft;
    const disp = active ? '' : 'none';
    if(polyGroup.style.display !== disp){ polyGroup.style.display = disp; polySep.style.display = disp; }
    if(active) polyFinishBtn.disabled = polyDraft.points.length < 3;
  }
  polyFinishBtn.addEventListener('click', finishPolygon);
  polyCancelBtn.addEventListener('click', cancelPolygon);

  // ---------- images (insert / paste / drop) ----------
  function importImage(srcURL, place){
    const probe = new Image();
    probe.onload = ()=>{
      const maxDim = 1800;                       // cap stored resolution to keep storage sane
      let nw = probe.naturalWidth, nh = probe.naturalHeight, src = srcURL;
      if(Math.max(nw,nh) > maxDim){
        const s = maxDim/Math.max(nw,nh);
        const oc = document.createElement('canvas');
        oc.width = Math.round(nw*s); oc.height = Math.round(nh*s);
        oc.getContext('2d').drawImage(probe, 0, 0, oc.width, oc.height);
        src = oc.toDataURL('image/png');
        nw = oc.width; nh = oc.height;
      }
      const fit = Math.min(1, (cssW*0.7)/nw, (cssH*0.7)/nh);   // fit nicely on the canvas
      const w = nw*fit, h = nh*fit;
      const x = place ? place.x - w/2 : (cssW - w)/2;
      const y = place ? place.y - h/2 : (cssH - h)/2;
      const id = 'img-' + Date.now() + '-' + (assetSeq++);
      assets[id] = src;
      beginHistory();
      items.push({ type:'image', id, x:norm(x), y:norm(y), w:norm(w), h:norm(h) });
      selection = [items.length-1];
      commitHistory();
      setTool('select');
      render();
      toast('Image added — drag to move, corner to resize');
    };
    probe.onerror = ()=>toast('Could not load that image');
    probe.src = srcURL;
  }
  function readFile(file, place){
    if(!file || file.type.indexOf('image')!==0){ toast('That file is not an image'); return; }
    const r = new FileReader();
    r.onload = ()=>importImage(r.result, place);
    r.onerror = ()=>toast('Could not read that file');
    r.readAsDataURL(file);
  }

  // ---------- undo / redo / clear ----------
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snap());
    items = JSON.parse(undoStack.pop());
    selection=[]; current=null;
    save(); render(); updateButtons();
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snap());
    items = JSON.parse(redoStack.pop());
    selection=[]; current=null;
    save(); render(); updateButtons();
  }
  function clearAll(){
    if(!items.length) return;
    if(!confirm('Erase everything on the canvas?')) return;
    beginHistory();
    items = []; selection=[]; current=null;
    commitHistory(); render();
    toast('Canvas cleared');
  }
  function deleteSelected(){
    if(ui.tool!=='select' || !selection.length) return;
    beginHistory();
    for(const i of selection.slice().sort((a,b)=>b-a)) items.splice(i,1);  // high→low so indices stay valid
    selection = [];
    commitHistory(); render();
  }
  // Pull the selected items out (keeping their relative order) and re-insert them
  // at the top (end of array) or bottom (start). `toEnd` true = bring to front.
  function reorderSelection(toEnd){
    if(ui.tool!=='select' || !selection.length) return;
    beginHistory();
    const asc = selection.slice().sort((a,b)=>a-b);
    const moved = asc.map(i=>items[i]);
    for(const i of asc.slice().reverse()) items.splice(i,1);   // remove high→low
    if(toEnd){ items.push(...moved); selection = moved.map((_,k)=>items.length-moved.length+k); }
    else     { items.unshift(...moved); selection = moved.map((_,k)=>k); }
    commitHistory(); render();
  }
  const bringToFront = ()=>reorderSelection(true);
  const sendToBack   = ()=>reorderSelection(false);

  // duplicate / copy / paste (images keep their asset id, so the bitmap is shared)
  function addClones(list, off){
    beginHistory();
    const gmap = {};                       // remap each source group to a fresh one
    const newSel = [];
    for(const it of list){
      const copy = clone(it);
      translateItem(copy, off, off);
      if(copy.group!=null){
        if(!gmap[copy.group]) gmap[copy.group] = 'g-' + Date.now() + '-' + (groupSeq++);
        copy.group = gmap[copy.group];
      }
      items.push(copy);
      newSel.push(items.length-1);
    }
    if(ui.tool!=='select') setTool('select');
    selection = newSel;
    commitHistory(); render();
  }
  function groupSelection(){
    if(ui.tool!=='select' || selection.length<2) return;
    beginHistory();
    const sel = expandSelection(selection);
    const g = 'g-' + Date.now() + '-' + (groupSeq++);
    for(const i of sel){ items[i].group = g; items[i].groupRotation = 0; }
    selection = sel;
    commitHistory(); render();
    toast('Grouped');
  }
  function ungroupSelection(){
    if(ui.tool!=='select' || !selection.length) return;
    const sel = expandSelection(selection);
    if(!sel.some(i=>items[i].group!=null)) return;
    beginHistory();
    // snapshot every distinct group's pivot BEFORE touching any member — baking one member
    // would otherwise shift the pivot for the rest of that same group
    const pivots = {};
    for(const i of sel){
      const g = items[i].group;
      if(g!=null && !(g in pivots)) pivots[g] = groupPivot(g);
    }
    for(const i of sel){
      const it = items[i];
      if(it.group!=null && it.groupRotation){
        const piv = pivots[it.group];
        const b = worldBBoxOwn(it);
        const ownCx = b.x+b.w/2, ownCy = b.y+b.h/2;
        const target = rotatePoint(ownCx, ownCy, piv.cx, piv.cy, it.groupRotation);
        translateItem(it, target.x-ownCx, target.y-ownCy);
        it.rotation = (it.rotation||0) + it.groupRotation;
      }
      delete it.group;
      delete it.groupRotation;
    }
    selection = sel;
    commitHistory(); render();
    toast('Ungrouped');
  }
  function duplicateSelection(){
    if(ui.tool!=='select' || !selection.length) return;
    addClones(selection.slice().sort((a,b)=>a-b).map(i=>items[i]), 16);
  }
  function copySelection(){
    if(ui.tool!=='select' || !selection.length) return;
    clipboard = selection.slice().sort((a,b)=>a-b).map(i=>clone(items[i]));
    toast(clipboard.length + (clipboard.length===1?' item copied':' items copied'));
  }
  function pasteClipboard(){
    if(!clipboard.length) return false;
    addClones(clipboard, 16);
    return true;
  }

  function updateButtons(){
    document.getElementById('undo').disabled = undoStack.length===0;
    document.getElementById('redo').disabled = redoStack.length===0;
  }
  function updateOrderButtons(){
    const active = ui.tool==='select' && selection.length>0;
    const disp = active ? '' : 'none';
    if(arrangeGroup.style.display !== disp){ arrangeGroup.style.display = disp; arrangeSep.style.display = disp; }
    if(!active) return;
    toDupBtn.disabled = toFrontBtn.disabled = toBackBtn.disabled = delSelBtn.disabled = false;
    groupBtn.disabled = selection.length<2;
    ungroupBtn.disabled = !selection.some(i=>items[i] && items[i].group!=null);
  }

  // ---------- export ----------
  function savePng(){

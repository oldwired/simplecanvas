  // reflects the current line style even when nothing is selected yet (mirrors setSizeVal)
  function setDashVal(kind){
    dashPicker.querySelectorAll('.dash-btn').forEach(b=>b.classList.toggle('active', b.dataset.dash===(kind||'solid')));
    // the little preview line under the size button — a small representative pattern, not tied to
    // the actual stroke width (this bar is a fixed 20-unit decoration, not a rendered line)
    if(kind==='tight') sizeBtnLineEl.setAttribute('stroke-dasharray', '2,1.33');
    else if(kind==='wide') sizeBtnLineEl.setAttribute('stroke-dasharray', '4,2.67');
    else sizeBtnLineEl.removeAttribute('stroke-dasharray');
  }
  function applyDash(kind){
    const val = kind==='solid' ? undefined : kind;
    const sel = colorableSelection().filter(it=>DASHABLE(it.type));
    if(sel.length){
      beginHistory();
      for(const it of sel){ if(val) it.dash = val; else delete it.dash; }
      commitHistory(); render();
    } else {
      const st = drawStyle();
      if(val) st.dash = val; else delete st.dash;
    }
    setDashVal(kind);
  }
  dashPicker.querySelectorAll('.dash-btn').forEach(b=>b.addEventListener('click', ()=>applyDash(b.dataset.dash)));
  // show a size in the dropdown even when it isn't one of the presets (e.g. after a corner-resize)
  function setFontSizeSel(px){
    if(![...fontSizeSel.options].some(o=>+o.value===px)){
      const o = document.createElement('option'); o.value = px; o.textContent = px; o.dataset.temp = '1';
      const after = [...fontSizeSel.options].find(x=>+x.value>px);
      fontSizeSel.insertBefore(o, after || null);
    }
    fontSizeSel.value = px;
    [...fontSizeSel.options].forEach(o=>{ if(o.dataset.temp && +o.value!==px) o.remove(); });
  }
  // font controls edit the selected text items, or the defaults for the next one
  function applyFont(fn){
    const texts = colorableSelection().filter(it=>it.type==='text');
    if(!texts.length){ fn(ui); return; }
    beginHistory();
    for(const it of texts){
      it.fontFamily = familyOf(it); it.fontSize = fontPxOf(it);   // sync from the font string first (a resize only rewrites that)
      fn(it);
      it.font = fontStr(it.fontFamily, it.fontSize);
    }
    commitHistory(); render();
  }
  fontFamilySel.addEventListener('change', e=>applyFont(o=>{ o.fontFamily = e.target.value; }));
  fontSizeSel.addEventListener('change', e=>applyFont(o=>{ o.fontSize = +e.target.value; }));

  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  toDupBtn.addEventListener('click', duplicateSelection);
  groupBtn.addEventListener('click', groupSelection);
  ungroupBtn.addEventListener('click', ungroupSelection);
  toFrontBtn.addEventListener('click', bringToFront);
  toBackBtn.addEventListener('click', sendToBack);
  delSelBtn.addEventListener('click', deleteSelected);
  // hamburger menu (file & canvas actions)
  const projectInput = document.getElementById('projectInput');
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  const MENU_ACTIONS = {
    save: exportProject,
    open: ()=>projectInput.click(),
    saveShape: saveSelectionAsShape,
    loadShapeLibrary: loadShapeLibraryCommand,
    png: savePng,
    svg: saveSvg,
    print: ()=>window.print(),
    clear: clearAll,
  };
  function menuItems(){ return [...menu.querySelectorAll('button[data-act]')]; }
  function setMenu(open){
    menu.hidden = !open;
    menuBtn.classList.toggle('active', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) menuItems()[0].focus();
  }
  menuBtn.addEventListener('click', e=>{ e.stopPropagation(); setMenu(menu.hidden); });
  menuBtn.addEventListener('keydown', e=>{
    if((e.key==='ArrowDown' || e.key==='ArrowUp') && menu.hidden){ e.preventDefault(); setMenu(true); }
  });
  menu.addEventListener('keydown', e=>{
    const els = menuItems();
    const i = els.indexOf(document.activeElement);
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      els[(i + (e.key==='ArrowDown' ? 1 : -1) + els.length) % els.length].focus();
    } else if(e.key==='Home'){ e.preventDefault(); els[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); els[els.length-1].focus(); }
    else if(e.key==='Escape'){ setMenu(false); menuBtn.focus(); }
    else if(e.key==='Tab'){ setMenu(false); }
    e.stopPropagation();          // don't trigger canvas shortcuts while the menu is open
  });
  menu.addEventListener('click', e=>{
    const b = e.target.closest('button[data-act]'); if(!b) return;
    setMenu(false);
    menuBtn.focus();
    const fn = MENU_ACTIONS[b.dataset.act]; if(fn) fn();
  });
  document.addEventListener('click', e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==menuBtn) setMenu(false); });
  projectInput.addEventListener('change', e=>{ if(e.target.files[0]) importProject(e.target.files[0]); e.target.value=''; });

  // image insert / paste / drop
  const fileInput = document.getElementById('fileInput');
  document.getElementById('insertImg').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=''; });

  window.addEventListener('paste', e=>{
    if(textInput.style.display==='block') return;     // let the text editor handle pastes
    const list = e.clipboardData && e.clipboardData.items;
    if(list){
      for(const it of list){
        if(it.type && it.type.indexOf('image')===0){
          const f = it.getAsFile();
          if(f){ e.preventDefault(); readFile(f); return; }   // a real image on the clipboard wins
        }
      }
    }
    if(clipboard.length){ e.preventDefault(); pasteClipboard(); }  // otherwise paste copied canvas items
  });

  ['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev, e=>{
    e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
  }));
  wrap.addEventListener('drop', e=>{
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    const r = canvas.getBoundingClientRect();
    const place = { x:e.clientX-r.left, y:e.clientY-r.top };
    for(const f of files){ if(f.type.indexOf('image')===0){ readFile(f, place); break; } }
  });

  // ---------- keyboard ----------
  const TOOL_KEYS = {v:'select',p:'pen',m:'marker',b:'brush',e:'eraser',l:'line',a:'arrow',r:'rect',o:'ellipse',g:'polygon',t:'text',y:'table'};
  // Shortcuts belong to the canvas. A focused text field keeps every key; any other focused control
  // (the size slider, a font select, a color input — they keep focus after use) keeps only the keys it
  // actually consumes, so Undo, Delete, Escape and the tool letters keep working without a click on the canvas.
  const isTextTarget = el => !!el && (el.tagName==='TEXTAREA' || el.isContentEditable ||
    (el.tagName==='INPUT' && !/^(range|checkbox|radio|color|button|submit|file)$/i.test(el.type)));
  const isControlTarget = el => !!el && (el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='BUTTON');
  const CONTROL_KEYS = /^(ArrowLeft|ArrowRight|ArrowUp|ArrowDown|Home|End|PageUp|PageDown|Enter|Tab| )$/;
  window.addEventListener('keydown', e=>{
    if(textInput.style.display==='block' || isTextTarget(e.target)) return;
    if(isControlTarget(e.target) && !e.metaKey && !e.ctrlKey && CONTROL_KEYS.test(e.key)) return;
    if(e.key==='Escape'){
      if(ui.tool==='polygon' && polyDraft){ cancelPolygon(); return; }
      if(current){ current=null; snapPt=null; snapCursorPt=null; historyBefore=null; render(); return; }   // cancel an in-progress draw, before the button is even lifted
      if(pointEditIdx!=null){   // one Escape drops the active handles, a second leaves point-edit mode
        if(activeAnchor!=null){ activeAnchor=null; render(); return; }
        pointEditIdx=null; render(); return;
      }
      if(!menu.hidden){ setMenu(false); return; }
      if(!tablePicker.hidden){ setTablePicker(false); return; }
      if(!shapePicker.hidden){ setShapePicker(false); return; }
      if(selection.length){ selection=[]; render(); }      // Esc also deselects
      return;
    }
    if(e.key==='Enter' && ui.tool==='polygon' && polyDraft){ e.preventDefault(); finishPolygon(); return; }
    const mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(mod && e.key.toLowerCase()==='c'){ copySelection(); return; }            // paste is handled by the paste event
    if(mod && e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSelection(); return; }
    if(mod && e.key.toLowerCase()==='g'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); return; }
    if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); exportProject(); return; }
    if(mod && e.key.toLowerCase()==='o'){ e.preventDefault(); projectInput.click(); return; }
    if(mod) return;
    if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelected(); return; }
    if(e.key===']'){ bringToFront(); return; }
    if(e.key==='['){ sendToBack(); return; }
    // nudge the selection with the arrow keys — 1px, or 10px with Shift. A held-down key auto-repeats
    // (e.repeat) into many keydowns; those all fold into the one undo step opened by the first press.
    if((e.key==='ArrowLeft' || e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='ArrowDown') && ui.tool==='select' && selection.length){
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key==='ArrowLeft' ? -step : e.key==='ArrowRight' ? step : 0;
      const dy = e.key==='ArrowUp' ? -step : e.key==='ArrowDown' ? step : 0;
      if(!nudging || historyBefore===null){ beginHistory(); nudging = true; }   // (a lost keyup must not leave the next nudge outside history)
      for(const i of selection) translateItem(items[i], dx, dy);
      render();
      return;
    }
    // rotate the selected item — or whole group — by 15° with , / .
    if((e.key===',' || e.key==='.') && ui.tool==='select' && selection.length){
      const piv = rotationPivotFor(selection);
      if(piv){
        e.preventDefault();
        beginHistory();
        const delta = (Math.PI/12) * (e.key==='.' ? 1 : -1);
        const field = piv.isGroup ? 'groupRotation' : 'rotation';
        for(const idx of piv.members) items[idx][field] = (items[idx][field]||0) + delta;
        commitHistory(); render();
        return;
      }
    }
    const t = TOOL_KEYS[e.key.toLowerCase()];
    if(t==='table'){ activateTableTool(); }
    else if(t){ setTool(t); }
  });
  window.addEventListener('keyup', e=>{
    if(!nudging) return;   // only close the step a nudge opened — never someone else's pending transaction
    if(e.key==='ArrowLeft' || e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='ArrowDown'){ nudging = false; commitHistory(); }
  });
  // Cmd+Tab / a file dialog while an arrow key is down: the keyup never arrives, so close the step here
  window.addEventListener('blur', ()=>{ if(nudging){ nudging = false; commitHistory(); } });

  // iOS Safari does not turn two taps into a dblclick, so recognise a double tap ourselves (two lifts
  // within 300ms and 25px, touch or pen) and hand it to the very same handler the mouse uses
  let lastTap = null;
  function onTapUp(e){   // registered after onUp, so the second tap's own vertex/selection has landed first
    if(e.pointerType==='mouse') return;
    const now = performance.now();
    if(lastTap && now-lastTap.t < 300 && Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 25){
      lastTap = null;
      onDoubleClick(e);
    } else lastTap = { t:now, x:e.clientX, y:e.clientY };
  }
  canvas.addEventListener('dblclick', onDoubleClick);
  function onDoubleClick(e){
    if(alignClickTimer){ clearTimeout(alignClickTimer); alignClickTimer=null; }
    if(ui.tool==='polygon' && polyDraft){
      // a draft that already existed before this gesture always has >=3 points here (1+ pre-existing,
      // plus the 2 this dblclick's/double-tap's own clicks added) — exactly 2 means both clicks
      // started the draft from nothing, i.e. a dblclick/double-tap on empty canvas with no polygon
      // underway, which reads as "switch tools", not "draw a 2-point sliver and get stuck"
      if(polyDraft.points.length===2){
        cancelPolygon();
        const {x,y} = pos(e);
        if(hitTest(x,y)<0) setTool('select');
        return;
      }
      // Both halves of the double click/tap already added a vertex of their own (via onDown) — neither
      // was a deliberate corner, just the click/tap that says "close it", so both go, closing from
      // whatever corner was already placed before this gesture — unless that would leave too few
      // corners, in which case one of them did mean a corner after all.
      const pts = polyDraft.points;
      if(pts.length>3) pts.pop();
      if(pts.length>3) pts.pop();
      finishPolygon();
      return;
    }
    if(ui.tool!=='select'){
      // dblclick on empty canvas while on any other tool → back to select, nothing under the cursor to act on
      const {x,y} = pos(e);
      if(ui.tool==='pen' || ui.tool==='marker' || ui.tool==='brush'){
        // pen/marker/brush already placed a dot for each of this dblclick's two clicks (via onDown/onUp).
        // A dblclick here means "switch tools", not "draw two dots" — drop them (and the undo entry each
        // one's onUp already committed) before testing whether anything else was already at this spot.
        let cut = items.length;
        while(items.length-cut<2 && cut>0 && items[cut-1].type==='path' && items[cut-1].mode===ui.tool && items[cut-1].points.length===1) cut--;
        const removed = items.length-cut;
        if(removed){
          items.length = cut;
          undoStack.length = Math.max(0, undoStack.length-removed);
          save(); updateButtons();
        }
        if(hitTest(x,y)<0) setTool('select'); else render();
        return;
      }
      if(hitTest(x,y)<0) setTool('select');
      return;
    }
    const {x,y} = pos(e);
    const hit = hitTest(x,y);
    if(hit>=0 && items[hit].type==='text'){
      openText(hit);
      return;
    }
    if(hit>=0 && items[hit].type==='table'){
      const lp = toLocal(items[hit], x, y);
      const cell = tableCellAt(items[hit], lp.x, lp.y);
      if(cell) openText(hit, null, null, cell);
      return;
    }
    if(pointEditIdx!=null && hit===pointEditIdx){   // re-double-click on the item being edited: exit
      pointEditIdx = null; activeAnchor = null; render(); return;
    }
    if(hit>=0 && selection.length===1 && hit===selection[0] &&
       items[hit].group==null && CONVERTIBLE_TYPES.has(items[hit].type)){
      beginHistory();
      convertToCurve(hit);
      commitHistory();
      pointEditIdx = hit; activeAnchor = null;
      render();
      return;
    }
    if(selection.length){
      const piv = rotationPivotFor(selection);
      if(piv && piv.rotation){
        const lp = rotatePoint(x,y,piv.cx,piv.cy,-piv.rotation);
        if(Math.hypot(lp.x-piv.handleX, lp.y-piv.handleY) <= 11){
          beginHistory();
          const field = piv.isGroup ? 'groupRotation' : 'rotation';
          for(const idx of piv.members) items[idx][field] = 0;
          commitHistory(); render();
        }
      }
    }
  }

  // ---------- pointer listeners ----------
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointerup', onTapUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', ()=>{ if(cursorPt){ cursorPt=null; render(); } });
  canvas.addEventListener('contextmenu', e=>{
    if(ui.tool!=='select') e.preventDefault();
    if(ui.tool==='polygon' && polyDraft) finishPolygon();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('beforeunload', save);

  // When the toolbar wraps, a separator can end up first or last on a row, divorcing nothing from
  // nothing. Hide those. Walk in DOM order twice: hiding one can pull the next item up a row.
  const toolbarEl = document.querySelector('.toolbar');
  function tidySeps(){
    const seps = toolbarEl.querySelectorAll('.sep');
    const shown = el => el && el.offsetParent !== null;
    const rowOf = el => { const r = el.getBoundingClientRect(); return Math.round((r.top + r.bottom)/2); };
    for(let pass=0; pass<2; pass++){
      seps.forEach(s=>{
        s.classList.remove('row-edge');
        if(s.style.display==='none') return;
        let p = s.previousElementSibling; while(p && !shown(p)) p = p.previousElementSibling;
        let n = s.nextElementSibling;     while(n && !shown(n)) n = n.nextElementSibling;
        if(!p || !n || Math.abs(rowOf(p)-rowOf(n)) > 10) s.classList.add('row-edge');
      });
    }
  }
  window.addEventListener('resize', tidySeps);
  new MutationObserver(tidySeps).observe(toolbarEl, {attributes:true, subtree:true, attributeFilter:['style']});
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });

  // ---------- boot ----------
  // show the platform's own modifier in shortcut hints (⌘ on Mac, Ctrl elsewhere)
  const isMac = /Mac|iPhone|iPad/i.test(navigator.platform || '');
  const modKey = isMac ? '⌘' : 'Ctrl';
  document.querySelectorAll('[title]').forEach(el=>{
    if(el.title.indexOf('⌘/Ctrl')>=0) el.title = el.title.split('⌘/Ctrl').join(modKey);
  });
  document.querySelectorAll('.menu .sc').forEach(el=>{
    el.textContent = el.textContent.replace('⌘', isMac ? '⌘' : 'Ctrl+');
  });
  const hintKbd = hint.querySelector('kbd');
  if(hintKbd) hintKbd.textContent = modKey;
  // icons are decorative; the buttons' titles carry the meaning
  document.querySelectorAll('.toolbar svg').forEach(s=>s.setAttribute('aria-hidden','true'));

  load();
  setTool(items.length ? 'select' : 'pen');
  refreshColorUI();
  resize();
  updateButtons();
  tidySeps();

  // Silently check for an existing shape library on startup — reveals the tool if one is found,
  // otherwise it stays hidden until the user loads one via "Load Shape Library…".
  fetchShapeLibrary().then(lib=>{ shapeLibraryCache = lib; revealShapeTool(); }).catch(()=>{});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SimpleCanvas — Quick Sketches</title>
<style>
  :root{
    --bg:#eef0f4;
    --panel:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#6366f1;
    --accent-soft:#eef2ff;
    --danger:#ef4444;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 3px;              /* horizontal gap matches .group so every separator sits evenly from its neighbours */
    padding:8px 6px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
    z-index:10;
  }

  .group{display:flex;align-items:center;gap:3px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 1px}
  #arrangeSep{margin-left:9px}
  .sep.row-edge{display:none}   /* set by tidySeps(): a separator with nothing beside it on its row */

  .btn{
    -webkit-appearance:none;appearance:none;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:38px;min-width:38px;padding:0 7px;
    border:1px solid transparent;border-radius:10px;
    background:transparent;color:var(--ink);
    font-size:13px;font-weight:550;cursor:pointer;
    transition:background .12s ease,border-color .12s ease,color .12s ease,transform .05s ease;
  }
  .btn svg{width:24px;height:24px;display:block}
  #sizeBtn{flex-direction:column;gap:3px;padding:3px 9px}
  #sizeBtn .size-btn-line{display:block;width:20px;height:4px;color:#1f2937;flex:0 0 auto}
  .btn:hover{background:#f3f4f6}
  .btn:active{transform:translateY(1px)}
  .btn.active{background:var(--accent-soft);color:var(--accent);border-color:#c7cdfb}
  .btn.ghost{color:var(--muted)}
  .btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
  .btn.danger:hover{background:#fef2f2;color:var(--danger)}

  /* keyboard focus (mouse clicks don't show a ring) */
  .btn:focus-visible,.select:focus-visible,input[type=range]:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }

  /* hamburger dropdown */
  .menu-wrap{position:relative}
  .menu{
    position:absolute;top:calc(100% + 8px);left:0;z-index:30;
    min-width:210px;padding:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:1px;
  }
  .menu[hidden]{display:none}
  .menu button{
    display:flex;align-items:center;gap:9px;
    width:100%;padding:8px 9px;border:none;border-radius:8px;
    background:transparent;color:var(--ink);font:inherit;font-size:13.5px;font-weight:550;
    text-align:left;cursor:pointer;white-space:nowrap;
  }
  .menu button:hover{background:#f3f4f6}
  .menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .menu button svg{width:22px;height:22px;flex:0 0 auto;color:var(--muted)}
  .menu button .sc{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
  .menu button.danger{color:var(--danger)}
  .menu button.danger:hover{background:#fef2f2}
  .menu button.danger svg{color:var(--danger)}
  .menu-sep{height:1px;background:var(--line);margin:5px 4px}

  /* table size picker */
  .table-picker{min-width:0;padding:10px;flex-direction:column;align-items:center}
  .table-grid{display:grid;grid-template-columns:repeat(10,16px);grid-auto-rows:16px;gap:3px;touch-action:none}
  .table-grid .cell{width:16px;height:16px;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer}
  .table-grid .cell.hi{background:var(--accent-soft);border-color:var(--accent)}
  .table-picker-label{margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}

  /* shape library popover */
  .shape-picker{min-width:0;max-width:264px;max-height:320px;overflow:auto;padding:10px;flex-direction:column;align-items:stretch}
  .shape-grid{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:6px}
  .shape-grid button{width:64px;height:64px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;cursor:pointer}
  .shape-grid button svg{width:100%;height:100%;display:block}
  .shape-picker-empty{font-size:12px;color:var(--muted);padding:2px}

  /* stroke/fill color popovers: swatches only, no text — keeps the toolbar compact */
  .color-picker{min-width:0;padding:8px;flex-direction:row;flex-wrap:wrap;width:132px;gap:6px}
  .color-picker .cswatch{
    width:22px;height:22px;border-radius:6px;flex:0 0 auto;cursor:pointer;
    border:1px solid rgba(0,0,0,.12);padding:0;
  }
  .color-picker .cswatch.active{box-shadow:0 0 0 2px var(--accent)}
  .color-picker .cswatch.none{
    background:#fff;
    background-image:linear-gradient(to top right, transparent calc(50% - 1px), var(--danger), transparent calc(50% + 1px));
  }
  #fillNoneSwatch.cswatch.none, #strokeNoneSwatch.cswatch.none{
    background:#fff;background-image:none;
    display:flex;align-items:center;justify-content:center;
  }
  #fillNoneSwatch svg, #strokeNoneSwatch svg{width:16px;height:16px}
  /* custom color: a rainbow tile with the browser's own color input laid invisibly over it */
  .color-picker .cswatch.custom{
    position:relative;overflow:hidden;display:block;
    background:conic-gradient(#ef4444,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ef4444);
  }
  /* custom color panel: shade square + hue strip + hex field, drawn by us — the browser's own
     color input does not open reliably on iOS Safari */
  .cpanel{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:8px;margin-top:2px;border-top:1px solid var(--line)}
  .cpanel[hidden]{display:none}
  .cpanel-sv{
    position:relative;height:96px;border-radius:6px;touch-action:none;cursor:crosshair;
    background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent);
  }
  .cpanel-dot{
    position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;
    box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none;
  }
  .cpanel-hue{
    position:relative;height:14px;border-radius:7px;touch-action:none;cursor:pointer;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  }
  .cpanel-mark{
    position:absolute;top:-2px;width:6px;height:18px;border:2px solid #fff;border-radius:3px;
    box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translateX(-50%);pointer-events:none;
  }
  .cpanel-hex{
    width:100%;box-sizing:border-box;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;
    padding:4px 6px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;
  }

  /* stroke-width popover: a real vertical slider (rotated horizontal input), continuous 1–60px —
     doesn't fit the toolbar's own row height, so it lives in a popover like the color pickers */
  .size-picker{min-width:0;padding:12px 10px;flex-direction:column;align-items:center;gap:8px}
  .vslider-wrap{width:42px;height:240px;position:relative}
  .vslider{
    -webkit-appearance:none;appearance:none;
    position:absolute;top:50%;left:50%;
    width:240px;height:22px;margin:0;
    transform:translate(-50%,-50%) rotate(90deg);
    background:transparent;cursor:pointer;
  }
  .vslider::-webkit-slider-runnable-track{width:240px;height:6px;border-radius:3px;background:var(--line)}
  .vslider::-moz-range-track{width:240px;height:6px;border-radius:3px;background:var(--line);border:none}
  .vslider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-8px;cursor:pointer}
  .vslider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
  .size-picker-label{font-size:12px;color:var(--muted);font-weight:600;min-width:40px;text-align:center}
  .dash-picker{display:flex;flex-direction:column;gap:4px;width:100%;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .dash-btn{
    -webkit-appearance:none;appearance:none;
    width:100%;height:24px;padding:0 6px;border:1px solid transparent;border-radius:7px;
    background:transparent;color:var(--ink);cursor:pointer;
  }
  .dash-btn svg{width:100%;height:6px;display:block}
  .dash-btn:hover{background:#f3f4f6}
  .dash-btn.active{background:var(--accent-soft);color:var(--accent);border-color:#c7cdfb}

  .select{
    height:38px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:550;
    padding:0 8px;cursor:pointer;
  }
  .select:focus-visible{border-color:var(--accent)}


  /* ---------- Canvas ---------- */
  .stage{
    flex:1 1 auto;position:relative;min-height:0;
    padding:16px;
    display:flex;
  }
  .wrap{
    position:relative;flex:1;border-radius:14px;overflow:hidden;
    background:#fff;box-shadow:var(--shadow);
    background-image:
      linear-gradient(#f4f5f8 1px,transparent 1px),
      linear-gradient(90deg,#f4f5f8 1px,transparent 1px);
    background-size:26px 26px;
  }
  canvas{display:block;position:absolute;inset:0;cursor:crosshair}
  canvas.tool-select{cursor:default}
  canvas.tool-text{cursor:text}
  canvas.tool-eraser{cursor:none}

  /* floating text editor */
  #textInput{
    position:absolute;z-index:5;display:none;
    border:1px dashed var(--accent);outline:none;
    background:rgba(255,255,255,.65);
    font-family:inherit;padding:0 4px;border-radius:4px;
    color:var(--ink);min-width:40px;
    appearance:none;-webkit-appearance:none;
  }

  .hint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;color:#9ca3af;pointer-events:none;
    font-size:15px;line-height:1.7;
  }
  .hint kbd{
    font-family:ui-monospace,monospace;font-size:12px;
    background:#fff;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;color:var(--muted);
  }

  /* tiny toast */
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:#111827;color:#fff;padding:9px 16px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s ease;z-index:50;
    box-shadow:var(--shadow);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media print{
    body{background:#fff}
    .toolbar,.hint,#toast{display:none !important}
    .stage{padding:0}
    .wrap{box-shadow:none;border-radius:0;background:#fff}
  }
</style>
</head>
<body>

<header class="toolbar">
  <input type="file" id="projectInput" accept="application/json,.json" style="display:none">
  <div class="menu-wrap">
    <button class="btn" id="menuBtn" title="File &amp; canvas actions" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button data-act="save" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 3v5h6V3M7 21v-6h10v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Save sketch… <span class="sc">⌘S</span>
      </button>
      <button data-act="open" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1H3V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 10h18l-2 8a1 1 0 0 1-1 .8H6a1 1 0 0 1-1-.8L3 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Open sketch… <span class="sc">⌘O</span>
      </button>
      <button data-act="saveShape" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 4v6l2-1.5L12 10V4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Save as Shape…
      </button>
      <button data-act="loadShapeLibrary" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2.23 3.07C2.23 2.48 3.7 2 5.51 2 7.32 2 8.79 2.48 8.79 3.07L8.79 9.36C8.79 9.95 7.32 10.43 5.51 10.43 3.7 10.43 2.23 9.95 2.23 9.36Z" stroke="currentColor" stroke-width="1.2"/><path d="M8.79 3.07C8.79 3.66 7.32 4.14 5.51 4.14 3.7 4.14 2.23 3.66 2.23 3.07" stroke="currentColor" stroke-width="1.2"/><path d="M2.23 21.01 2.23 16.29 5.16 13 8.09 16.29 8.09 21.01Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.73 15.98 15.1 15.98 15.1 13.61 17.77 13.61 17.77 15.98 20.13 15.98 20.13 18.64 17.77 18.64 17.77 21.01 15.1 21.01 15.1 18.64 12.73 18.64Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.73 9.9 15.49 2 20.89 2 18.13 9.9Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Load Shape Library…
      </button>
      <div class="menu-sep" role="separator"></div>
      <button data-act="png" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export PNG
      </button>
      <button data-act="svg" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17c2-9 5-9 8 0s6 9 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4" cy="17" r="1.6" fill="currentColor"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/><circle cx="20" cy="17" r="1.6" fill="currentColor"/></svg>
        Export SVG
      </button>
      <button data-act="print" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9V3h12v6M6 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1M6 14h12v7H6v-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Print
      </button>
      <div class="menu-sep" role="separator"></div>
      <button data-act="clear" class="danger" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Clear canvas
      </button>
    </div>
  </div>

  <!-- Actions, select & tools — separate groups so a narrow toolbar wraps between them, never inside -->
  <div class="group">
    <button class="btn ghost" id="undo" title="Undo (⌘/Ctrl+Z)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn ghost" id="redo" title="Redo (⌘/Ctrl+Shift+Z)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="select" title="Select / move — drag a box to select several (V)">
      <svg viewBox="0 -1.5 24 24" fill="none"><path d="m5 3 14 7-6 2-2 6L5 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 2.5 24 24" fill="none"><path d="M4 18 15 7l3 3L7 21l-4 1 1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m14 8 2 2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="marker" title="Highlighter (M)">
      <svg viewBox="0 0 24 24" fill="none"><path d="m9 17-4 1 1-4L16 3l3 3L9 17Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="brush" title="Felt-tip (B)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M14 4 8 10c-2 2-2 4-3 6 2-1 4-1 6-3l6-6-3-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 16c-2 1-2 4-2 4s3 0 4-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="eraser" title="Eraser (E)">
      <svg viewBox="0 0 24 24" fill="none"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M22 21H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m5 11 9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" data-tool="line" title="Line (L)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="btn" data-tool="arrow" title="Arrow (A)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M19 5h-6M19 5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn" data-tool="rect" title="Rectangle (R)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="ellipse" title="Ellipse (O)">
      <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="8" ry="6" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="btn" data-tool="polygon" title="Polygon — click each corner, then finish by tapping the start point, double-clicking, right-clicking, pressing Enter, or tapping Finish (G)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 21 9.5 17.8 20H6.2L3 9.5 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <div class="menu-wrap" id="shapeLibWrap" style="display:none">
      <button class="btn" data-tool="shape" id="shapeLibBtn" title="Shape library — pick a saved shape, then click to place" aria-haspopup="true" aria-expanded="false" aria-controls="shapePicker">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2.23 3.07C2.23 2.48 3.7 2 5.51 2 7.32 2 8.79 2.48 8.79 3.07L8.79 9.36C8.79 9.95 7.32 10.43 5.51 10.43 3.7 10.43 2.23 9.95 2.23 9.36Z" stroke="currentColor" stroke-width="1.2"/><path d="M8.79 3.07C8.79 3.66 7.32 4.14 5.51 4.14 3.7 4.14 2.23 3.66 2.23 3.07" stroke="currentColor" stroke-width="1.2"/><path d="M2.23 21.01 2.23 16.29 5.16 13 8.09 16.29 8.09 21.01Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.73 15.98 15.1 15.98 15.1 13.61 17.77 13.61 17.77 15.98 20.13 15.98 20.13 18.64 17.77 18.64 17.77 21.01 15.1 21.01 15.1 18.64 12.73 18.64Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.73 9.9 15.49 2 20.89 2 18.13 9.9Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu shape-picker" id="shapePicker" hidden>
        <div class="table-picker-label" id="shapePickerLabel">Shape library</div>
        <div class="shape-grid" id="shapeGrid"></div>
        <input type="file" id="shapeLibraryInput" accept="application/json,.json" style="display:none">
      </div>
    </div>
    <button class="btn" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M12 6v13M9 19h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="btn" data-tool="table" id="tableBtn" title="Table — drag across the grid to pick a size, then click to place (Y)" aria-haspopup="true" aria-expanded="false" aria-controls="tablePicker">

<script>
(function(){
  "use strict";

  // ---------- elements ----------
  const canvas = document.getElementById('canvas');
  let ctx = canvas.getContext('2d');   // reassigned briefly during PNG export to draw offscreen
  const wrap = document.getElementById('wrap');
  const hint = document.getElementById('hint');
  const textInput = document.getElementById('textInput');
  const strokeBtn = document.getElementById('strokeBtn');
  const fillBtn = document.getElementById('fillBtn');
  const textColorBtn = document.getElementById('textColorBtn');
  const strokeColorBar = document.getElementById('strokeColorBar');
  const fillColorBar = document.getElementById('fillColorBar');
  const textColorBar = document.getElementById('textColorBar');
  const strokePicker = document.getElementById('strokePicker');
  const fillPicker = document.getElementById('fillPicker');
  const textColorPicker = document.getElementById('textColorPicker');
  const sizeBtn = document.getElementById('sizeBtn');
  const sizeBtnLabel = document.getElementById('sizeBtnLabel');
  const sizePicker = document.getElementById('sizePicker');
  const sizeRange = document.getElementById('sizeRange');
  const sizeRangeLabel = document.getElementById('sizeRangeLabel');
  const dashPicker = document.getElementById('dashPicker');
  const sizeBtnLineEl = document.getElementById('sizeBtnLineEl');
  const fontFamilySel = document.getElementById('fontFamily');
  const fontSizeSel = document.getElementById('fontSize');
  const sizeGroup = document.getElementById('sizeGroup');
  const sizeSep = document.getElementById('sizeSep');
  const textOpts = document.getElementById('textOpts');
  const textOptsSep = document.getElementById('textOptsSep');
  const fillGroup = document.getElementById('fillGroup');
  const textColorGroup = document.getElementById('textColorGroup');
  const colorGroup = document.getElementById('colorGroup');
  const colorSep = document.getElementById('colorSep');
  const arrangeGroup = document.getElementById('arrangeGroup');
  const arrangeSep = document.getElementById('arrangeSep');
  const toDupBtn = document.getElementById('toDup');
  const groupBtn = document.getElementById('groupBtn');
  const ungroupBtn = document.getElementById('ungroupBtn');
  const toFrontBtn = document.getElementById('toFront');
  const toBackBtn = document.getElementById('toBack');
  const delSelBtn = document.getElementById('delSel');
  const toastEl = document.getElementById('toast');
  const polySep = document.getElementById('polySep');
  const polyGroup = document.getElementById('polyGroup');
  const polyFinishBtn = document.getElementById('polyFinish');
  const polyFinishOpenBtn = document.getElementById('polyFinishOpen');
  const polyCancelBtn = document.getElementById('polyCancel');

  const STORE_KEY = 'simplecanvas:v1';
  const FORMAT_VERSION = 2;     // bump when the saved-file schema changes (2: group pivots ignore stroke width)
  const BG = '#ffffff';
  const PRESETS = {   // swatch color -> its tooltip, in display order
    '#1f2937':'Dark', '#ef4444':'Red', '#f97316':'Orange', '#eab308':'Yellow', '#ffff00':'Neon Yellow', '#22c55e':'Green',
    '#22d3ee':'Cyan', '#3b82f6':'Blue', '#8b5cf6':'Purple', '#ec4899':'Pink', '#92400e':'Brown',
    '#ffffff':'White', '#e5e7eb':'Light Grey', '#78828e':'Dark Grey'
  };

  // ---------- state ----------
  let items = [];               // committed scene objects
  let current = null;           // in-progress preview object
  let ui = { tool:'pen', color:'#1f2937', size:6, strokeOn:true, fill:false, fillColor:'#ffd166', textColor:'#1f2937', fontFamily:'sans', fontSize:28, tableRows:3, tableCols:3, pendingShape:null,
             // a text box keeps its own border/fill/width, so plain text stays plain while shapes keep their outline
             text: { color:'#1f2937', size:2, strokeOn:false, fill:false, fillColor:'#ffd166' } };
  // the drawing defaults (color, size, strokeOn, fill, fillColor) that a tool or an item type uses
  const styleFor = t => t==='text' ? ui.text : ui;
  const drawStyle = () => styleFor(ui.tool);
  let dpr = 1, cssW = 0, cssH = 0;

  let undoStack = [], redoStack = [];
  let historyBefore = null;     // snapshot taken at start of an interaction
  let selection = [];           // indices of selected items (select tool)
  let drag = null;              // {sx,sy,moved} drag bookkeeping
  let marquee = null;           // {x0,y0,x,y,add} rubber-band selection in progress
  let clipboard = [];           // deep-cloned items for internal copy/paste
  let groupSeq = 0;             // counter for minting fresh group ids
  let resizing = null;          // {rotation,anchor*,snapshots,moved} while dragging a corner handle
  let rotating = null;          // {cx,cy,startAngle,startRotation,field,members,moved} while dragging the rotation handle
  let polyDraft = null;         // {color,size,fill,fillColor,points} while clicking out a polygon
  let longPressTimer = null;    // pending "open text for editing" timer while a click sits still on a text item
  let alignClickTimer = null;   // pending "set alignment" timer — cancelled if a dblclick follows (which only edits)
  let assetSeq = 0;
  const assets = {};            // id -> image data URL (kept out of history snapshots)
  const imgCache = new Map();   // id -> HTMLImageElement
  const HANDLE = 9;             // resize-handle hit radius (px)
  let erasing = null;           // {removed} while an erase gesture is active
  let cursorPt = null;          // eraser cursor position (for the ring)
  let endDrag = null;           // {idx,end:1|2,moved} while dragging one endpoint of a lone line/arrow
  // ---------- point-edit (curve) mode ----------
  let pointEditIdx = null;      // index into items[] currently in Point-Edit mode; null = not in this mode
  let activeAnchor  = null;     // index into that polygon's points[] whose handles are shown/draggable
  let editingAnchor = null;     // {idx,pointIndex,handle:'anchor'|'c1'|'c2',sx,sy,moved} while dragging
  const HANDLE_SUB = 8;         // control-handle hit radius (px) — slightly smaller than HANDLE, so anchor vs handle don't fight
  const KAPPA = 0.5522847498;   // 4-point cubic-bezier circle/ellipse approximation constant
  const CONVERTIBLE_TYPES = new Set(['line','arrow','rect','ellipse','polygon']);
  let snapPt = null;            // anchor a line/arrow endpoint is currently snapped to (for the indicator ring)
  let snapCursorPt = null;      // raw pointer position while placing/dragging a line/arrow endpoint (for hover-highlighting that one target's snap dots)
  let nudging = false;          // an arrow-key nudge has opened a history step that the matching keyup will commit
  const SNAP_R = 12;            // snap magnet radius (px)

  // ---------- helpers ----------
  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = n => Math.round(n*100)/100;
  // Every item carries a stable uid, so selection can follow an object's identity (not its array slot)
  // through undo/redo and reordering. Assigned lazily: whatever is missing one gets one at the next snapshot.
  let uidSeq = 0;
  const newUid = () => 'u' + Date.now().toString(36) + '-' + (uidSeq++).toString(36);
  function ensureUids(list){
    const seen = new Set();
    for(const it of list){ if(typeof it.uid !== 'string' || seen.has(it.uid)) it.uid = newUid(); seen.add(it.uid); }
    return list;
  }
  const snap = () => JSON.stringify(ensureUids(items));

  function beginHistory(){ historyBefore = snap(); }
  function commitHistory(){
    if(historyBefore === null) return;
    ensureUids(items);
    undoStack.push(historyBefore);
    if(undoStack.length > 80) undoStack.shift();
    redoStack = [];
    historyBefore = null;
    save(); updateButtons();
  }

  // ---------- scene validation ----------
  // Everything that comes from outside the running app (a saved file, the autosave) goes through
  // here before it may touch live state: unknown types and malformed geometry are dropped, colors
  // and numbers are normalized, images must have a real data-URL asset, text fonts are rebuilt.
  const ITEM_TYPES = ['path','line','arrow','rect','ellipse','polygon','text','table','image'];
  const MAX_ITEMS = 5000, MAX_POINTS = 20000, MAX_TEXT = 2000;
  textInput.maxLength = MAX_TEXT;   // the same limit the loader enforces, so nothing typed is cut on reload
  const isNum = v => typeof v === 'number' && Number.isFinite(v);
  const isColor = v => typeof v === 'string' && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v);   // CSS hex: 3, 4, 6 or 8 digits
  function normalizeItem(raw, assetsIn){
    if(!raw || typeof raw !== 'object' || ITEM_TYPES.indexOf(raw.type) < 0) return null;
    const it = { type: raw.type };
    const num = (k, d) => { const v = raw[k]; if(isNum(v)) return norm(v); if(d === undefined) throw new Error(k); return d; };
    const pts = min => {
      if(!Array.isArray(raw.points) || raw.points.length < min) throw new Error('points');
      return raw.points.slice(0, MAX_POINTS).map(q => {   // (the same cap the pen applies while drawing)
        if(!q || !isNum(q.x) || !isNum(q.y)) throw new Error('point');
        const out = {x:norm(q.x), y:norm(q.y)};
        // a garbage handle just degrades that segment back to a straight line — never drops the item
        if(q.c1 && isNum(q.c1.x) && isNum(q.c1.y)) out.c1 = {x:norm(q.c1.x), y:norm(q.c1.y)};
        if(q.c2 && isNum(q.c2.x) && isNum(q.c2.y)) out.c2 = {x:norm(q.c2.x), y:norm(q.c2.y)};
        return out;
      });
    };
    try{
      switch(it.type){
        case 'path': it.mode = ['pen','marker','brush'].indexOf(raw.mode) >= 0 ? raw.mode : 'pen'; it.points = pts(1); break;
        case 'polygon':
          it.points = pts(2);
          it.closed = raw.closed !== false;
          if(!it.closed && it.points.length < 2) return null;
          if(it.closed && it.points.length < 3) return null;
          // a plain polygon has no type-implied arrowhead the way 'arrow' does, so unlike line/arrow's
          // own hs/he validation below, both default to absent/false here — only `=== true` sets them
          if(raw.hs === true) it.hs = true;
          if(raw.he === true) it.he = true;
          break;
        case 'line': case 'arrow':
          it.x1 = num('x1'); it.y1 = num('y1'); it.x2 = num('x2'); it.y2 = num('y2');
          if(raw.hs) it.hs = true;
          if(raw.he === false) it.he = false;
          break;
        case 'rect': case 'ellipse': case 'image': case 'table': case 'text':
          it.x = num('x'); it.y = num('y'); it.w = num('w', it.type==='text' ? 40 : undefined); it.h = num('h', it.type==='text' ? 40 : undefined); break;
      }
      if(it.type === 'table'){
        it.rows = Math.min(100, Math.max(1, Math.round(num('rows', 3))));
        it.cols = Math.min(100, Math.max(1, Math.round(num('cols', 3))));
      }
      if(it.type === 'image'){
        const src = typeof raw.id === 'string' ? assetsIn[raw.id] : null;
        if(typeof src !== 'string' || !/^data:image\/[a-z0-9.+-]+;base64,/i.test(src)) return null;
        it.id = raw.id;
      } else {
        it.color = isColor(raw.color) ? raw.color : ui.color;
        it.size = Math.min(60, Math.max(1, num('size', ui.size)));
      }
      if(FILLABLE(it.type)) it.strokeOn = raw.strokeOn !== false;   // "no outline" only means something on a shape with an inside
      if(FILLABLE(it.type)){ it.fill = !!raw.fill; if(isColor(raw.fillColor)) it.fillColor = raw.fillColor; }
      if(DASHABLE(it.type) && (raw.dash==='tight' || raw.dash==='wide')) it.dash = raw.dash;
      if(it.type === 'text' || it.type === 'table'){
        if(isColor(raw.textColor)) it.textColor = raw.textColor;
        const fstr = typeof raw.font === 'string' ? raw.font : '';
        const m = /(\d+)px/.exec(fstr);   // the font string is what was actually rendered, so it wins over fontSize
        const px = m ? +m[1] : (isNum(raw.fontSize) ? raw.fontSize : 24);
        it.fontSize = Math.min(400, Math.max(6, Math.round(px)));
        it.fontFamily = (typeof raw.fontFamily === 'string' && FONTS[raw.fontFamily]) ? raw.fontFamily : familyOf({font:fstr});
        it.font = fontStr(it.fontFamily, it.fontSize);
      }
      if(it.type === 'text'){
        it.text = String(raw.text == null ? '' : raw.text).slice(0, MAX_TEXT);
        if(!it.text.trim()) return null;
        if(raw.align==='left' || raw.align==='right' || raw.align==='center') it.align = raw.align;
      }
      if(it.type === 'table' && Array.isArray(raw.texts)){
        it.texts = raw.texts.slice(0, it.rows).map(row=>Array.isArray(row) ? row.slice(0, it.cols).map(v=>String(v==null?'':v).slice(0,MAX_TEXT)) : []);
      }
      if(it.type === 'table' && Array.isArray(raw.aligns)){
        const okAlign = a => a==='left' || a==='right' || a==='center';
        it.aligns = raw.aligns.slice(0, it.rows).map(row=>Array.isArray(row) ? row.slice(0, it.cols).map(v=>okAlign(v)?v:'center') : []);
      }
      if(isNum(raw.rotation) && raw.rotation) it.rotation = raw.rotation;
      if(typeof raw.group === 'string' && raw.group.length <= 64){
        it.group = raw.group;
        it.groupRotation = isNum(raw.groupRotation) ? raw.groupRotation : 0;
      }
      if(typeof raw.uid === 'string' && raw.uid.length <= 64) it.uid = raw.uid;
    }catch(e){ return null; }
    return it;
  }
  // -> {items, assets, dropped}: the validated scene, only the assets it references, and how many
  // objects were unreadable. Never touches live state.
  function normalizeScene(rawItems, rawAssets, version){
    const assetsIn = (rawAssets && typeof rawAssets === 'object') ? rawAssets : {};

    const brokenGroups = new Set();
    for(const raw of (Array.isArray(rawItems) ? rawItems : [])){

      if(it) out.push(it);

    }

    // from the whole group's box), so their shared rotation can't be reproduced: ungroup them rather
    // than let them render somewhere else than they were saved.
    let ungrouped = 0;
    for(const it of out){

  // is the same as rotating around the new one plus a fixed shift, so shifting every member by that
  // amount keeps the group exactly where the old app drew it.
  function migrateGroupPivots(list){
    const groups = new Map();
    for(const it of list){ if(it.group != null && it.groupRotation){ if(!groups.has(it.group)) groups.set(it.group, []); groups.get(it.group).push(it); } }
    for(const members of groups.values()){
      const o = unionBoxOf(members, true), n = unionBoxOf(members, false);
      const ox = o.x+o.w/2 - (n.x+n.w/2), oy = o.y+o.h/2 - (n.y+n.h/2);
      if(!ox && !oy) continue;
      const rot = members[0].groupRotation, c = Math.cos(rot), si = Math.sin(rot);

  function load(){
    try{

    }catch(e){ console.warn('Could not load sketch:', e); }
  }

  // what a load had to leave out, as a short phrase ('' when nothing was)
  function sceneLoadNote(scene){
    const parts = [];
    if(scene.dropped) parts.push(scene.dropped + ' unreadable object' + (scene.dropped===1?'':'s') + ' skipped');
    if(scene.ungrouped) parts.push(scene.ungrouped + ' object' + (scene.ungrouped===1?'':'s') + ' ungrouped');

  function toast(msg){

  // ---------- sizing ----------
  function resize(){

  // ---------- drawing primitives ----------
  function strokeWidthOf(it){ return it.mode === 'brush' ? it.size*1.6 : it.size; }

  // ---------- shape description ----------
  // Every item is described once, as a short list of drawing primitives in its own (unrotated)
  // frame. The canvas renderer (drawItem) and the SVG exporter (itemToSVG) both consume that list,
  // so a shape cannot look different on screen and in an export.
  //   {kind:'path', d, style}                  d: ['M',x,y] ['L',x,y] ['Q',cx,cy,x,y] ['Z'] segments
  //   {kind:'rect', x,y,w,h, style}
  //   {kind:'ellipse', cx,cy,rx,ry, style}
  //   {kind:'dot', cx,cy,r, color, opacity}    a single-point freehand stroke
  //   {kind:'text', text, x,y,w,h, align, font, color}   one line, centered in a box
  //   {kind:'image', id, x,y,w,h}
  //   style: {fill, stroke, width, cap, join, opacity}   fill/stroke are a color or 'none'
  const fillOf = it => it.fill ? (it.fillColor || it.color) : 'none';
  const strokeOf = it => strokeOn(it) ? it.color : 'none';
  // line-style: 'tight'/'wide' dashed, or unset/'solid' for a plain line. Dash lengths scale with the
  // item's own stroke width so the pattern reads the same regardless of how thick the line is.
  const DASHABLE = t => t==='line' || t==='arrow' || t==='rect' || t==='ellipse' || t==='polygon' || t==='table' || t==='text';
  function dashArrayFor(kind, size){
    const w = Math.max(1, size||2);
    // 'tight' grows with the SQUARE ROOT of width, not linearly — a thicker line would otherwise blow
    // its dash/gap up proportionally too, and a "fine dashed" line stops reading as fine well before
    // you'd expect. Sub-linear growth keeps it visually tight at any stroke width.
    if(kind==='tight'){ const u = Math.sqrt(w)*3; return [u, u*0.75]; }

  const dashOf = it => dashArrayFor(it.dash, it.size);
  const boxStyle = it => ({ fill:fillOf(it), stroke:strokeOf(it), width:it.size, join:'round', dash:dashOf(it) });
  // text sits 6px in from the left/right edge, or on the center line
  function textAnchorX(x, w, align){ return align==='left' ? x+6 : align==='right' ? x+w-6 : x+w/2; }
  // freehand strokes are smoothed: each vertex becomes the control point of a quadratic curve

  function smoothSegments(p){
    const d = [['M', p[0].x, p[0].y]];

  function arrowHeadSegments(fx,fy,tx,ty,size){

  function polyCurveSegments(it){

  // ones) instead of only ever showing handles once one has already been dragged. Direction is the
  // tangent implied by the neighboring point(s) — a smooth-point default, like most vector editors
  // use when a corner is first given a curve. Returns null where that end has no meaningful handle
  // (the outgoing handle past the last point of an open path, or the incoming one before its first).
  function defaultHandleOffset(it, pointIndex, which){

          }

      }
      case 'text': {
        const style = boxStyle(it);
        if(style.fill!=='none' || style.stroke!=='none') ops.push({ kind:'rect', x:it.x, y:it.y, w:it.w, h:it.h, style });
        ops.push({ kind:'text', text:it.text, x:it.x, y:it.y, w:it.w, h:it.h, align:it.align||'center', font:it.font, color:it.textColor||it.color });
        break;
      }
      case 'table': {
        ops.push({ kind:'rect', x:it.x, y:it.y, w:it.w, h:it.h, style:boxStyle(it) });
        if(strokeOn(it)){
          const d = [];
          for(let i=1;i<it.rows;i++){ const yy = it.y + it.h*i/it.rows; d.push(['M', it.x, yy], ['L', it.x+it.w, yy]); }
          for(let j=1;j<it.cols;j++){ const xx = it.x + it.w*j/it.cols; d.push(['M', xx, it.y], ['L', xx, it.y+it.h]); }

  // ---------- canvas renderer ----------
  function tracePath(d){
    ctx.beginPath();

      else if(s[0]==='L') ctx.lineTo(s[1], s[2]);

        break;

      case 'dot':
        ctx.globalAlpha = op.opacity; ctx.fillStyle = op.color;
        ctx.beginPath(); ctx.arc(op.cx, op.cy, op.r, 0, Math.PI*2); ctx.fill();

      case 'path': tracePath(op.d); paintCurrentPath(op.style); break;
      case 'rect': ctx.beginPath(); ctx.rect(op.x, op.y, op.w, op.h); paintCurrentPath(op.style); break;
      case 'ellipse': ctx.beginPath(); ctx.ellipse(op.cx, op.cy, op.rx, op.ry, 0, 0, Math.PI*2); paintCurrentPath(op.style); break;
      case 'text':

    if(it.rotation){
      const b = bbox(it);
      const cx = b.x+b.w/2, cy = b.y+b.h/2;

  // Renders one line of text aligned within a box, vertically centered using its actual measured

  // Caller must set ctx.font (and ctx.fillStyle) first; this only touches textAlign/textBaseline.
  function drawAlignedText(text, boxX, boxY, boxW, boxH, align){
    if(!text) return;

  function drawTextDraftOutline(it){

  // ---------- bounding boxes / hit testing ----------

  // ---------- rotation helpers ----------

  function groupPivot(groupId){

  // ---------- snapping (line/arrow endpoints magnetize to these anchors) ----------

  function snapAnchorsOf(it){

        // midpoint on the top/bottom edges
        for(const fx of [0,.5,1]) for(const fy of [0,.5,1]) if(fx!==.5 || fy!==.5) pts.push({x:x0+W*fx, y:y0+H*fy});
